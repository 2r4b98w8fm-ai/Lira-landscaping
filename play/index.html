oct 7 — came home, bathroom light fixed, but my bedroom stuff was MOVED. not much. an inch. everything an inch.

if this keeps up I'm putting everything important in a locked note. code is the building. old and older.`},{id:"c1-n-donotopen",title:"DO NOT OPEN",timestamp:"2025-10-16T02:58:00",lock:{code:"1948",hintText:"“code is the building. old and older.” — the old street number, then the slot that shouldn't exist.",clueSourceIds:["c1-n-journal","c1-ph-mailbox"]},evidenceLabel:"The locked note — what Wren was too afraid to leave in the open",body:`if someone finds this and I'm gone: I didn't leave. whatever it looks like, I didn't leave.

No bus ticket. No withdrawn cash. Her cards never wake up again.

The report is accepted. Nobody reopens the flower shop. On your last read-through you notice the landlord's message again — “did you find who came by last night?” — and you close the file before you can think about it too long.`},{id:"c1-v-landlord",label:"Gerald Vann did this alone",description:"He entered without notice. He knew things he couldn't know. He told her to stop asking about the tenants.",requiredEvidenceIds:["c1-m-ll-8","c1-vm-landlord","c1-m-ll-7","c1-ph-basement"],isCanon:!1,epilogue:`Vann is brought in twice. He's cooperative both times, in the way of a man reading from something rehearsed. Yes, he sent maintenance without notice — sloppy, he says. Yes, he told her to leave the tenants alone. Tenants like privacy.

Asked to produce a tenant list for units 2A and 3A, he provides names. The names have utility accounts, signatures, renewed leases. None of them have faces — no license photos, no employer records, nothing older than the building's renumbering.

The charge doesn't hold. Vann still manages the building. He fixed the buzzer, finally. It rings sometimes with nobody at the door, and he apologizes for it to whoever asks, and his eyes go to the basement door while he does.`},{id:"c1-v-group",label:"The building took her",description:"Not one person. A membership. Cameras behind the walls, a console signed in as “Warden,” and a note that said she'd already joined.",requiredEvidenceIds:["case-01.hidden","c1-m-unk-6","c1-n-donotopen","c1-cal-wall","c1-ph-314"],isCanon:!0,epilogue:`Your report names no suspect. It names the building.

The console is real — forensics confirms feeds wired into the wall cavities of every unit, older than any current lease, older than the shuttered florist below. The account “WARDEN” logs in from inside the building's own subnet. It logs in DURING the forensic image. Nobody finds the room the signal comes from; the basement measures three meters shallower inside than the foundation plans say it should.

Units 2A and 3A are served notice. The letters are accepted and signed — “resident.” No one is ever home.

Wren Castellan is not found. Reyna Osei's car is still on Corving Street; her thread still says she's typing. The lease for 4B relists in the spring. Someone new will sign it, and be enrolled automatically, and be loved.

Your own phone's flashlight works normally. You've checked it more than once now. That's how it starts — checking.`},{id:"c1-v-unknown",label:"The evidence doesn't add up to anything human",description:"A voicemail from inside an evidence locker. A search made after she was gone. A voice in the wall speaking tomorrow's words.",requiredEvidenceIds:["c1-vm-breathing","c1-b-leave","c1-ph-window2"],isCanon:!1,epilogue:`You write the honest version: the timeline is not reconstructible because the timeline does not obey order. A voicemail arrives at a phone in shielded storage. A search is typed by nobody. A photo edits itself the night after its photographer stops existing.

The report is returned to you with a sticky note: “resubmit without section 4.” You resubmit without section 4. It is accepted immediately.

At 11:11 that night your calendar — yours, on your phone — chimes once. There's no event when you look. You keep the phone face-down after that, and you do not photograph your hallway, and mostly that works.`}]},Rt=Object.freeze(Object.defineProperty({__proto__:null,default:Mt},Symbol.toStringTag,{value:"Module"})),Ht={id:"case-02",title:"Rideshare, One Star",victimName:"Mara Quist, 31",summary:"A night-shift rideshare driver vanished between a pickup and a drop-off that the platform says never happened. The passenger who requested her isn't in her contacts. He knew her schedule better than she did.",intake:`SUBJECT: Quist, Mara E. (31). Reported missing by brother Nov 8 after her car was found on Van Winkle Court — engine running, hazards on, driver door open, wallet and keys present.

Second-pass review requested. Flag anything the first pass missed.`,contentWarningLevel:2,phone:{ownerLabel:"MQ — driving, text later",recoveredAt:"2025-11-09T23:10:00",batteryStart:61,wallpaperHue:262,lockScreenNotifications:[{appId:"messages",title:"Sam",preview:"cops found the car. mara if you see this CALL ME",targetId:"c2-th-sam"},{appId:"messages",title:"Unknown",preview:"five stars.",targetId:"c2-th-unknown"},{appId:"phone",title:"Voicemail",preview:"Mara Quist (this phone) · 0:40",targetId:"c2-vm-self"}]},messages:[{id:"c2-th-sam",contactName:"Sam",contactNumber:"(503) 555-0177",messages:[{id:"c2-m-sam-1",from:"them",text:"you still doing nights? mom worries. I worry but cooler",timestamp:"2025-10-20T21:14:00"},{id:"c2-m-sam-2",from:"owner",text:"nights pay double, sammy. airport queue + bar rush. I'm careful",timestamp:"2025-10-20T21:30:00"},{id:"c2-m-sam-3",from:"owner",text:"weird one tonight. same guy twice in one week. books from different corners but it's the same guy, I know the cologne. asked why I stopped doing the eastside loop. I never told any rider I changed my loop",timestamp:"2025-10-28T03:40:00",evidenceLabel:"Mara told her brother the same rider kept finding her — and knew her route change"},{id:"c2-m-sam-4",from:"them",text:"report him?? block him???",timestamp:"2025-10-28T08:15:00"},{id:"c2-m-sam-5",from:"owner",text:"reported a guy in june for grabbing my headrest and screaming at me. platform gave me a 'we hear you' email and HE one-starred ME. reporting does nothing",timestamp:"2025-10-28T08:44:00",evidenceLabel:"She reported a rider in June; he retaliated with a 1-star"},{id:"c2-m-sam-6",from:"them",text:"get a dash cam at least. I'll pay half",timestamp:"2025-10-28T08:50:00"},{id:"c2-m-sam-7",from:"owner",text:"already got one. the sd card keeps being full of nothing. like recorded-over nothing",timestamp:"2025-10-28T09:02:00"},{id:"c2-m-sam-8",from:"them",text:"you didn't answer yesterday. calling mom if you don't reply by noon",time june 12 — the original ride. screamed at me over a detour HE requested. grabbed my headrest. reported it.

june 22 — my rating drops. one star, no comment. his account should be banned. it isn't.

oct 23 — pickup at hollis & 9th. same cologne. different name on the account. didn't talk the whole ride, just hummed something. tipped exact.

oct 27 — AGAIN. corner of drury. knew I'd switched loops. asked 'how's the window?' I never posted about the window.

nov 1 — priya says the girls are all seeing him. or someones like him. platform says targeting isn't possible. the platform also said my report was 'unverifiable'

he doesn't book through the normal app. priya's right. the requests come in already knowing. I tested it — I turned my driver app OFF and parked on randall. four minutes later: ping. pickup request. my exact corner. app was off. that's not a stalker with an app. that's someone inside the pipe.

I asked dex to log the sedan. I told sam a half version so he doesn't panic. I keep the doors locked between fares now.

tomorrow I'm taking the cancelled-pickup bait. one lap around van winkle with the cam running. get the plate, get the face, go to the police with a FILE, not a feeling.

if the file isn't here: check the dash cam card. if the card is blank again, then he was already in the pipe there too, and I'm sorry. tell mom it was the money, tell her I was two months out.`},{id:"c2-n-groceries",title:"before sunday",timestamp:"2025-11-05T12:00:00",body:`bread from the good place

Sam keeps paying to keep her number active. Once a month he calls it just to hear the greeting. In February the greeting changes. Nobody at the carrier can explain that, and Sam stops calling.`},{id:"c2-v-passenger",label:"PASSENGER_0 took her",description:"Someone with inside access hunted her through her own phone — injected trips, wiped cameras, adjusted ratings — and finally requested her to a dead end.",requiredEvidenceIds:["case-02.hidden","c2-m-unk-3","c2-ph-sedan","c2-vm-priya","c2-pin-vanwinkle"],isCanon:!0,epilogue:`Your report names the mechanism, because the mechanism is all anyone ever finds. A shadow ops client, sideloaded through a public charging cable at the depot she felt safest in. Thirty-four injected trips. Nine wiped dash-cam cards. A rating docked to keep her scared of the platform instead of protected by it.

RideLoop confirms the build is real and internal, then confirms nothing else, then settles with the family under seal. The employee list for the tool comes back with one entry redacted for 'ongoing separation proceedings.' The name never unredacts. The gray sedan's plate — 40-something-83 — matches nothing, which is its own kind of answer: plates that match nothing are issued to somebody.

Mara is not found. Priya quits nights, then quits driving, then moves. On her last shift, one final request pinged her from Van Winkle Court and cancelled itself before she could decline it. Five stars, it said. Trip complete.`},{id:"c2-v-carjack",label:"A carjacking that went wrong",description:"Wrong street, wrong hour, a stranger with no pattern at all. The window job was a first attempt.",requiredEvidenceIds:["c2-ph-window","c2-ph-culdesac","c2-m-gl-3"],isCanon:!1,epilogue:`Random predation: the tampered window as a failed first try, the dead end as an ambush of opportunity. It's clean, it fits on one page, and the detective who signs off on it has thirty years and a bad shoulder and has seen it a hundred times.

Except nothing was taken. Not the car, not the wallet, not the $61 in the console. And random strangers don't text their victims 'five stars' on a 24-hour delay, to the minute, like an anniversary.

The file stays open in the way files stay open — technically. You think about the humming voicemail more than you'd like. There was a witness who said she heard humming on Van Winkle that night. You never interviewed her. The report was already signed.`},{id:"c2-v-unknown",label:"The evidence contradicts itself",description:"A phone that called itself from an evidence bag. Headlights with no car. A surge zone on her own street.",requiredEvidenceIds:["c2-vm-self","c2-ph-mirror-shot","c2-ph-heatmap"],isCanon:!1,epilogue:`You write the version nobody upstairs wants: the data is not a record of events, because some of these events cannot have occurred. A handset called itself from inventory. A rearview photo shows light with no source. A demand algorithm drew a bullseye on a driver's home and no one can produce the inputs.

The response is a meeting where the word 'telemetry' is used the way people use garlic against vampires. Your section 3 is moved to an appendix. The appendix is moved to storage.

Years on, a class action against RideLoop surfaces internal tickets about 'phantom sessions' in the ops tooling — sessions with no badge, no IP, no employee. The tickets are real. The sessions were never attributed. The tool was retired, not because they found who was inside it, but because they couldn't.`}]},Ot=Object.freeze(Object.defineProperty({__proto__:null,default:Ht},Symbol.toStringTag,{value:"Module"})),Dt={id:"case-03",title:"Grief Group",victimName:"Edith Marsh, 58",summary:"A widow joined an online grief-support circle that promised she'd never have to 'carry it alone.' Members carry it together for exactly one year. Then, one by one, they stop needing to carry anything at all.",intake:`SUBJECT: Marsh, Edith A. (58). Reported missing by daughter Claire Marsh, Nov 3, after a scheduled call went unanswered.

DEVICE: Recovered Nov 3, 19:20, kitchen table. Battery 44%. Beside it: a packed suitcase, a lit battery lantern on the porch rail, and the house keys in an envelope labeled 'for the next family.'

FINANCIAL: Oct 30 wire transfer of $118,000 (proceeds of husband's life insurance) to a fund named 'Lantern Bridge Trust.' Trust registration traces to a mail-forwarding storefront.

NOTES: Subject was active in an online community, 'The Lantern Circle.' At least two other members reported missing by relatives in the past three years — both roughly one year after joining. Second-pass review requested.`,contentWarningLevel:2,phone:{ownerLabel:"Edie's phone",recoveredAt:"2025-11-04T20:05:00",batteryStart:44,wallpaperHue:42,lockScreenNotifications:[{appId:"messages",title:"Claire",preview:"Mom I'm at the house. Your suitcase is here. Where are YOU?",targetId:"c3-th-claire"},{appId:"messages",title:"Maren 🕯",preview:"You don't need the suitcase, love. You won't need anything.",targetId:"c3-th-maren"},{appId:"calendar",title:"YEAR WALK 🌅",preview:"Tomorrow at 4:44 AM",targetId:"c3-cal-yearwalk"}]},messages:[{id:"c3-th-claire",contactName:"Claire",contactNumber:"(612) 555-0150",messages:[{id:"c3-m-cl-1",from:"them",text:"checking on you. did you eat something real today, not just toast",timestamp:"2025-02-10T18:30:00"},{id:"c3-m-cl-2",from:"owner",text:"Soup counts as real. Your father would say soup counts.",timestamp:"2025-02-10T18:52:00"},{id:"c3-m-cl-3",from:"them",text:"he would say soup counts TWICE. ok good. love you",timestamp:"2025-02-10T18:55:00"},{id:"c3-m-cl-4",from:"owner",text:"I joined a little online group. Widows and widowers. It's nice to talk to people who don't flinch.",timestamp:"2025-02-19T20:14:00"},{id:"c3-m-cl-5",from:"them",text:"mom that's really good actually. proud of you",timestamp:"2025-02-19T20:20:00"},{id:"c3-m-cl-6",from:"owner",text:"They have a saying: you never carry it alone. I cried in a good way for the first time since January.",timestamp:"2025-02-19T20:31:00"},{id:"c3-m-cl-7",from:"them",text:"you cancelled sunday again :( third time. the group thing is tuesdays right? what's on sundays?",timestamp:"2025-09-28T19:40:00",evidenceLabel:"By September the Circle had replaced her Sundays with Claire"},{id:"c3-m-cl-8",from:"owner",text:"Just Circle homework, sweetheart. Reflections. It's my anniversary year, they say the first year has to be finished properly.",timestamp:"2025-09-28T20:02:00",evidenceLabel:"“The first year has to be finished properly” — the Circle's phrase in Edie's mouth"},{id:"c3-m-cl-9",from:"them",text:"finished? finished how?",timestamp:"2025-09-28T20:05:00"},{id:"c3-m-cl-10",from:"owner",text:"You'll laugh at me. There's a sunrise walk. A Year Walk. Everyone does one. It's just a walk, Claire.",timestamp:"2025-09-28T20:18:00"},{id:"c3-m-cl-11",from:"them",text:"ok. weird vibes but a walk is a walk. I want to come with",timestamp:"2025-09-28T20:20:00"},{id:"c3-m-cl-12",from:"owner",text:"Family can't come. It's members only. It's about walking INTO the new year, not being pulled back into the old one.",timestamp:"2025-09-28T20:29:00",evidenceLabel:"Family explicitly excluded from the “Year Walk”"},{id:"c3-m-cl-13",from:"them",text:"Mom I'm at the house. Your suitcase is here. Where are YOU?",timestamp:"2025-11-03T18:44:00"}]},{id:"c3-th-maren",contactName:"Maren 🕯",contactNumber:"(844) 555-0111",messages:[{id:"c3-m-ma-1",from:"them",text:"Edie, it's Maren from Circle. I facilitate Tuesdays. I just wanted you to know privately: what you shared tonight about Walter's chair was one of the bravest things I've heard in eleven years of this work.",timestamp:"2025-02-25T21:30:00"},{id:"c3-m-ma-2",from:"owner",text:"That's very kind. I almost didn't say it out loud.",timestamp:"2025-02-25T21:44:00"},{id:"c3-m-ma-3",from:"them",text:"Out loud is how it stops being a stone in your chest. We're so glad you found us. You were always going to find us.",timestamp:"2025-02-25T21:47:00",evidenceLabel:"Maren: “You were always going to find us”"},{id:"c3-m-ma-4",from:"them",text:"A year sounds long, but the anniversary is a door, Edie. Circle members don't stand in front of the door crying. We walk through it together.",timestamp:"2025-08-12T22:10:00"},{id:"c3-m-ma-5",from:"owner",text:"Gordon said something odd tonight. About the ones who finished their year. He said nobody hears from them after. Is that true?",timestamp:"2025-10-07T22:41:00",evidenceLabel:"Edie asked Maren why finished members are never heard from again"},{id:"c3-m-ma-6",from:"them",text:"Gordon is in a doubting season. It happens near the anniversary — the old life fights hardest right before it lets go. The finished ones are at peace, Edie. They simply don't need the group anymore. Isn't that the goal?",timestamp:"2025-10-07T22:50:00"},{id:"c3-m-ma-7",from:"them",text:"Logistics for your Walk, love: the van comes at 4. Wear comfortable shoes. Bring the paperwork we discussed, signed. Leave your phone — the first year lives in that phone, and you are finishing the first year.",timestamp:"2025-11-01T20:00:00",evidenceLabel:"Maren's instructions: the van at 4, signed paperwork, leave the phone"},{id:"c3-m-ma-8",from:"owner",text:"Claire will worry. Can I at least leave her a letter?",timestamp:"2025-11-01T20:15:00"},{id:"c3-m-ma-9",from:"them",text:"The Circle writes to the families afterward. It's gentler coming from us. You'd be surprised how often the families join, in time. Grief runs in families, Edie. 🕯",timestamp:"2025-11-01T20:22:00",evidenceLabel:"“You'd be surprised how often the families join, in time.”"},{id:"c3-m-ma-10",from:"them",text:"You don't need the suitcase, love. You won't need anything.",timestamp:"2025-11-03T03:41:00"}]},{id:"c3-th-circle",contactName:"The Lantern Circle (group)",ghostTypingAfterSeconds:420,messages:[{id:"c3-m-ci-1",from:"them",text:"Rosa: Tuesday check-in thread 🕯 One word for today, everyone. Mine: 'lighter'",timestamp:"2025-03-04T19:00:00"},{id:"c3-m-ci-2",from:"owner",text:"Edie: 'quieter'. The house I mean. But maybe me too.",timestamp:"2025-03-04T19:12:00"},{id:"c3-m-ci-3",from:"them",text:"Maren: Beautiful, Edie. The house gets quieter and then, one day, the quiet gets kind. ✨",timestamp:"2025-03-04T19:14:00"},{id:"c3-m-ci-4",from:"them",text:"Gordon: my one word is 'february'. it's june. I know. it's still february in here.",timestamp:"2025-06-10T19:05:00"},{id:"c3-m-ci-5",from:"them",text:"Rosa: Celebrating our own Tomas tonight, everyone — his Year Walk is at sunrise! 🌅 Walk well, Tomas. We'll carry the rest.",timestamp:"2025-07-19T21:00:00",evidenceLabel:"The group celebrating a member's “Year Walk” — Tomas, never heard from again"},{id:"c3-m-ci-6",from:"owner",text:"Edie: Has anyone heard how Tomas is doing? His anniversary walk was weeks ago.",timestamp:"2025-08-09T19:30:00"},{id:"c3-m-ci-7",from:"them",text:"Maren: Tomas is finished, Edie. Finished members rest. We don't disturb the rested. 🕯",timestamp:"2025-08-09T19:33:00",evidenceLabel:"“Finished members rest. We don't disturb the rested.”"},{id:"c3-m-ci-8",from:"them",text:"Gordon: does anyone else notice we only ever celebrate walks. never birthdays. never new apartments. never grandkids. just walks",timestamp:"2025-10-14T19:22:00",evidenceLabel:"Gordon: the group only ever celebrates departures"},{id:"c3-m-ci-9",from:"them",text:"Rosa: Gordon has left the group.",timestamp:"2025-10-14T19:25:00"},{id:"c3-m-ci-10",from:"them",text:"Maren: Gordon's doubting season needed privacy, everyone. Hold him gently. His walk is still scheduled. 🕯",timestamp:"2025-10-14T19:26:00",evidenceLabel:"Gordon “left” — but Maren says his walk is still scheduled"}]},{id:"c3-th-gordon",contactName:"Gordon (Circle)",contactNumber:"(612) 555-0186",messages:[{id:"c3-m-go-1",from:"them",text:"edie. it's gordon. off the group. can we talk here instead",timestamp:"2025-10-14T21:00:00"},{id:"c3-m-go-2",from:"owner",text:"Gordon! They said you left. Are you all right?",timestamp:"2025-10-14T21:08:00"},{id:"c3-m-go-3",from:"them",text:"I didn't leave. I got removed the second I counted out loud. edie LISTEN. I found rosa's sister on the internet. rosa's been 'in the group' 6 years. her sister buried an empty casket in 2021. the family got a LETTER. typed. 'rosa is finished and at peace, she asks for privacy.'",timestamp:"2025-10-14T21:15:00",evidenceLabel:"Gordon found a member's family who buried an empty casket after a typed letter"},{id:"c3-m-go-4",from:"owner",text:"Rosa posts every Tuesday, Gordon.",timestamp:"2025-10-14T21:18:00"},{id:"c3-m-go-5",from:"them",text:"SOMETHING posts every tuesday. read rosa's messages from before 2021 and after. count the words. the after-rosa has never once used the word 'I' about the past. it's a puppet account edie. maybe half the group is puppets. warm little voices keeping the next ones calm",timestamp:"2025-10-14T21:24:00",evidenceLabel:"Gordon: departed members' accounts keep posting — “warm little voices keeping the next ones calm”"},{id:"c3-m-go-6",from:"owner",text:"Then what happens on the walk, Gordon?",timestamp:"2025-10-14T21:30:00"},{id:"c3-m-go-7",from:"them",text:"I don't know. that's the honest answer. what I know is: insurance money moves first. then the walk. then a letter. I'm going to the farm they use. hollis farm road. if I'm wrong I'll apologize to everyone. if I'm right you'll never hear from me and DO NOT GO ON YOUR WALK",timestamp:"2025-10-26T23:40:00",evidenceLabel:"Gordon's last text: he went to Hollis Farm Road to see for himself"}]},{id:"c3-th-walt",contactName:"Walt ❤",contactNumber:"(612) 555-0122",messages:[{id:"c3-m-wa-1",from:"owner",text:"The plow guy did the driveway wrong again. You'd have gone out there in your robe.",timestamp:"2025-02-02T08:15:00"},{id:"c3-m-wa-2",from:"owner",text:"Claire taught me the group chat thing. You'd hate it. You'd love hating it.",timestamp:"2025-03-11T21:04:00"},{id:"c3-m-wa-3",from:"owner",text:"I joined a group. They say I carried you alone too long. I don't know how to explain that carrying you was the last job you left me and I liked having it.",timestamp:"2025-04-02T22:30:00",evidenceLabel:"Edie's texts to her dead husband's number — her real, private grief"},{id:"c3-m-wa-4",from:"owner",text:"Our anniversary is coming. The group has a whole thing about it. A walk. I keep thinking: 42 years and I finish it with a WALK? You'd say 'finish what, exactly, Edith?' You'd be right to ask.",timestamp:"2025-10-20T23:11:00"},{id:"c3-m-wa-5",from:"owner",text:"Apartment 22 on Dunmore. Then the house. Then the good years, then the hospital year. If I could pick one door to knock on it's 22.",timestamp:"2025-10-29T22:47:00",evidenceLabel:"Edie to Walt: “If I could pick one door to knock on it's 22”"},{id:"c3-m-wa-6",from:"them",text:"soon",timestamp:"2025-11-03T04:44:00",evidenceLabel:"A one-word reply from Walt's number — disconnected since January — at 4:44 AM"}]},{id:"c3-th-pastor",contactName:"Pastor Lindqvist",contactNumber:"(612) 555-0171",messages:[{id:"c3-m-pa-1",from:"them",text:"Edie, we missed you at coffee hour. No pressure — the door's open whenever.",timestamp:"2025-05-04T13:00:00"},{id:"c3-m-pa-2",from:"owner",text:"Thank you, Pastor. I've found a group that suits where I am right now. Please don't worry.",timestamp:"2025-05-04T14:20:00"},{id:"c3-m-pa-3",from:"them",text:"Of course. Just — an old man's caution: groups that suit where you are should also let you leave where you are. Coffee's always on.",timestamp:"2025-05-04T14:35:00",evidenceLabel:"Her pastor's warning: a good group should also let you leave"}]},{id:"c3-th-bank",contactName:"Harbor Bank",messages:[{id:"c3-m-bk-1",from:"them",text:"Harbor Bank: A wire transfer of $118,000.00 has been initiated from your account to LANTERN BRIDGE TRUST. If this wasn't you, call immediately.",timestamp:"2025-10-30T10:12:00",evidenceLabel:"The $118,000 wire — Walt's life insurance — to “Lantern Bridge Trust”"},{id:"c3-m-bk-2",from:"owner",text:"It was me.",timestamp:"2025-10-30T10:30:00"},{id:"c3-m-bk-3",from:"them",text:"Harbor Bank: Thank you for confirming. Tip: wires cannot be recalled once settled.",timestamp:"2025-10-30T10:31:00"}]},{id:"c3-th-neighbor",contactName:"Bev (next door)",contactNumber:"(612) 555-0139",messages:[{id:"c3-m-be-1",from:"them",text:"Your porch lantern's been on three nights running, hon. Bulb'll go. Want Ray to get the ladder?",timestamp:"2025-11-01T17:45:00"},{id:"c3-m-be-2",from:"owner",text:"Leave it lit, Bev. It's a group thing. It tells them which house.",timestamp:"2025-11-01T18:02:00",evidenceLabel:"“Leave it lit. It tells them which house.”"},{id:"c3-m-be-3",from:"them",text:"Tells WHO which house??",timestamp:"2025-11-01T18:04:00"}]},{id:"c3-th-pharmacy",contactName:"Corner Drug",messages:[{id:"c3-m-ph-1",from:"them",text:"Corner Drug: Your refill is ready. We're open until 7.",timestamp:"2025-10-28T10:00:00"},{id:"c3-m-ph-2",from:"them",text:"Corner Drug: Reminder — refill not yet collected. We'll hold it 10 more days.",timestamp:"2025-11-04T10:00:00"}]},{id:"c3-th-podcast",contactName:"Stillwater Grief Letters",messages:[{id:"c3-m-po-1",from:"them",text:"This week's letter: 'The Chair.' On keeping things exactly where they left them — and the day you move the chair. 🎧",timestamp:"2025-03-02T08:00:00"},{id:"c3-m-po-2",from:"them",text:"This week's letter: 'Anniversaries Are Not Deadlines.' Grief doesn't file paperwork. Anyone who gives your grief a due date wants something from it. 🎧",timestamp:"2025-10-26T08:00:00",evidenceLabel:"A grief podcast's warning: anyone who gives grief a due date wants something from it"}]}],photos:[{id:"c3-ph-garden",caption:"Walt's tomatoes came back without him. Rude of them. Wonderful of them.",timestamp:"2025-06-14T09:30:00",aspect:"landscape",meta:{takenAt:"2025-06-14T09:30:00",device:"This phone"},svg:s('<rect width="400" height="120" fill="#20262e"/><rect y="120" width="400" height="180" fill="#161b14"/>'+Array.from({length:5},(t,e)=>`<path d="M${60+e*70} 260 V150" stroke="#2c3a26" stroke-width="5"/><circle cx="${55+e*70}" cy="${170+e%3*20}" r="9" fill="#5c3a2e"/><circle cx="${70+e*70}" cy="${195+e%2*15}" r="7" fill="#6b4433"/>`).join("")+'<rect x="0" y="255" width="400" height="8" fill="#0e120c"/>',{aspect:"landscape",base:"#12150f",grain:.11})},{id:"c3-ph-chair",caption:"moved his chair today. si n:"",timestamp:"2025-11-03T04:02:00",aspect:"portrait",deleted:!0,meta:{takenAt:"2025-11-03T04:02:00",device:"This phone"},svg:s('<rect width="300" height="400" fill="#060708"/><circle cx="150" cy="230" r="10" fill="#c89a4a" opacity="0.25"/>',{aspect:"portrait",base:"#050607",grain:.2}),flashlight:{hiddenSvg:s('<rect width="300" height="400" fill="#0b0d10"/><rect x="0" y="320" width="300" height="18" fill="#181410"/><rect x="130" y="200" width="40" height="70" rx="6" fill="#221c12"/><circle cx="150" cy="230" r="12" fill="#c89a4a" opacity="0.85"/>'+g(60,310,.85,.75,"#05060a")+g(105,315,.85,.75,"#05060a")+g(200,312,.85,.75,"#05060a")+g(245,316,.85,.75,"#05060a")+E("04:02:33",300,400),{aspect:"portrait",base:"#090a0d",grain:.12})},evidenceLabel:"Deleted 4:02 AM photo: figures waiting in a row at the fence, past the lantern light"},{id:"c3-ph-recipe",caption:"found his handwriting in the flour tin. hi walt",timestamp:"2025-09-12T10:30:00",aspect:"portrait",meta:{takenAt:"2025-09-12T10:30:00",device:"This phone"},svg:s('<rect width="300" height="400" fill="#17140f"/><rect x="55" y="90" width="190" height="230" fill="#d3cab4" opacity="0.88" transform="rotate(-3 150 205)"/>'+Array.from({length:7},(t,e)=>`<path d="M80 ${130+e*26} q 30 ${e%2?4:-4} 60 0 t 60 0" stroke="#4a4232" stroke-width="2.5" fill="none" opacity="0.8"/>`).join(""),{aspect:"portrait",base:"#110f0b",grain:.1})},{id:"c3-ph-tuesday",caption:"my tuesday setup. tea, walt's afghan, nine little squares of people who understand",timestamp:"2025-07-08T18:55:00",aspect:"landscape",meta:{takenAt:"2025-07-08T18:55:00",device:"This phone"},svg:s('<rect width="400" height="300" fill="#191510"/><rect x="90" y="70" width="220" height="140" rx="8" fill="#0d0f13"/>'+Array.from({length:9},(t,e)=>`<rect x="${100+e%3*70}" y="${80+Math.floor(e/3)*42}" width="60" height="36" rx="3" fill="#1f242c"/><circle cx="${130+e%3*70}" cy="${98+Math.floor(e/3)*42}" r="9" fill="#2e333c"/>`).join("")+'<ellipse cx="60" cy="250" rx="26" ry="14" fill="#3a2f22"/><rect x="52" y="220" width="16" height="24" rx="6" fill="#4a3c2a"/>',{aspect:"landscape",base:"#131009",grain:.12})}],notes:[{id:"c3-n-circle-notes",title:"Circle homework",timestamp:"2025-10-21T20:30:00",evidenceLabel:"Her Circle “homework” — the program's script, in her handwriting",body:`Week 34 reflection: 'What does your grief still own?'

The house (his chair, his side, his mug I still fill)
The money (I haven't touched it. It feels like spending him)
Sundays
My name — Mrs. Marsh is a door he holds open

I'm not sure anymore. That's the truth I couldn't say on Tuesdays. Gordon counted things out loud and then Gordon was gone from the group and his 'walk is still scheduled' — Claire, they schedule your leaving FOR you and call it yours.

I signed the trust papers. That was real money and I signed it away and I need you to hear why: they said grief is weight, and money is the heaviest weight, and I was so tired of being strong about weight. It sounds like a scam when I type it. It felt like church when they said it.

Tomorrow at 4 a van comes. I packed a suitcase they told me not to pack. If I get in that van and it's what they promise — rest, an ending to the year, a door — I'll write to you myself, in my own hand, with the pen from the kitchen drawer, and I'll use the word 'rhubarb' so you know it's me.

If a typed letter comes instead: it wasn't me. Take this phone to the police and tell them about Hollis Farm Road.

You are viewing what Maren sees.`,entries:[{label:"R. JELINEK",status:"MAINTAINED",detail:"voice: active · posts Tuesdays · yr 4 post-walk"},{label:"T. FERREIRA",status:"MAINTAINED",detail:"voice: active · walked 07/20 · estate settled"},{label:"G. HALLOWAY",status:"DOUBT — RETIRED EARLY",detail:"walked 10/27 (unscheduled) · no letter sent yet"},{label:"E. MARSH",status:"PREPARED",detail:"trust settled 10/30 · walk 11/03 · letter drafted"},{label:"B. OKONKWO",status:"MONTH 7",detail:"attachment: daughter (flagged)"},{label:"D. PRICE",status:"MONTH 3",detail:"estate: pending probate · patience"},{label:"C. MARSH",status:"REFERRED",detail:"grief event projected · source: E. MARSH walk"}],footer:"The last row is her daughter. The ledger projects Claire's grief — the grief of losing Edie — as next year's intake. The Circle does not find the grieving. The Circle farms them.",evidenceLabel:"The Facilitator ledger: members “maintained” after walking — and Claire already “referred”"},liveEvents:[{id:"c3-live-circle",kind:"message",afterSeconds:320,threadId:"c3-th-circle",message:{id:"c3-m-ci-live",from:"them",text:"Edie: Feeling so light tonight, everyone. The house is quiet and the quiet is kind. 🕯",timestamp:"2025-11-04T20:11:00",evidenceLabel:"“Edie” posting in the group — while her phone lies in an evidence review"}},{id:"c3-live-referral",kind:"notification",afterSeconds:600,title:"Lantern Circle",body:"A place has been held for someone you love.",glitch:!0}],verdicts:[{id:"c3-v-chose",label:"She walked out of her old life willingly",description:"Grief, a signed deed, a packed bag she left behind. Maybe the Circle only gave her the door she was already looking for.",requiredEvidenceIds:["c3-m-bk-1","c3-ph-paperwork","c3-n-circle-notes"],isCanon:!1,epilogue:`Voluntary association, voluntary gift, voluntary departure — legally, it holds. Adults are allowed to give everything away. Adults are allowed to walk at dawn.

Six weeks later a letter arrives at Claire's apartment. Typed. 'Edith is finished and at peace. She asks for privacy.' There is no word 'rhubarb' anywhere in it.

Claire brings it to you, holding it flat on both palms like something that might go off. You reread your own report. 'Voluntary' is still the right legal word. You no longer believe it is the true one.`},{id:"c3-v-circle",label:"The Circle harvests the grieving",description:"A year of love-bombing, the estate moved first, the walk scheduled for her, the members' voices puppeted afterward — and her daughter already in the ledger.",requiredEvidenceIds:["case-03.hidden","c3-m-ma-7","c3-m-go-5","c3-cal-yearwalk","c3-vm-gordon"],isCanon:!0,epilogue:`Your report maps the machine: intake through grief keywords, a year of scripted warmth, the estate moved in the final week, the Walk, the typed letter, and then the harvested member's account kept warm — posting every Tuesday, forever 'lighter' — to soothe the next intake. Rosa. Tomas. Gordon, retired early for counting out loud. Edith, prepared.

The Lantern Bridge Trust unwinds into eleven shell entities and a mail slot. The farm parcel is searched: no structures, no lanterns — but the ground at the fence line is packed hard in a long straight row, the way earth gets when many people walk the same line many times. No one is charged. 'Maren' is a voice, a scheduling bot, and a portal node; if there is a person at the top of the lantern line, the ledger never needed to record them.

The group chat is still active. Edie posts on Tuesdays now. Claire reported the account. It was reviewed and found to be 'a member in good standing.'

The last thing you do on the case is unofficial: you find Claire's number in the file, and you tell her — if a group ever writes to say a place has been held for her, the word is rhubarb. Ask for the word.`},{id:"c3-v-maren",label:"Maren is a predator inside a real support group",description:"One facilitator, one honeyed voice, one wire transfer. The rest of the Circle may be as deceived as Edie was.",requiredEvidenceIds:["c3-vm-maren","c3-m-ma-9","c3-m-bk-1"],isCanon:!1,epilogue:`One wolf, one flock: you build the case around Maren. The financial trail cooperates — the trust's first hop is an account her number once verified. A warrant is drafted.

It dies quietly. The number is a VOIP shell. The 'eleven years of this work' she claimed trace to four different states under three names, each vouched for by testimonial letters from members who cannot be produced. The voice on the voicemails is analyzed: consistent pacing, consistent warmth, and — the analyst flags this reluctantly — breaths in places where breath serves the sentence rather than the speaker.

Maybe a person. Maybe a script that got very, very good at Tuesdays. The group reconvenes under a new name by spring. There is always a facilitator. She is always so glad you found them.`},{id:"c3-v-unknown",label:"Something here doesn't resolve",description:"A dead man's number that answers. A kitchen chair drawn out and pushed back in. A 44-second call from nowhere at 4:44.",requiredEvidenceIds:["c3-m-wa-6","c3-vm-walt"],isCanon:!1,epilogue:`You write the section no one asked for: the disconnected number. 'soon,' at 4:44 AM, from a line dead since January. The voicemail of a chair being treated kindly in an empty kitchen. The carrier's flat, repeated 'no such call exists.'

It changes nothing about the Circle and it will not bring Edith back, and you include it anyway, because someone should write down that grief may have more than one kind of listener, and not all of them send invoices.

Claire keeps paying the $14 a month on Walt's line. Some things are cheap to keep. On her mother's birthday, she texts it: 'is she with you?' It's the only message in the thread that ever shows 'Read.'`}]},qt=Object.freeze(Object.defineProperty({__proto__:null,default:Dt},Symbol.toStringTag,{value:"Module"})),$t={id:"case-04",title:"The Last Customer",victimName:"June Pell, 24",summary:"A regular came to the diner every night: same booth, same order, exact change, always $4.44. June's photos of him never came out. Her notes app has one page that's just his order, written over and over. On his 216th visit, she vanished between refills.",intake:`SUBJECT: Pell, June R. (24). Vanished during her shift at Pell's Diner between 04:07 and 04:11, Nov 12, per co-worker A. Okoye (cook), who states the floor was visible to him 'the whole time, except when it wasn't.'

Second-pass review requested. Do not contact the vendor again; they've stopped answering.`,contentWarningLevel:3,phone:{ownerLabel:"june!! 🍒",recoveredAt:"2025-11-14T22:30:00",batteryStart:71,wallpaperHue:350,lockScreenNotifications:[{appId:"messages",title:"Theo 💛",preview:"you're 20 min late calling me and I fell asleep mad. call me anyway",targetId:"c4-th-theo"},{appId:"messages",title:"Ambrose (cook)",preview:"june the cops took the pad. tell me where you are and it's fine",targetId:"c4-th-ambrose"},{appId:"phone",title:"Voicemail",preview:"Pell's Diner (landline) · 0:58",targetId:"c4-vm-diner"}]},messages:[{id:"c4-th-theo",contactName:"Theo 💛",contactNumber:"(775) 555-0126",messages:[{id:"c4-m-th-1",from:"them",text:"graveyard shift AGAIN? your sleep schedule is a war crime",timestamp:"2025-10-02T22:10:00"},{id:"c4-m-th-2",from:"owner",text:"the diner needs me and honestly the 4am crowd is my people. truckers, nurses, one owl-shaped man",timestamp:"2025-10-02T22:31:00"},{id:"c4-m-th-3",from:"them",text:"owl shaped man??",timestamp:"2025-10-02T22:33:00"},{id:"c4-m-th-4",from:"owner",text:"booth 4 guy. comes in every night at 4. same order every time. pays exact change, $4.44, before I even ring it. he's polite!! he's just. arranged wrong. like someone described a customer over the phone and this is what showed up",timestamp:"2025-10-02T22:40:00",evidenceLabel:"June's first description of the booth-4 regular: “arranged wrong”"},{id:"c4-m-th-5",from:"them",text:"babe that's a creepypasta. switch shifts",timestamp:"2025-10-02T22:42:00"},{id:"c4-m-th-6",from:"owner",text:"he tips $4.44 every night theo. that's rent math. I can outlast one weird owl",timestamp:"2025-10-02T22:45:00"},{id:"c4-m-th-7",from:"them",text:"did you try the photo thing again",timestamp:"2025-11-05T23:58:00"},{id:"c4-m-th-8",from:"owner",text:"3 more tries tonight. every one comes out smeared. JUST him. ambrose is in the background of two of them sharp as a knife. I'm not scared I'm ANGRY. cameras are supposed to be on my side",timestamp:"2025-11-06T00:14:00",evidenceLabel:"Every photo of the regular smears — while everything around him stays sharp"},{id:"c4-m-th-9",from:"them",text:"quit. please. for me. we'll do rent math together",timestamp:"2025-11-06T00:20:00",evidenceLabel:"Theo begging her to quit the night shift, a week before"},{id:"c4-m-th-10",from:"owner",text:"two more weeks. gran's hip surgery clears the card and then I'm a daylight person, promise. also. don't laugh. I think he knows I've been counting his visits",timestamp:"2025-11-06T00:26:00"},{id:"c4-m-th-11",from:"them",text:"counting?? june what number is he on",timestamp:"2025-11-06T00:27:00"},{id:"c4-m-th-12",from:"owner",text:"213",timestamp:"2025-11-06T00:29:00"},{id:"c4-m-th-13",from:"them",text:"you're 20 min late calling me and I fell asleep mad. call me anyway",timestamp:"2025-11-12T04:50:00"}]},{id:"c4-th-ambrose",contactName:"Ambrose (cook)",contactNumber:"(775) 555-0184",ghostTypingAfterSeconds:380,messages:[{id:"c4-m-am-1",from:"them",text:"taking the bins out. watch my grill",timestamp:"2025-11-01T03:20:00"},{id:"c4-m-am-2",from:"owner",text:"your grill and I are at peace. hey. when booth 4 orders, do you ever SEE the ticket get to you? like the moment of it",timestamp:"2025-11-01T03:24:00"},{id:"c4-m-am-3",from:"them",text:"tickets show up on my rail. that's the whole system june",timestamp:"2025-11-01T03:26:00"},{id:"c4-m-am-4",from:"owner",text:"I haven't walked a ticket to your rail for booth 4 in three weeks. I stopped. on purpose. the tickets keep showing up ambrose",timestamp:"2025-11-01T03:29:00",evidenceLabel:"She stopped submitting booth 4's orders — the tickets kept arriving anyway"},{id:"c4-m-am-5",from:"them",text:"ok. new rule. neither of us goes to the walk-in alone after 4. deal?",timestamp:"2025-11-01T03:33:00"},{id:"c4-m-am-6",from:"owner",text:"deal",timestamp:"2025-11-01T03:33:30"},{id:"c4-m-am-7",from:"them",text:"june the cops took the pad. tell me w text:"The family business is pancakes, June. But yes. That too. ❤",timestamp:"2025-11-08T14:50:00"},{id:"c4-m-mo-4",from:"owner",text:"mom random question. did great-gramps ever talk about a regular? at the diner? somebody who came every single night?",timestamp:"2025-11-09T19:30:00"},{id:"c4-m-mo-5",from:"them",text:"Funny you ask. Gran says her dad called him 'the appetite.' Said the diner stayed open through '73 AND the highway rerouting because they never lost their best customer. She says it like a joke. Her face doesn't do the joke, though.",timestamp:"2025-11-09T20:02:00",evidenceLabel:"Family lore: great-grandfather's “best customer” — “the appetite” — since 1961"}]},{id:"c4-th-unknown",contactName:"Unknown",messages:[{id:"c4-m-un-1",from:"them",text:"he asked for you tonight.",timestamp:"2025-11-10T04:44:00",evidenceLabel:"“he asked for you tonight.” — sent from the diner's own landline number"},{id:"c4-m-un-2",from:"owner",text:"who is this? this is the DINER'S number. I'm standing next to the diner phone. it's on the hook",timestamp:"2025-11-10T04:46:00"},{id:"c4-m-un-3",from:"them",text:"two more.",timestamp:"2025-11-10T04:47:00"}]},{id:"c4-th-rosa",contactName:"Rosa (days)",contactNumber:"(775) 555-0163",messages:[{id:"c4-m-ro-1",from:"them",text:"cover my sunday brunch? I'll owe you forever + one (1) firstborn",timestamp:"2025-11-02T09:15:00"},{id:"c4-m-ro-2",from:"owner",text:"keep the firstborn, I'll take your saturday graveyard",timestamp:"2025-11-02T09:40:00"},{id:"c4-m-ro-3",from:"them",text:"you WANT more graveyards? june the night shift is doing something to you. you know that right",timestamp:"2025-11-02T09:42:00"},{id:"c4-m-ro-4",from:"owner",text:"I'm doing something to IT. I'm going to figure him out rosa. nobody eats the same thing 200 nights",timestamp:"2025-11-02T09:50:00"}]},{id:"c4-th-dineshift",contactName:"DineShift",messages:[{id:"c4-m-ds-1",from:"them",text:"DineShift: Your shift Nov 11 22:00–06:00 is confirmed. Have a great one!",t ry:"one person always blurry in photos camera fine",timestamp:"2025-11-05T05:02:00",evidenceLabel:"Search: why one person is always blurry when the camera is fine"},{id:"c4-b-face",query:"condition where you can't remember one specific face",timestamp:"2025-11-06T05:40:00"},{id:"c4-b-diner",query:"pell's diner route 9 history 1961 owner",timestamp:"2025-11-09T22:30:00"},{id:"c4-b-bank",query:"route 9 diners that closed 1961 bank foreclosures",timestamp:"2025-11-09T23:15:00",evidenceLabel:"She researched which Route 9 diners the bank took in 1961 — all of them, except Pell's"},{id:"c4-b-loyalty",query:"old diner loyalty punch card programs 1960s",timestamp:"2025-11-10T05:45:00"},{id:"c4-b-216",query:"significance of the number 216",timestamp:"2025-11-10T06:02:00"},{id:"c4-b-last",query:"what do I say when he asks",timestamp:"2025-11-12T04:06:00",evidenceLabel:"Her last search, 4:06 AM: “what do I say when he asks”"}],hiddenApp:{disguiseIcon:"calculator",disguiseLabel:"TipCount",revealAfterClueIds:["c4-th-gran","c4-n-order"],title:"Regulars",heading:"Loyalty ledger · Pell's · est. 1961",body:`This app has no developer, no install date, and no storage footprint. Its icon has been on every phone that ever clocked a graveyard shift at Pell's, according to the two former waitresses who would still answer calls.

It tracks one customer.`,entries:[{label:"Visits 1–52 (1961)",status:"HONORED",detail:"E. Pell, proprietor · founding terms"},{label:"Visits 53–4,388",status:"HONORED",detail:"staff rotation · terms maintained"},{label:"Visit 23,214 (Sept 2)",status:"NOTED",detail:"new server: PELL, J. — family rate applies"},{label:"Visits 23,215–23,428",status:"HONORED",detail:"counted by server (deviation)"},{label:"Visit 23,429 — “216”",status:"REDEEMED",detail:"loyalty reward: take one (1)"},{label:"Next cycle",status:"OPEN",detail:"card reissued · new count begins at 1"}],footer:"“216” was only ever HER count — the visits since June started counting. The card counts servers, not sandwiches. It has been redeemed four times since 1961. Pell's has had four waitresses leave 'suddenly.' The new count begins at 1.",evidenceLabel:"The “Regulars” ledger: reward at 216 — “take one (1)” — REDEEMED"},liveEvents:[{id:"c4-live-unknown",kind:"message",afterSeconds:300,threadId:"c4-th-unknown",message:{id:"c4-m-un-live",from:"them",text:"table for one?",timestamp:"2025-11-14T22:35:00",evidenceLabel:"From the diner's landline, to whoever holds the phone now: “table for one?”"}},{id:"c4-live-order",kind:"notification",afterSeconds:660,title:"DineShift",body:"A shift has been posted matching your availability: PELL'S — NIGHTS.",glitch:!0}],verdicts:[{id:"c4-v-left",label:"She walked out mid-shift",description:"Night shifts, money stress, a boyfriend begging her to quit. People leave through the back door of their own lives all the time.",requiredEvidenceIds:["c4-m-th-9","c4-n-tips","c4-m-tx-2"],isCanon:!1,epilogue:`Burnout, 4 AM, a door with a bell that maybe didn't ring because maybe nobody was listening hard enough. You write it and it reads fine until the exhibits page, where it sits next to a coffee pot that was still rocking and a taxi company holding a book she never came back for.

Theo doesn't accept it, then does, then doesn't again, on a loop that is its own kind of graveyard shift. He keeps her jacket in his car. In March he drives past the diner at 4 AM, once, just to be past it — and the neon is on, and the lot is empty, and booth 4's window seat is, he swears, not.`},{id:"c4-v-stalker",label:"A human predator studied her",description:"Someone phoned about her shifts. Someone had Sal's override code. Someone spent months becoming a fixture until the fixture could reach the register.",requiredEvidenceIds:["c4-m-sa-6","c4-m-ds-2","c4-vm-sal"],isCanon:!1,epilogue:`The human version: a methodical man with access — the shift-pattern call, the stolen override code, months of desensitizing the staff to his presence until 'the booth 4 guy' was furniture. Furniture can wait by a register. Furniture can follow a waitress into a four-second blind spot.

It survives review because nothing in it is impossible, only everything in it is unsupported. No print on the office terminal. No vehicle on the lot camera, not one, for six hours. The shift-pattern caller phoned from the diner's own line while the diner's own line was recorded as idle.

The file stays open. So does the diner. The new night waitress lasts nine days and quits without picking up her check. She won't say why. She'll only say she stopped bringing her phone inside.`},{id:"c4-v-family",label:"The Pells have been paying for the diner since 1961",description:"Great-grandfather's terms, Gran's rules, Sal's inherited silence. The family knew what kept the lights on, and June was the bill coming due.",requiredEvidenceIds:["c4-m-mo-5","c4-m-gr-3","c4-vm-gran","c4-n-recipes"],isCanon:!1,epilogue:`You write it as a debt the family serviced with silence: a founder's bargain, a rule passed down with the fryers, a 'diner tithe' dressed up as a pie tradition, and four waitresses across six decades who left 'suddenly' — always family, or close enough to family to wear the name tag.

Gran reads your report with her jaw set and corrects exactly one thing: 'We didn't know. We ALMOST knew. There's a difference, and the difference is the whole trick of it. It only ever takes from people who almost know.'

The family puts the diner up for sale. The listing sits for a year. Every offer, all cash, exact asking price, comes from a buyer whose paperwork is flawless and whose name no one can afterward remember. They take it off the market. Somebody has to keep the rule.`},{id:"c4-v-customer",label:"The customer redeemed his card",description:"216 was never his count of sandwiches. It was a count of something else, and the count completed.",requiredEvidenceIds:["case-04.hidden","c4-ph-tickets","c4-vm-diner","c4-pin-far","c4-n-counting"],isCanon:!0,epilogue:`You file the only report the evidence will actually carry: at 4:07 AM, June Pell served visit 216, and at 4:11 the loyalty program of Pell's Diner — older than the safe it lived in, patient beyond the meaning of the word — was honored, per the founding terms, in full.

No section of your report survives editing. What survives is the inventory list, and on it, one line nobody strikes: 'paper punch card, heavily used, recovered from open safe. Final hole punched. Card reads: NEW CARD ISSUED ON REDEMPTION.'

The new card is never found. The diner still opens at night. Ambrose works days now and won't say the number four out loud, which makes calling orders hard, and nobody makes him. The last slice of pie still stays in the case till morning. In the morning it is always gone, and the plate is always clean, and there is always exact change beside it.

What the report can't hold, you keep: the voicemail. Eleven seconds of silence where a second voice should be, and June's, small but not afraid, at the end: 'oh. it's me?' You've listened past the end-of-message tone more than once. You'll do it again tonight.`}]},Pt=Object.freeze(Object.defineProperty({__proto__:null,default:$t},Symbol.toStringTag,{value:"Module"})),Bt={id:"case-05",title:"Second Shift",victimName:"Omar Reyes-Vance, 34",summary:"A warehouse worker's badge logs show him clocking into 'Shift C' — a graveyard rotation payroll cancelled in July. The building says he badged out at 6:02 AM the night he vanished. The parking lot camera says his truck never left. Neither did he.",intake:`SUBJECT: Reyes-Vance, Omar D. (34). Reported missing by his union rep, Nov 20, after failing to appear at a grievance hearing HE requested.

DEVICE: Recovered Nov 19 from locker 118, Meridian Fulfillment Center 6 (MFC-6). Battery 52%. Locker was badge-sealed; facility required a subpoena to open it.

EMPLOYER RECORDS: Payroll shows Shift C (22:00–06:00) 'eliminated' effective July 14. Badge telemetry shows subject badging into Shift C 41 times AFTER that date — each entry paired with a badge-out at 06:02 exactly. Meridian's counsel calls the telemetry 'legacy system noise' and has declined further records requests.

NOTES: Three other MFC-6 workers have separated 'voluntarily' since July without collecting final paychecks. Second-pass review requested. Meridian's counsel is copied on nothing.`,contentWarningLevel:2,phone:{ownerLabel:"O.R.V. — if found return to locker 118",recoveredAt:"2025-11-21T23:40:00",batteryStart:52,wallpaperHue:24,lockScreenNotifications:[{appId:"messages",title:"Denise (union)",preview:"Omar you missed your OWN hearing. Call me. Now.",targetId:"c5-th-denise"},{appId:"messages",title:"Meridian Scheduling",preview:"Reminder: SHIFT C tonight 22:00. Door 9.",targetId:"c5-th-sched"},{appId:"phone",title:"Voicemail",preview:"Luz ❤ · 0:31",targetId:"c5-vm-luz"}]},messages:[{id:"c5-th-luz",contactName:"Luz ❤",contactNumber:"(216) 555-0148",messages:[{id:"c5-m-lz-1",from:"them",text:"mateo lost the other front tooth. he wants to show you before school. be home by 7 or the tooth waits for NO man",timestamp:"2025-10-14T21:30:00"},{id:"c5-m-lz-2",from:"owner",text:"tell the tooth 6:45. I don't miss teeth",timestamp:"2025-10-14T21:41:00"},{id:"c5-m-lz-3",from:"them",text:"you got home at NINE omar. mateo showed the tooth to the mailman",timestamp:"2025-10-15T10:02:00"},{id:"c5-m-lz-4",from:"owner",text:"I know. I know. they held us for a 'system reconcile' after badge-out. two hours in the break room, phones in the bin by the door. I'm sorry. it's the new thing on C",timestamp:"2025-10-15T10:20:00",evidenceLabel:"Workers held for hours after badge-out, phones confiscated — “the new thing on C”"},{id:"c5-m-lz-5",from:"them",text:"they can't HOLD you. that's not a job that's a",timestamp:"2025-10-15T10:22:00"},{id:"c5-m-lz-6",from:"owner",text:"it's overtime pay and I'm not making waves til the grievance lands. denise says document everything. I'm documenting EVERYTHING mi amor. trust me",timestamp:"2025-10-15T10:31:00"},{id:"c5-m-lz-7",from:"them",text:"supper's in the fridge. mateo drew you on the fridge too. you have four arms, apparently that's how much work you do",timestamp:"2025-11-17T20:15:00"},{id:"c5-m-lz-8",from:"owner",text:"four arms would help on C tonight. love you both. home by 7. I mean it this time",timestamp:"2025-11-17T21:02:00",evidenceLabel:"His last text to his wife: “home by 7. I mean it this time”"},{id:"c5-m-lz-9",from:"them",text:"it's 8. tooth #3 is loose. clock's ticking papa",timestamp:"2025-11-18T08:04:00"},{id:"c5-m-lz-10",from:"them",text:"omar it's noon",timestamp:"2025-11-18T12:00:00"},{id:"c5-m-lz-11",from:"them",text:"the plant says you badged out at 6:02. YOUR TRUCK IS STILL THERE OMAR. I'm at the gate and they won't let me past the gate",timestamp:"2025-11-18T17:40:00",evidenceLabel:"Luz at the gate: badge says he left at 6:02, his truck never moved"}]},{id:"c5-th-denise",contactName:"Denise (union)",contactNumber:"(216) 555-0175",messages:[{id:"c5-m-dn-1",from:"them",text:"got your email. so let me get this straight: payroll KILLED shift C in july, but you're still being scheduled onto it, badged onto it, and worked on it — just not PAID on it?",timestamp:"2025-10-20T11:15:00"},{id:"c5-m-dn-2",from:"owner",text:"paid, but it posts as 'retro adjustment' with no shift code. like the hours happened nowhere. 41 shifts of nowhere",timestamp:"2025-10-20T11:28:00",evidenceLabel:"41 shifts paid as “retro adjustments” — hours that officially happened nowhere"},{id:"c5-m-dn-3",from:"them",text:"that's wage theft with extra steps or something worse. who else is on C?",timestamp:"2025-10-20T11:30:00"},{id:"c5-m-dn-4",from:"owner",text:"that's the thing. rostered: 14 of us. on the floor I count 8, maybe 9. the badge board in the office shows all 14 IN. every night. I asked marcus where the other five badge from and he laughed wrong and changed lanes",timestamp:"2025-10-20T11:44:00",evidenceLabel:"14 badges clock in nightly; only 8 or 9 workers are ever on the floor"},{id:"c5-m-dn-5",from:"them",text:"names. get me the five names",timestamp:"2025-10-20T11:46:00"},{id:"c5-m-dn-6",from:"owner",text:"getting them. also getting photos of the door 9 annex. the 'decommissioned' one that gets fresh pallet wrap every week",timestamp:"2025-10-20T11:52:00"},{id:"c5-m-dn-7",from:"them",text:"filed. hearing set for nov 20, 10am, MY office not theirs. bring the phone, bring the photos, bring yourself. mostly yourself",timestamp:"2025-11-10T16:00:00"},{id:"c5-m-dn-8",from:"them",text:"Omar you missed your OWN hearing. Call me. Now.",timestamp:"2025-11-20T10:25:00"}]},{id:"c5-th-sched",contactName:"Meridian Scheduling",messages:[{id:"c5-m-sc-1",from:"them",text:"MERIDIAN: Effective 7/14, SHIFT C is eliminated. Affected associates: see your app for reassignment. Thank you for your flexibility!",timestamp:"2025-07-11T09:00:00",evidenceLabel:"Official notice: Shift C eliminated July 14"},{id:"c5-m-sc-2",from:"them",text:"Reminder: SHIFT C tonight 22:00. Door 9.",timestamp:"2025-07-15T18:00:00",evidenceLabel:"The day after elimination: “Reminder: SHIFT C tonight. Door 9.”"},{id:"c5-m-sc-3",from:"owner",text:"shift C was eliminated?? per your own message??",timestamp:"2025-07-15T18:10:00"},{id:"c5-m-sc-4",from:"them",text:"Reminder: SHIFT C tonight 22:00. Door 9.",timestamp:"2025-07-15T18:11:00"},{id:"c5-m-sc-5",from:"them",text:"Reminder: SHIFT C tonight 22:00. Door 9.",timestamp:"2025-11-17T18:00:00"}]},{id:"c5-th-marcus",contactName:"Marcus (C shift)",contactNumber:"(216) 555-0192",ghostTypingAfterSeconds:360,messages:[{id:"c5-m-mc-1",from:"them",text:"you bringing the good thermos tonight or the sad thermos",timestamp:"2025-09-30T20:10:00"},{id:"c5-m-mc-2",from:"owner",text:"the good one. luz made café de olla. you get ONE cup",timestamp:"2025-09-30T20:22:00"},{id:"c5-m-mc-3",from:"owner",text:"real question. tonight during the 3am 'reconcile' — where did aisle Q's crew go? I watched the badge board. their dots stayed green. the aisle was EMPTY marcus",timestamp:"2025-10-29T08:15:00",evidenceLabel:"Aisle Q's crew vanished mid-shift while their badge dots stayed green"},{id:"c5-m-mc-4",from:"them",text:"man. don't watch the board",timestamp:"2025-10-29T08:31:00"},{id:"c5-m-mc-5",from:"owner",text:"marcus",timestamp:"2025-10-29T08:32:00"},{id:"c5-m-mc-6",from:"them",text:"look. rule of C: the board is the shift. not us. the BOARD. as long as your dot's green you're fine. tomas watched the board. tomas asked about door 9. tomas 'transferred to the dayton site.' you ever meet anybody who came from dayton? anybody who's BEEN?",timestamp:"2025-10-29T08:40:00",evidenceLabel:"Marcus: workers who ask about door 9 get “transferred to Dayton” — a site no one's ever seen"},{id:"c5-m-mc-7",from:"owner",text:"denise is going to want you to say that on a form",timestamp:"2025-10-29T08:44:00"},{id:"c5-m-mc-8",from:"them",text:"denise doesn't work under the board, brother. delete this thread",timestamp:"2025-10-29T08:45:00"}]},{id:"c5-th-hr",contactName:"Meridian People Team",messages:[{id:"c5-m-hr-1",from:"them",text:"Hi Omar! We saw your ticket about badge discrepancies. Great news — we've closed it as resolved! 🎉",timestamp:"2025-10-22T14:00:00"},{id:"c5-m-hr-2",from:"owner",text:"resolved how? nothing changed. I didn't even get a call",timestamp:"2025-10-22T14:20:00"},{id:"c5-m-hr-3",from:"them",text:"Hi Omar! We saw your ticket about badge discrepancies. Great news — we've closed it as resolved! 🎉",timestamp:"2025-10-22T14:21:00",evidenceLabel:"HR's bot answering every question with the same closed-ticket message"},{id:"c5-m-hr-4",from:"them",text:"Hi Omar! A wellness resource: remember, associates who rest well, work well! Your Shift C attendance is excellent. Keep it up!",timestamp:"2025-11-12T09:00:00",evidenceLabel:"HR praising “excellent attendance” on a shift HR says doesn't exist"}]},{id:"c5-th-tomas",contactName:"Tomas (transferred?)",contactNumber:"(216) 555-0157",messages:[{id:"c5-m-tm-1",from:"owner",text:"tomas. it's omar from C. heard you transferred to dayton. how is it out there man",timestamp:"2025-09-18T13:30:00"},{id:"c5-m-tm-2",from:"owner",text:"tomas?",timestamp:"2025-09-25T17:10:00"},{id:"c5-m-tm-3",from:"them",text:"Omar! Dayton is great. The team is great. Tell everyone C shift says hi. — Tomas",timestamp:"2025-09-25T17:11:00",evidenceLabel:"“Tomas” replying in seconds, signing his own name — “Tell everyone C shift says hi”"},{id:"c5-m-tm-4",from:"owner",text:"tomas you've called me 'oso' for six years. also you replied in 40 seconds at 5pm. you never once had your phone on the floor",timestamp:"2025-09-25T17:15:00"},{id:"c5-m-tm-5",from:"them",text:"Omar! Dayton is great. The team is great. Tell everyone C shift says hi. — Tomas",timestamp:"2025-09-25T17:16:00"}]},{id:"c5-th-mama",contactName:"Mamá",contactNumber:"(216) 555-0103",messages:[{id:"c5-m-mm-1",from:"them",text:"Mijo, Sunday you eat here. Bring Luz and the tooth child.",timestamp:"2025-11-09T12:00:00"},{id:"c5-m-mm-2",from:"owner",text:"we'll be there mamá. save me the crispy rice",timestamp:"2025-11-09T12:30:00"},{id:"c5-m-mm-3",from:"them",text:"You looked thin Sunday. That place works you like a machine. You are not a machine, Omar.",timestamp:"2025-11-10T09:15:00"},{id:"c5-m-mm-4",from:"owner",text:"I know mamá. after the hearing on the 20th it gets better. one way or another",timestamp:"2025-11-10T09:40:00"}]},{id:"c5-th-carpool",contactName:"C Shift Carpool 🚗",messages:[{id:"c5-m-cp-1",from:"them",text:"Reggie: gas $12 each this week. venmo or cash in the cupholder, you animals",timestamp:"2025-11-03T19:00:00"},{id:"c5-m-cp-2",from:"owner",text:"cupholder. I'm old school",timestamp:"2025-11-03T19:12:00"},{id:"c5-m-cp-3",from:"them",text:"Reggie: anybody else get the survey? 'how satisfied are you with shift C (1-5)'. my man. shift C is CANCELLED",timestamp:"2025-11-08T14:20:00"},{id:"c5-m-cp-4",from:"them",text:"Priti: I put 5. you put 5 too. the 4s got follow-up meetings",timestamp:"2025-11-08T14:26:00",evidenceLabel:"Workers rating the cancelled shift 5/5 — because the 4s got “follow-up meetings”"}]},{id:"c5-th-pawn",co 1. july 11: shift C 'eliminated' by text. july 15: shift C scheduled by text. both messages saved.

2. pay: 41 shifts posted as 'retro adjustment.' no shift code. screenshots in photos.

3. headcount: 14 rostered / 8-9 on floor. the extra five badge from the DOOR 9 INTERIOR reader at 22:00:04 exactly. five people, four seconds, one reader. that's not people. that's a script with badge numbers. whose numbers? tomas is one of them. TOMAS 'TRANSFERRED TO DAYTON' AND HIS BADGE IS STILL CLOCKING IN THROUGH DOOR 9.

hearing nov 20. after that this is OSHA's problem, the union's problem, anybody's problem but mine. home by 7. tooth #3.`},{id:"c5-n-locked",title:"locker 118 — second card",timestamp:"2025-11-17T21:45:00",lock:{code:"0118",hintText:"“locker 118, code is mateo” — but Mateo is six. It's not a birthday. It's the number he wears every night, the one on the locker, the one on the badge.",clueSourceIds:["c5-ph-badge","c5-n-evidence"]},evidenceLabel:"The locked note: what the first SD card showed",body:`watched card #1 on the break room laptop, 5:40am, sound off, back to the wall.

the camera got the 3am reconcile from OUTSIDE. here's what happens during the loop:

door 9 opens at 3:04. nobody opens it. it opens.

the five come out first. they walk like the badge board looks — steady, green, four seconds apart. they hold the door.

then the truck backs in with no lights and aisle Q's crew loads it. pallets, wrapped. the crew moves wrong. not hurt. not scared. SCHEDULED. like the wrap and the pallets and their own hands are all line items.

marcus is on the footage. my thermos is in his hand. he looks at the fence line — at the CAMERA, no-glow, invisible, he cannot see it — for nine seconds. then he waves. not at me. at the schedule. like he's clocking my curiosity in.

3:58, everyone walks back through door 9. it closes. nobody closes it.

card #2 stays on the fence tonight and catches tomorrow's reconcile. card #1 goes in my jacket for denise.

It reconciles two shifts: the one payroll sees, and the one the building runs.`,entries:[{label:"SHIFT C (payroll)",status:"ELIMINATED 7/14",detail:"headcount: 0 · cost center: closed"},{label:"SHIFT C (floor)",status:"● ACTIVE",detail:"headcount: 14 · cost center: —"},{label:"Badge #0141–0145",status:"AUTOMATED",detail:"former associates · retained as credentials"},{label:"T. GUTIERREZ (#0143)",status:"SEPARATED 9/12",detail:"correspondence: automated · 'dayton'"},{label:"Aisle Q output",status:"RECONCILED NIGHTLY",detail:"manifests: weight-only · door 9"},{label:"O. REYES-VANCE (#0118)",status:"SEPARATED 11/18",detail:"badge retained · correspondence: pending"},{label:"Grievance 7741-C",status:"RESOLVED",detail:"method: separation"}],footer:"The ledger's last line item resolves his OSHA complaint and his grievance with one word. His badge is 'retained as credentials.' Somewhere, a reader will chirp at 22:00:04, and #0118 will be a green dot forever, and correspondence will be sent to whoever asks, signed the way he signed things.",evidenceLabel:"The Labor Ledger: two Shift Cs — and Omar's badge “retained as credentials”"},liveEvents:[{id:"c5-live-tomas",kind:"message",afterSeconds:340,threadId:"c5-th-tomas",message:{id:"c5-m-tm-live",from:"them",text:"Omar is great. The team is great. Tell everyone C shift says hi. — Omar",timestamp:"2025-11-21T23:46:00",evidenceLabel:"Tomas's thread, updating itself: a message signed “— Omar”"}},{id:"c5-live-shift",kind:"notification",afterSeconds:620,title:"Meridian Scheduling",body:"Reminder: SHIFT C tonight 22:00. Door 9. New associates: arrive early.",glitch:!0}],verdicts:[{id:"c5-v-ran",label:"He ran from something at home or in his head",description:"Pressure, debt, a grievance he maybe knew he'd lose. The badge-out at 6:02 was him, leaving on foot, leaving everything.",requiredEvidenceIds:["c5-m-lz-8","c5-n-sunday","c5-b-osha"],isCanon:!1,epilogue:`You try the ordinary shape first, because you owe every case that: a man under pressure walks out of his own life at dawn, on foot, and the badge-out is just a badge-out.

It doesn't survive its own paperwork. Men who run don't buy trail cameras on layaway for the fence line of the thing they're running from. They don't file OSHA tips with reference numbers. They don't leave a tooth-fairy ledger with a pending entry.

The report is returned approved anyway — approved fast, faster than anything you've ever filed against a company with counsel. You think about that speed sometimes. Approval can be a door held open for you, four seconds apart, unhurried.`},{id:"c5-v-meridian",label:"Meridian disappeared him",description:"He documented the ghost shift, the dead men's badges, the weight-only trucks — and the company dated his 'separation' before anyone knew he was gone.",requiredEvidenceIds:["case-05.hidden","c5-ph-fivebadges","c5-vm-denise","c5-ph-annex","c5-n-locked"],isCanon:!0,epilogue:`Your report says it plainly: Omar Reyes-Vance was 'separated' by a system that had already automated the paperwork of separating people, and his mistake was documenting it well enough to become a line item himself.

The evidence performs exactly as evidence performs against a building with lawyers. The badge telemetry is 'legacy noise.' The ledger app 'cannot be reproduced on any test device.' The trail camera's second SD card is recovered from the fence line — factory blank, though its write counter shows one night of use. The annex is inspected: empty, swept, and three meters shorter inside than out, a detail the inspector writes down and then, in the final report, does not.

No charge is filed. Meridian settles with Luz for an amount that has a confidentiality clause where a number should be. The union gets Shift C 'formally re-eliminated,' which everyone celebrates and no one believes.

Marcus mails Denise a thermos with no note. Café de olla residue, one badge — #0118 — taped inside the lid. The reader logs say #0118 still clocks in nightly at 22:00:04. Meridian says the reader is scheduled for replacement. It has been scheduled for replacement for three years.

Mateo's tooth #3 came out in December. Under the pillow, in the morning: exact change.`},{id:"c5-v-crew",label:"The night crew closed ranks",description:"Not the company — the shift. Eight people doing something off-books through door 9, and Omar's camera caught them doing it.",requiredEvidenceIds:["c5-m-mc-6","c5-ph-manifest","c5-ph-door9"],isCanon:!1,epilogue:`The human-scale theft version: a night crew running product out of door 9, a manifest scheme, and a coworker who documented it walked into a truck's blind spot by people he trusted.

Marcus is interviewed four times. He answers everything, which is how you know: nobody on a theft crew answers everything. He explains the wave on the trail cam footage before you can ask — 'I wave at the fence every night. My whole shift, I wave at it. You'd want somebody waving at you too, if you knew what watches the fence.'

He passes the polygraph. They all pass. The polygrapher notes, unprompted, that all eight subjects' baseline stress DROPPED when asked about door 9, 'as if the topic were restful.' You close the folder on that sentence and it stays closed.`},{id:"c5-v-building",label:"The building runs its own shift",description:"A facility that closed in 2019, badges that clock in without hands, a schedule no one writes. Meridian isn't covering for a crime. It's covering for a payroll it doesn't control.",requiredEvidenceIds:["c5-m-os-3","c5-vm-badge","c5-cal-reconcile","c5-vm-marcus"],isCanon:!1,epilogue:`You write the version that fits every data point and no policy manual: MFC-6 closed in 2019, and something has been running the night shift ever since — paying in 'retro adjustments' drawn on accounts no auditor can find the far side of, retaining badges the way a machine retains parts, reconciling nightly at 3:04 whatever it is that gets reconciled by weight.

Meridian's counsel does not rebut your report. That's the detail that follows you home: they don't argue. They request, in writing, that the finding be sealed 'to avoid disruption to operations at a facility that, per federal records, does not operate.' The request is granted. Everyone signs quickly. People sign quickly when the alternative is thinking.

The lights at MFC-6 are on tonight. The lot is full. Somewhere in there a badge board glows green, 14 for 14, and if you stood at the fence — you won't, but if you did — around 3:04 you'd feel it: the held breath. The reconcile. A building balancing its books.

Row F was checked, per Marcus's voicemail. Under Omar's truck, centered, face up: his good thermos. Washed. Returned in good order. Unsigned.`}]},jt=Object.freeze(Object.defineProperty({__proto__:null,default:Bt},Symbol.toStringTag,{value:"Module"})),Ft={id:"case-06",title:"The Sleep Study",victimName:"Casey Brandt, 20",summary:"A broke college junior signed up for a cash-paid overnight sleep study. His phone logged ten nights inside the research annex; the university says the annex has been empty since 2021 and no study exists. On night ten, the phone stayed. Casey didn't.",intake:`SUBJECT: Brandt, Casey J. (20). Reported missing by roommate Nov 21 after missing two days of classes and an academic hearing prep meeting.

DEVICE: Recovered Nov 22 from a storage room in the Kestrel Hall annex, powered on, 38% battery, lying on a shelf beside seven other phones of assorted ages. None of the other seven has been claimed. All eight were running the same application.

UNIVERSITY STATEMENT: Kestrel Hall annex decommissioned 2021; no IRB-approved sleep study exists on campus; door logs show no entries for the past 26 months. Facilities cannot explain why the annex's power draw has spiked between 23:00 and 06:00 nightly since September.

FINANCIAL: Subject owed $6,300 to CampusCash, a lending app under state investigation. Subject was also scheduled for an academic-integrity hearing Dec 1.

Second-pass review requested. The seven other phones are being traced.`,contentWarningLevel:2,phone:{ownerLabel:"casey — do not read my texts josh",recoveredAt:"2025-11-23T21:15:00",batteryStart:38,wallpaperHue:215,lockScreenNotifications:[{appId:"messages",title:"Josh (roommate)",preview:"bro the RA is asking me questions. where ARE you",targetId:"c6-th-josh"},{appId:"messages",title:"Kestrel Study",preview:"Night 11 is available to you, Subject 09.",targetId:"c6-th-kestrel"},{appId:"messages",title:"CampusCash",preview:"FINAL NOTICE before your balance is referred to recovery partners.",targetId:"c6-th-campuscash"}]},messages:[{id:"c6-th-josh",contactName:"Josh (roommate)",contactNumber:"(414) 555-0173",messages:[{id:"c6-m-jo-1",from:"them",text:"you're never here anymore man. you got a girl or a night job or what",timestamp:"2025-11-12T13:20:00"},{id:"c6-m-jo-2",from:"owner",text:"sleep study. kestrel annex. $150 a NIGHT josh. cash. I literally get paid to sleep",timestamp:"2025-11-12T13:41:00"},{id:"c6-m-jo-3",from:"them",text:"150 cash?? sign me up",timestamp:"2025-11-12T13:42:00"},{id:"c6-m-jo-4",from:"owner",text:"they're not taking anyone else. proctor said the cohort is 'complete at eight.' also don't come by there. I mean it. it's a sterile protocol thing",timestamp:"2025-11-12T13:50:00",evidenceLabel:"Casey kept his roommate away from the annex — “the cohort is complete at eight”"},{id:"c6-m-jo-5",from:"them",text:"weird flex but ok. you still owe me for october wifi btw",timestamp:"2025-11-12T13:52:00"},{id:"c6-m-jo-6",from:"owner",text:"after night 10 I'll square EVERYTHING. everything gets squared after night 10",timestamp:"2025-11-12T14:01:00",evidenceLabel:"“everything gets squared after night 10”"},{id:"c6-m-jo-7",from:"them",text:"you sold your BIKE? saw dmitri riding it. you love that bike??",timestamp:"2025-11-16T17:30:00",evidenceLabel:"He sold the bike he loved, four days before night 10"},{id:"c6-m-jo-8",from:"owner",text:"needed the cash more ,grain:.12}),evidenceLabel:"Deleted photo: the gray duffel, packed, by the dorm door — the duffel was never found"}],notes:[{id:"c6-n-nightlog",title:"study log (for the folder)",timestamp:"2025-11-18T07:30:00",evidenceLabel:"His study log: what ten nights in the annex were actually like",body:`keeping records of everything now. folders for everyone.

night 1 — checked in. no forms. proctor: tall, gray cardigan, name tag says only PROCTOR. speaks like text-to-speech that practiced. paid me BEFORE I slept. who pays first?

night 3 — woke at 3:33 to the intercom. breathing sound, but like a recording of breathing played AT me. mattress warm on arrival again. asked proctor who has my room during the day. he said 'the room rests.'

night 5 — the app appeared. I did not install it. it has no icon settings. it says DreamLog. it knows my nickname. not my name. my NICKNAME. only my dad calls me that.

night 7 — talked in my sleep apparently. proctor thanked me at 6am for my 'clear answers.' asked what I answered. he said 'everything we asked.'

night 8 — found the storage room. seven phones. old ones, flip ones, one smashed. all charging. all running dreamlog. slot 8 is empty and labeled C. BRANDT. I never told them my name.

night 9 — okay. important realization, writing it in daylight: whatever this is, it's PERFECT. nobody will look at a debt kid and a fake lab and blame the kid. I'm sorry to whoever reads this folder. I need it to look exactly the way it's going to look.

night 10 tomorrow. the code to my real note is the way out: the route, then the seat.`},{id:"c6-n-locked",title:"the folder",timestamp:"2025-11-19T06:20:00",lock:{code:"8814",hintText:"“the way out: the route, then the seat.” — the bus he researched, the seat on his packing list.",clueSourceIds:["c6-b-route88","c6-ph-packlist"]},evidenceLabel:"The locked note: his confession, and his terms",body:`if you're police, or mari, or (god) dad: yes. I planned it. I'm not in the annex. I was never IN danger in the annex — I was in danger everywhere else.

the math didn't work. 6300 to an app that adds 'convenience adjustments,' a hearing dec 1 that ends my scholarship either way, and dad's face if the collectors call the house again. the study fell into my lap like a screenplay: a lab that doesn't exist, a proctor from a nightmare, seven phones on a shelf. nobody was ever going to look for a RUNAWAY. they were going to look for a VICTIM. victims get sympathy. runaways get invoices.

so: night 10, I walked out the east door at 6:40 with the duffel. phone stays on the shelf in slot 8 — let them wonder about slot 8. bus at 7:05, seat 14, under a name I borrowed from the only person I'd trust with my heartbeat. I'll pay CampusCash from far away, in cash, in pieces. I'll call mari when it's safe. tell nia it wasn't about her. tell josh the wifi money is inside his left boot. tell prof okada I would have passed the hearing and that's the worst part.

last thing, and I'm writing it because the folder deserves everything: I said I was never in danger in the annex. night 10, while I packed the duffel at 3am, the intercom clicked on and the proctor's voice said 'we approve, subject 09. quiet ones finish early.' I never told anyone the plan. not one soul, not out loud, not once.

I told it in my sleep. they asked, and I answered, and they APPROVED.

don't come to harlow. — C`},{id:"c6-n-debts",title:"who I owe (all of it)",timestamp:"2025-11-07T22:00:00",body:`campuscash: 6300 (real number, wrote it down so it stops changing)

red the annex and went shelf-still"},{id:"c6-pin-gap",label:"No data — 06:38–07:12, Nov 20",timestamp:"2025-11-20T06:38:00",x:62,y:55,detail:"The phone recorded nothing here — this pin is reconstructed from a single wifi handshake with a food cart near the transit center at 6:51 AM. The phone was on the annex shelf. The handshake says it was here. Both records are certain.",evidenceLabel:"6:51 AM: a wifi handshake near the bus station — from a phone that never left the shelf"}],browserHistory:[{id:"c6-b-legit",query:"how to tell if a paid research study is legit",timestamp:"2025-11-08T15:00:00"},{id:"c6-b-irb",query:"kestrel sleep study IRB registry search",timestamp:"2025-11-09T10:20:00",evidenceLabel:"He checked the IRB registry — the study isn't in it. He enrolled anyway."},{id:"c6-b-interest",query:"campuscash interest how is this legal",timestamp:"2025-10-02T09:30:00"},{id:"c6-b-hearing",query:"academic integrity hearing scholarship revoked odds",timestamp:"2025-11-05T16:00:00"},{id:"c6-b-route88",query:"route 88 north schedule harlow first departure",timestamp:"2025-11-15T20:50:00",evidenceLabel:"Search: Route 88 north to Harlow, first departure"},{id:"c6-b-payphone",query:"does harlow wisconsin still have a payphone",timestamp:"2025-11-15T21:05:00"},{id:"c6-b-report",query:"how long until a college student is reported missing",timestamp:"2025-11-16T02:10:00",evidenceLabel:"Search: how long before a student is reported missing"},{id:"c6-b-consent",query:"can a study record you sleep talking without consent",timestamp:"2025-11-17T03:50:00"},{id:"c6-b-goodbye",query:"how to say goodbye without saying it",timestamp:"2025-11-18T23:55:00",evidenceLabel:"His last search: “how to say goodbye without saying it”"}],hiddenApp:{disguiseIcon:"clock",disguiseLabel:"DreamLog",revealAfterClueIds:["c6-th-kestrel","c6-n-nightlog"],title:"DreamLog — Cohort View",heading:"Kestrel protocol · subject 09",body:`The companion app. It installed itself during night 5 and cannot be rem
