a sudden resignation.",requiredEvidenceIds:["c12-m-hw-1","c12-b-plan","c12-m-wr-6"],isCanon:!1,epilogue:`Hollis files the complaint himself, which is the tell — he files it Dec 18 at 8 AM, itemized, notarized, before anyone has asked him anything. A pry bar, a stud finder, floor plans of his home, a resignation, a disappearance. It's tidy. He has always been tidy. The tidiness is fourteen years deep.

The theory dies at the women's center on Fullerton, where an intake advocate produces the guest who arrived by taxi on the 17th: a small woman with a gray coat, borrowed boots, and a legal name that makes the detective sit down. The 'stolen jewelry' is on her hands. It was always hers.

Adelaide Hollis, fourteen years dead on paper, gives a nine-hour statement over two days, pausing only to eat orange slices, and begins it: 'The girl is owed first. Find the girl. I'll still be here — I've gotten very good at still being here.'`},{id:"c12-v-hollis",label:"Hollis caught her going back in",description:"The annex opened, his mother walked out, and Sadie returned inside to finish the job. He came home from lunch to an empty wall.",requiredEvidenceIds:["case-12.hidden","c12-n-locked","c12-ph-doorcode","c12-pin-beechmont","c12-vm-hollis"],isCanon:!0,epilogue:`Your report reconstructs the day in her own numbered style. 12:14, entry. 12:29, the annex door's first outside opening in fourteen years. 12:41, the taxi stand — Adelaide away clean. 12:44, Sadie back inside: the panel to reset, the dog to settle, the scene to make ordinary, because the plan's whole second half was Hollis noticing nothing until paper could do its slow work. And somewhere between 12:44 and the 3:45 voicemail with its careful, savoring calm — 'the coat rack is crooked, Miss Kwan' — Garrett Hollis came home early from a Rotary lunch that, three members confirm, he left at 12:50 after a phone alert. The door app told on her. The door app was always going to tell on her; it was the one occupant of that house she couldn't befriend.

Hollis is arrested on the fraud — fourteen years of pension, the falsified death, the annex with its exterior-grade lock — and held without bail when the cadaver dog alerts, not in the house, but on the bed of his immaculate truck. He says nothing. He has said nothing for years to a woman eleven feet away; silence is his native tongue.

Sadie Kwan is not found by the time your report closes. The county searches every parcel Hollis has touched since 1996. The file stays open, and Fullerton Street keeps it warm: Adelaide Hollis attends every hearing, front row, and has told the story — to the court, to three newspapers, to anyone at the bus stop — exactly as she promised the wall she would. 'Everyone in their room, everyone noticing,' her son once called that house. She has made the whole county a room. Everyone is noticing.

Biscuit lives with Nora and Jules now. On walks he still stops at one particular corner and sits, facing 44 Beechmont, pawing the air once — a dog updating his casework. The report's last line, which the sergeant let you keep because some files have earned one soft sentence: 'The dog did all the actual detective work, per the victim's own note, and the department concurs.'`},{id:"c12-v-wagroute",label:"WagRoute walked six people into that house",description:"Six walkers in a year. A note about the hallway. A platform that shares nothing and forwards everyone.",requiredEvidenceIds:["c12-m-wr-3","c12-m-wr-5","c12-m-ho-3"],isCanon:!1,epilogue:`The platform verdict: WagRoute matched six strangers into a house whose only user review was 'particular about the hallway,' and told none of them about the others. Discovery turns up the previous walkers, and their exit notes read like chapters of the same book nobody assembled: 'client watches from lunch, weird'; 'dog obsessed with a wall'; 'heard humming, quit.' Walker #3, reached by phone, cries with relief before you finish the second sentence. 'I thought I made it up,' she says. 'The app makes you feel like you're the strange one.'

WagRoute settles quietly and adds a feature: walkers can now see how many predecessors a client has had. It ships behind a toggle, off by default, called 'route history,' named by someone very careful that the words 'six walkers quit this house' never appear on any screen.

Everything in the verdict is true. It's just upstream of the crime, not the crime. Platforms set tables; a man in that house had been dining alone, on someone else's whole life, for fourteen years. The verdict you filed instead names him. This one you keep as an appendix, and every gig app in the county pretends not to have read it.`},{id:"c12-v-house",label:"The house keeps its occupants",description:"Tally marks older than the fraud. A lullaby dated 1962. A room that was always drawn as a hollow. An exit the door app cannot log.",requiredEvidenceIds:["c12-ph-tally","c12-vm-lullaby","c12-ph-window-out"],isCanon:!1,epilogue:`You write the deep-title search no one requested: 44 Beechmont Terrace, built 1923, and the northeast chase appears on EVERY plan ever filed — 1923, 1954, 1988 — always hatched, always eleven feet, always unexplained. Houses get remodeled. That hollow was maintained, like a hearth. The tally marks Sadie photographed run in bands: fresh ones, Adelaide's fourteen years — and beneath them, older strokes in older tools, and beneath those, marks that the conservator dates 'pre-war, possibly pre-house,' which is a phrase she writes once and declines to discuss.

The 1962 lullaby call sits in the carrier's fault log next to its impossible note — 'wife sings on the line, charge us for it if you must. — R. Hollis.' Garrett's grandfather. The Hollis men have been keeping women in that corner for longer than the pension system has existed to pay for it, or the corner has been keeping Hollises supplied. Your report offers both readings. Your report is filed under 'anomalous — hold.'

The house sells at auction after the conviction. The new owners renovate everything, and the contractor's crew opens the northeast wall to 'finally get some light in there,' and finds eleven feet of nothing at all — no tally marks, no wallpaper with little oranges, no room. Bare studs, ninety years of dust, undisturbed. The crew boss, shown Sadie's photos, looks for a long time and says the only sentence in this file you believe completely: 'Then this isn't the wall she opened.'`}]},ea=Object.freeze(Object.defineProperty({__proto__:null,default:Zt},Symbol.toStringTag,{value:"Module"})),ta={id:"case-13",title:"The Landlord's Other Building",victimName:"Milo Grieves, 41",summary:"A building super with keys to everything started selling tunnel access to an anonymous buyer who paid in exact, odd amounts and never asked twice. Six sales, six doors, always deeper. The seventh listing was the master key. The payment cleared. The seller went down to deliver it in person, and the tunnels kept them both.",intake:`SUBJECT: Grieves, Milo A. (41). Maintenance superintendent, Harker Row Management (buildings 12–20 Harker Row). Reported missing by his employer Jan 5 after tenants' work orders went unanswered for six days.

DEVICE: Recovered Jan 4 from the sublevel workshop of 16 Harker Row, on the workbench, beside a labeled key board. Every hook on the board is full except one. The empty hook is labeled, in the subject's hand: 'M.'

FINANCIAL: Subject's account received six deposits since October from a licensed escrow service, amounts between $700 and $2,900, all odd figures, referencing 'storage consultation.' A seventh deposit — $3,317 — cleared Dec 30, 23:03. Subject's phone shows no activity after 23:41 that night.

PROPERTY: The Harker Row sublevels interconnect — steam-era utility tunnels, officially sealed in 1971. Management states the tunnels are 'inaccessible.' Management's own storage invoices reference them 38 times since 2019.

Second-pass review requested. The responding officer notes, without elaboration, that the sublevel of 16 Harker Row 'has more doors than it has rooms.'`,contentWarningLevel:2,phone:{ownerLabel:"GRIEVES — supers' cell, leaks & lockouts",recoveredAt:"2026-01-06T21:00:00",batteryStart:27,wallpaperHue:40,lockScreenNotifications:[{appId:"messages",title:"Marisa",preview:"ok. one coffee. saturday. don't make me regret this, dad",targetId:"c13-th-marisa"},{appId:"messages",title:"Cistern (escrow relay)",preview:"the last door opens from your side, keyholder. it always did.",targetId:"c13-th-cistern"},{appId:"phone",title:"Voicemail",preview:"16 Harker Row — service line · 1:02",targetId:"c13-vm-pipe"}]},messages:[{id:"c13-th-cistern",contactName:"Cistern (escrow relay)",messages:[{id:"c13-m-ci-1",from:"them",text:"[relay] KEYHOLDER: your listing for utility access, 12 Harker sublevel. is the access exclusive? I don't share tunnels.",timestamp:"2025-10-08T23:00:00",evidenceLabel:"The buyer's first message: “I don't share tunnels.”"},{id:"c13-m-ci-2",from:"owner",text:"[relay] exclusive after hours, 11pm-5am. storage access only. no living down there, no cooking, nothing that smells or burns. $700/mo.",timestamp:"2025-10-08T23:20:00"},{id:"c13-m-ci-3",from:"them",text:"[relay] acceptable. I store quiet things. payment sent — $731. odd numbers settle faster, you'll find.",timestamp:"2025-10-08T23:24:00",evidenceLabel:"“I store quiet things. odd numbers settle faster, you'll find.”"},{id:"c13-m-ci-4",from:"them",text:"[relay] the 12 Harker level is shallower than your listing implied. I've paid for depth before and been disappointed. the door at the north end, behind the meters — what's your price for that one?",timestamp:"2025-10-29T23:30:00",evidenceLabel:"“I've paid for depth before and been disappointed.”"},{id:"c13-m-ci-5",from:"owner",text:"[relay] that's the crossover to 14. it's on the same keyway. $1,100 and you didn't get it from me.",timestamp:"2025-10-29T23:45:00"},{id:"c13-m-ci-6",from:"them",text:"[relay] I never get anything from anyone. that's the beauty of escrow. sent — $1,153.",timestamp:"2025-10-29T23:47:00"},{id:"c13-m-ci-7",from:"owner",text:"[relay] question. the mortar dust by the crossover — you doing masonry down there? the terms said storage.",timestamp:"2025-11-20T22:15:00",evidenceLabel:"Nov 20: Milo noticed fresh masonry in the tunnels"},{id:"c13-m-ci-8",from:"them",text:"[relay] I patch what I open and I open what I've paid for. your predecessors never asked about the mortar, keyholder. they lasted longer that way. joking. sold me access, I mean. before you. it's a long row and I've been renting under it a long time.",timestamp:"2025-11-20T22:20:00",evidenceLabel:"“your predecessors never asked about the mortar. they lasted longer that way. joking.”"},{id:"c13-m-ci-9",from:"owner",text:"[relay] last sale. after this we're done and the listing comes down. the deep gate under 18. then that's every door I'm willing to sell.",timestamp:"2025-12-14T23:00:00"},{id:"c13-m-ci-10",from:"them",text:"[relay] every door you're WILLING to sell. willing is a price problem, not a door problem. sent — $2,909. and keyholder: start thinking about the master. everything ends at the master. it's the only listing you were ever really posting.",timestamp:"2025-12-14T23:06:00",evidenceLabel:"“everything ends at the master. it's the only listing you were ever really posting.”"},{id:"c13-m-ci-11",from:"owner",text:"[relay] the master isn't for sale. it doesn't leave my ring. final answer.",timestamp:"2025-12-28T22:40:00",evidenceLabel:"Dec 28: “the master isn't for sale. final answer.”"},{id:"c13-m-ci-12",from:"them",text:"[relay] $3,317. not for the key, keyholder. for the DELIVERY. bring it down yourself, the junction under 16, and show me it turning in the last door. then keep it forever. I don't want your key. I want its last turn.",timestamp:"2025-12-30T22:55:00",evidenceLabel:"The final offer: $3,317 “not for the key — for its last turn”"},{id:"c13-m-ci-13",from:"them",text:"the last door opens from your side, keyholder. it always did.",timestamp:"2025-12-30T23:39:00",evidenceLabel:"11:39 PM, outside the relay format, no escrow tag: “the last door opens from your side.”"}]},{id:"c13-th-marisa",contactName:"Marisa",contactNumber:"(216) 555-0171",messages:[{id:"c13-m-ma-1",from:"owner",text:"happy birthday marisa. 19. your mother would have baked the lopsided cake. I know you won't answer. that's all right. happy birthday",timestamp:"2025-09-30T09:00:00",evidenceLabel:"September: his unanswered birthday text to his daughter"},{id:"c13-m-ma-2",from:"owner",text:"I know christmas is a no. understood. I put something in your college account anyway. it's not a bribe. it's just the only sentence I know how to say in a language you'll read",timestamp:"2025-12-24T18:00:00",evidenceLabel:"Christmas Eve: “it's not a bribe. it's the only sentence I know how to say.”"},{id:"c13-m-ma-3",from:"them",text:"the deposit was $4,000, dad. you fix radiators. where is this coming from",timestamp:"2025-12-26T14:00:00",evidenceLabel:"Marisa's first reply in a year: “where is this coming from”"},{id:"c13-m-ma-4",from:"owner",text:"side work. consulting on storage. it's boring and it's almost over. marisa — I'm about to be done with something. after thursday I'm done with it for good. then I'd like to call. I'd LIKE to call. no pressure. one coffee's worth of a call",timestamp:"2025-12-26T14:30:00",evidenceLabel:"“after thursday I'm done with it for good. then I'd like to call.”"},{id:"c13-m-ma-5",from:"them",text:"ok. one coffee. saturday. don't make me regret this, dad",timestamp:"2025-12-28T20:00:00",evidenceLabel:"She said yes: one coffee, Saturday"},{id:"c13-m-ma-6",from:"them",text:"it's saturday. I'm at the place. I got here early. I never get anywhere early",timestamp:"2026-01-03T10:05:00"},{id:"c13-m-ma-7",from:"them",text:"you absolute— you know what. fine. FINE. this is why",timestamp:"2026-01-03T10:40:00"},{id:"c13-m-ma-8",from:"them",text:"your work called MY number looking for you. dad?",timestamp:"2026-01-05T11:20:00"}]},{id:"c13-th-perlman",contactName:"Perlman (Harker Mgmt)",contactNumber:"(216) 555-0144",messages:[{id:"c13-m-pe-1",from:"them",text:"Grieves — 14's boiler again. Also stop logging 'tunnel moisture' on the reports. The tunnels are sealed. Sealed spaces don't have moisture, they have nothing, because they're sealed.",timestamp:"2025-11-03T08:30:00",evidenceLabel:"Management, in writing: stop logging the sealed tunnels' moisture"},{id:"c13-m-pe-2",from:"owner",text:"the sealed tunnels also have my missing wet-vac in them, boss. sealed is doing a lot of work in that sentence",timestamp:"2025-11-03T08:45:00"},{id:"c13-m-pe-3",from:"them",text:"The storage clients access their units through the alley door WHICH IS NOT A TUNNEL, per the insurance language. Learn the language, Grieves. The language is why we all get paid.",timestamp:"2025-11-03T08:50:00",evidenceLabel:"“The language is why we all get paid” — management's storage clients and the alley door that “is not a tunnel”"},{id:"c13-m-pe-4",from:"them",text:"Where are you? Six open work orders. Mrs. Ferro is describing her radiator to me PERSONALLY, Grieves. In detail. I know its whole biography now.",timestamp:"2026-01-02T09:00:00"}]},{id:"c13-th-gus",contactName:"Gus (sparky)",contactNumber:"(216) 555-0192",ghostTypingAfterSeconds:390,messages:[{id:"c13-m-gu-1",from:"them",text:"pulled cable under 18 today. milo. your crawlspaces are wrong lately. somebody's been through and they're NEAT. neat scares me. thieves aren't neat",timestamp:"2025-12-02T16:20:00",evidenceLabel:"The electrician: “somebody's been through and they're NEAT. thieves aren't neat.”"},{id:"c13-m-gu-2",from:"owner",text:"storage guys, probably. management rents down there. don't put it in writing anywhere, apparently the tunnels are 'sealed'",timestamp:"2025-12-02T16:40:00"},{id:"c13-m-gu-3",from:"them",text:"storage guys don't repoint brick, milo. there's NEW MORTAR under 18. good work too. old-style lime mix. nobody's mixed lime mortar since our grandfathers. who repoints a tunnel nobody's allowed in with mortar nobody uses anymore",timestamp:"2025-12-02T16:55:00",evidenceLabel:"New lime mortar under 18 Harker — “nobody's mixed lime mortar since our grandfathers”"},{id:"c13-m-gu-4",from:"owner",text:"gus. drop it. I mean it. I'll handle the sublevels. you stay in the ceilings where it's normal",timestamp:"2025-12-02T17:00:00"},{id:"c13-m-gu-5",from:"them",text:"milo grieves telling ME to stay out of trouble. writing the date down. ok brother. watch yourself under there",timestamp:"2025-12-02T17:05:00"}]},{id:"c13-th-ferro",contactName:"Mrs. Ferro (14, apt 3)",contactNumber:"(216) 555-0129",messages:[{id:"c13-m-fe-1",from:"them",text:"Mr. Grieves the radiator is singing again. Not banging. SINGING. Come hear it before it stops, nobody believes me.",timestamp:"2025-12-18T21:00:00"},{id:"c13-m-fe-2",from:"owner",text:"on my way up mrs f. if it's singing it's air in the line. if it's on key, it's a miracle and we charge admission",timestamp:"2025-12-18T21:10:00"},{id:"c13-m-fe-3",from:"them",text:"You look tired, Mr. Grieves. My husband kept keys for a living too, God rest him. He used to say a key ring gets heavier every year and it's never the metal.",timestamp:"2025-12-18T22:30:00",evidenceLabel:"Mrs. Ferro: “a key ring gets heavier every year and it's never the metal.”"}]},{id:"c13-th-bank",contactName:"Lakeside Bank",messages:[{id:"c13-m-bk-1",from:"them",text:"Lakeside: Deposit received — $2,909.00, ESCROW SERVICES LLC, memo: storage consultation.",timestamp:"2025-12-14T23:10:00"},{id:"c13-m-bk-2",from:"them",text:"Lakeside: Transfer sent — $4,000.00 to M. GRIEVES-OKAFOR 529 COLLEGE FUND.",timestamp:"2025-12-24T17:50:00",evidenceLabel:"Christmas Eve: $4,000 of tunnel money into his daughter's college fund"},{id:"c13-m-bk-3",from:"them",text:"Lakeside: Deposit received — $3,317.00,  is a white filter. I don't know where you even get white filters",timestamp:"2025-12-08T22:15:00",aspect:"portrait",meta:{takenAt:"2025-12-08T22:15:00",device:"This phone",location:"16 Harker — junction"},svg:s('<rect width="300" height="400" fill="#0e0c09"/><ellipse cx="150" cy="330" rx="80" ry="20" fill="#080604"/><rect x="100" y="200" width="100" height="120" rx="14" fill="#26303a"/><circle cx="150" cy="200" r="50" fill="#2c3742"/><path d="M195 180 q40 -30 30 -70" stroke="#1d242c" stroke-width="10" fill="none"/><rect x="120" y="240" width="60" height="8" rx="3" fill="#d8d2c2" opacity="0.7"/>',{aspect:"portrait",base:"#0a0806",grain:.13}),evidenceLabel:"The returned wet-vac: cleaned, refitted — with a filter no supplier stocks"},{id:"c13-ph-master",caption:"the M. 1961 keyway, cut before I was born, opens every door on the row including three I've never found the doors FOR. previous super handed it to me like a funeral. 'count the doors it opens,' he said, 'and if the number ever goes up, quit.'",timestamp:"2025-12-23T21:00:00",aspect:"portrait",meta:{takenAt:"2025-12-23T21:00:00",device:"This phone"},svg:s('<rect width="300" height="400" fill="#131009"/><circle cx="150" cy="140" r="45" fill="none" stroke="#8a7448" stroke-width="10"/><rect x="140" y="180" width="20" height="140" rx="4" fill="#8a7448"/><path d="M160 280 h24 M160 300 h16" stroke="#8a7448" stroke-width="10"/><text x="150" y="365" text-anchor="middle" font-family="monospace" font-size="10" fill="#5c5342">the number went up.</text>',{aspect:"portrait",base:"#0d0b07",grain:.12}),evidenceLabel:"The master key — “count the doors it opens, and if the number ever goes up, quit.”"},{id:"c13-ph-junction-night",caption:"",timestamp:"2025-12-30T23:36:00",aspect:"landscape",meta:{takenAt:"2025-12-30T23:36:00",device:"This phone",location:"16 Harker — junction"},svg:s('<rect width="400" height="300" fill="#060504"/>',{aspect:"landscape",base:"#050403",grain:.2}),flashlight:{hiddenSvg:s('<rect width="400" height="300" fill="#0b0906"/><path d="M0 300 V100 Q0 50 90 50 H310 Q400 50 400 100 V300" fill="#120e08"/>'+N(115,40,56,80,"#040302")+'<rect x="115" y="40" width="56" height="80" fill="#0a0704"/>'+J(74,246,84,-32,"c13-drag")+pe(143,126,34,"c13-spat")+g(143,108,.62,.85,"#030202")+'<text x="200" y="270" text-anchor="middle" font-family="monospace" font-size="9" fill="#4a4232">the fourth door, open. and my buyer, holding it. politely.</text>'+E("23:36:52",400,300),{aspect:"landscape",base:"#080604",grain:.14})},evidenceLabel:"His last photo, 11:36 PM: the fourth door open — the buyer holding it, politely"},{id:"c13-ph-radiator",caption:"mrs ferro's radiator. it was, for the record, singing. on key. I bled the line and killed the choir and I feel bad about it",timestamp:"2025-12-18T22:00:00",aspect:"portrait",meta:{takenAt:"2025-12-18T22:00:00",device:"This phone",location:"14 Harker apt 3"},svg:s('<rect width="300" height="400" fill="#1a1611"/>'+Array.from({length:8},(t,e)=>`<rect x="${60+e*24}" y="180" width="16" height="140" rx="8" fill="#3d3226"/>`).join("")+'<rect x="50" y="170" width="200" height="12" rx="6" fill="#2c2418"/><rect x="50" y="316" width="200" height="12" rx="6" fill="#2c2418"/><circle cx="60" cy="150" r="10" fill="#57422a"/>',{aspect:"portrait",base:"#13100b",grain:.11})}],notes:[{id:"c13-n-ledger",title:"side work ledger (burn after marisa's tuition)",timestamp:"2025-12-28T23:30:00",evidenceLabel:"His KEYHOLDER ledger: six sales, six doors, and the rules he broke one at a time",body:`rules I set on day one:
1. storage access only, after hours
2. nothing that smells, burns, or breathes
3. never the master
4. money goes to marisa, all of it, that's the POINT of it

sales:
oct — 12 harker sublevel. $731. fine. crates? never saw him move any. never saw HIM. rule 2 assumed intact.
oct — crossover to 14. $1,153. fine-ish.
nov — 14 deep stair. $1,847. noticed the mortar after this one.
nov — under 15 (the cold stretch). $2,201. wet-vac went missing. came back CLEANED. rule 2 status: unknown and I stopped asking, which is its own answer.
dec — under 17, the brick vault. $2,563.
dec — deep gate under 18. $2,909. LAST ONE, I said. he heard 'next to last.' he was right and I hate that he was right.

observations I'd tell no one but this note:
- he pays odd numbers because round ones 'settle slower.' checked with the bank. that's not a thing. it's not about settling. it's about something else and I don't have the word.
- he returned gus's chalk line, denny's $31, my vac. keeps NOTHING that isn't paid for. a burglar with a conscience or something older than conscience. a covenant.
- the junction has four doors now. the fourth is HIS work — his mortar, his frame, hung TRUE. you can't hang a door that true in the dark alone. unless you've had a very long time to practice.
- I looked at the 1961 tunnel plat at the county. the spiral is ON IT. drawn in, then crossed out, then initialed by the surveyor: 'per owner request.' the owner in 1961 was HARKER ROW MGMT. the same LLC. unchanged, unrenamed, 64 years.

thursday: deliver the turn, keep the key, take the money, DONE. then coffee with my girl saturday and I become a boring man forever, gladly, GLADLY.

the rest is in the locked note. code: the price of the last key.`},{id:"c13-n-locked",title:"if thursday goes wrong",timestamp:"2025-12-30T21:15:00",lock:{code:"3317",hintText:"“the price of the last key.” — the final deposit knows it to the dollar.",clueSourceIds:["c13-th-bank","c13-n-ledger"]},evidenceLabel:"The locked note: his confession, his apology, and where the copies are",body:`for whoever's holding my phone. probably police. maybe perlman. hopefully not marisa. marisa if it's you, stop reading at the line of dashes. I mean it. there's a version of me worth keeping and it's above the dashes.

I sold access to the tunnels. six times, to one buyer, anonymous, through escrow. every dollar went to my daughter's college fund. that doesn't make it right. it makes it PURPOSEFUL, which I've learned is not the same word.

----------

what I know about the buyer:
- he was down there before me. before my listing. the listing didn't give him access. the listing gave him PERMISSION. I think that distinction is the whole thing. gus's crawlspaces, the neat repairs, the lime mortar — that's decades of work. the 1961 plat has his spiral on it. whatever cistern is, harker mgmt crossed him out of the drawings sixty-four years ago and has been renting 'storage' on top of him ever since. perlman's language — 'the language is why we all get paid' — boss, who taught you the language?
- he doesn't take. he TRADES. everything returned, everything squared, odd numbers, exact change. which means tonight, when he pays me $3,317 to turn the master in the last door, he believes he's bought something square. a turn of a key, witnessed. that's all. that's ALL.
- but the old super said count the doors. and the count went up. and you don't build a new door to an old tunnel. you build a new door for a new room. and you don't need the master's last turn for a door YOU built —
- unless the master doesn't open his door. unless it LOCKS something else. sixty-one keys, five buildings, three doors I never found. what if the master's real job all along was holding something shut, and every super since 1961 has been carrying the lock, not the key.

I'm taking the turn anyway. because it's $3,317 I already spent on marisa's spring semester, and because he returned denny's quarters, and a man who returns quarters will let a locksmith walk back up the stairs. that's my read. nine years of reading this building.

if I'm wrong: the ledger's above, copies of everything are taped inside the janitor sink cabinet at 14, and the county plat is public record, 1961, sheet 4. give the language to a lawyer and the spiral to someone braver.

marisa. coffee saturday. I'm going to be early. I'm never early. watch me be early. — dad`},{id:"c13-n-workorders",title:"open work orders",timestamp:"2025-12-29T08:00:00",evidenceLabel:"Six open work orders — a super who left mid-list",body:`14/3 ferro — radiator (singing, resolved, she misses the singing, unresolvable)
12/5 — window sash
16/2 — outlet sparks (GUS)
18/1 — 'scratching in wall' (scheduled: never. sorry. some walls I'm done opening)
15/4 — faucet drip
20/basement — bulb out AGAIN (third this month. same fixture. dark likes that corner)`},{id:"c13-n-marisa",title:"things to say saturday (practice)",timestamp:"2025-12-29T23:00:00",body:`don't explain the money first. don't explain AT ALL unless she asks.

ask about her classes. the bio thing. the roommate with the loud bird.

ts DOWN for six more hours, one slow meter at a time, through what the building plans insist is bedrock.",evidenceLabel:"The final fix: stationary at the junction — while its altitude sank through bedrock for six hours"}],browserHistory:[{id:"c13-b-listing",query:"anonymous listing site access rental no questions",timestamp:"2025-10-05T22:00:00",evidenceLabel:"October: where KEYHOLDER was born"},{id:"c13-b-escrow",query:"escrow service anonymous both parties legit",timestamp:"2025-10-06T21:30:00"},{id:"c13-b-529",query:"can a parent contribute to 529 without contact with child",timestamp:"2025-10-07T00:15:00",evidenceLabel:"“can a parent contribute to a 529 without contact with child”"},{id:"c13-b-mortar",query:"lime mortar who still uses it repointing old",timestamp:"2025-11-21T00:30:00"},{id:"c13-b-odd",query:"paying in odd numbers superstition meaning",timestamp:"2025-12-01T23:50:00",evidenceLabel:"“paying in odd numbers superstition meaning” — the top result is about debts to things, not people"},{id:"c13-b-plat",query:"county plat archive 1961 harker row sheet 4",timestamp:"2025-12-26T20:00:00",evidenceLabel:"The 1961 plat — the spiral, struck out “per owner request”"},{id:"c13-b-llc",query:"harker row management llc incorporation date officers",timestamp:"2025-12-26T21:15:00",evidenceLabel:"Harker Row Mgmt LLC: incorporated 1961, officers never amended, not once, in 64 years"},{id:"c13-b-last",query:"can you refuse a completed escrow delivery",timestamp:"2025-12-30T20:10:00",evidenceLabel:"His last search, 8:10 PM: “can you refuse a completed escrow delivery”"}],hiddenApp:{disguiseIcon:"calculator",disguiseLabel:"TorqueSpec",revealAfterClueIds:["c13-th-gus","c13-n-ledger"],title:"GRAYMARKET — Seller Console",heading:"Handle: KEYHOLDER · standing: five stars",body:`The anonymous marketplace client, disguised as a torque-spec calculator. Six completed listings, one buyer, a spotless rating.

The console keeps what sellers rarely re-read: the buyer's profile, and the archive of every seller who came before.`,entries:[{label:"Listing: 12 HARKER SUBLEVEL",status:"SOLD $731",detail:"buyer: CISTERN · oct"},{label:"Listings: crossover → deep gate",status:"SOLD ×5",detail:"buyer: CISTERN · $1,153–$2,909"},{label:"Listing: THE MASTER (delivery)",status:"COMPLETE $3,317",detail:"feedback: 'the turn was everything promised.'"},{label:"Buyer: CISTERN",status:"MEMBER SINCE —",detail:"join date precedes platform launch by 41 yrs · flagged, never resolved"},{label:"Prior seller: WARDKEY (1998–2003)",status:"ACCOUNT DORMANT",detail:"last listing: 'the master (delivery)' · complete"},{label:"Prior seller: SUPER61 (1971–1984)",status:"ACCOUNT DORMANT",detail:"last listing: 'the master (delivery)' · complete"},{label:"Buyer note on file",status:"PINNED",detail:"'I only ever buy one thing. sellers list it last.'"}],footer:"Every superintendent of Harker Row eventually found this marketplace, or one wearing its face — the account names go back past the internet, past the platform, past sense. Each sold small doors for small money, and each, at the end, listed the same final item without knowing the others had. 'I only ever buy one thing,' says the buyer's pinned note. 'Sellers list it last.' The master was never the merchandise. The seller was. The key just proves who's holding it.",evidenceLabel:"The GRAYMARKET console: CISTERN's join date precedes the platform by 41 years — and every prior super's last listing reads “the master (delivery) · complete”"},liveEvents:[{id:"c13-live-cistern",kind:"message",afterSeconds:340,threadId:"c13-th-cistern",message:{id:"c13-m-ci-live",from:"them",text:"[relay] to the new keyholder: the account transfers with the phone. no rush. the small doors first. you'll know which listing is last.",timestamp:"2026-01-06T21:06:00",evidenceLabel:"To whoever holds the phone: “the account transfers with the phone… you'll know which listing is last.”"}},{id:"c13-live-workorder",kind:"notification",afterSeconds:630,title:"Harker Mgmt",body:"New work order — 16 Harker, sublevel: 'door count discrepancy.' Assigned to: (vacant).",glitch:!0}],verdicts:[{id:"c13-v-ran",label:"He took the money and vanished",description:"Eleven thousand dollars of gray income, a daughter finally answering, a life worth restarting somewhere clean.",requiredEvidenceIds:["c13-m-bk-3","c13-b-listing","c13-n-workorders"],isCanon:!1,epilogue:`The flight theory needs him to abandon exactly three things, and it drowns in all three. The money: every gray dollar sits in a 529 he can't legally touch — men don't flee on funds they've already given away. The coffee: no one plans a disappearance for the Thursday before the Saturday he's spent a year begging for. The ring: still in the green toolbox, top tray, wrapped in the good chamois, exactly where his practice-note said it would be, waiting to be said plain.

Marisa is shown the note about Saturday — 'watch me be early' — as part of the standard interview. She reads it twice, hands it back, and tells the detective the only thing this verdict will ever need to hear: 'My father is a man who fixes things badly and loves things badly and shows up late. He's not a man who doesn't show up.' The file converts to suspicious circumstances that afternoon.`},{id:"c13-v-cistern",label:"The buyer collected his seventh purchase",description:"Six sales bought permission. The seventh bought the seller. Every super since 1961 listed the same final item.",requiredEvidenceIds:["case-13.hidden","c13-n-locked","c13-m-ci-12","c13-ph-junction-night","c13-ph-envelope"],isCanon:!0,epilogue:`Your report says what the console archive proves and the county plat corroborates: something has been renting the underside of Harker Row since before the LLC that pretends to own it, and it acquires its landlords on a schedule. SUPER61. WARDKEY. KEYHOLDER. Small doors for small money, trust built in exact change and returned quarters, and then the one listing every seller posts believing it's his idea. Cistern told the truth in every message — that's the horror your report can't gentle: 'I only keep what I've paid for.' He paid.

What can be charged, is: Harker Row Management's sixty-four-year-old file goes to a grand jury — the 1961 plat, the struck spiral, the 'storage' invoices billed against a void, four superintendents across six decades gone without a single report FILED BY THE COMPANY. Perlman testifies, gray-faced, honest, small: 'I learned the language. Nobody ever taught me what it was for.' The LLC is dissolved. Its officers, per the paperwork, have not aged, changed, or signed anything since 1961; the state accepts service at the registered address and the certified letter comes back marked, in handwriting the clerk photographs before she can talk herself out of it: RETURNED. SQUARE.

Milo Grieves is not recovered. The tunnels are surveyed, sealed with modern concrete, sensor-monitored. The sensors log one event, in March: three knocks, pause, three knocks — all clear, coming up — and then nothing, ever again, which the acoustic contractor calls settling and the report calls settling and nobody who has read page 44 of the 1961 handbook calls settling.

Marisa collects the ring from the green toolbox herself. She pays the $31 poker debt to Denny out of her own pocket — 'grieves square up,' she says — and she keeps her father's phone bill active, one line, month to month. On the first Saturday of every month she texts it: 'coffee. I'm early.' It's the only thread in this archive where the read receipts still, occasionally, turn on. Nobody at the carrier can explain that. Nobody in her family wants it explained.`},{id:"c13-v-mgmt",label:"Harker Management cleaned house",description:"A super logging tunnel moisture, pulling 1961 plats, photographing what insurance language buried. Companies have removed problems before.",requiredEvidenceIds:["c13-m-pe-3","c13-vm-perlman","c13-b-llc"],isCanon:!1,epilogue:`The corporate verdict: Grieves got curious about the one file that pays everyone's salary, and the company solved him. Counsel's suspicious head-start — calling about 'tunnel liability' before any report existed — reads like guilt with a retainer.

It half-holds. The company IS guilty — of the sixty-four-year paper labyrinth, the insurance language, the invoiced void. But the removal theory needs hands, and discovery finds no hands: no fixer invoices, no security contractor, no one on the row's cameras that final night except Grieves himself, descending alone, keys quiet, exactly as his own note planned. The company didn't remove him. The company's whole crime was older and lazier: it knew the tunnels collected superintendents the way gutters collect leaves, and it kept hiring superintendents, and it kept the language current.

The prosecutor gets them on fraud. At allocution, the company's counsel — the one with the sixty-year-old file — is asked why no one ever warned the supers. He consults his notes, though there is plainly nothing in them, and says: 'The vacancy always filled itself.' He is not asked a follow-up. Everyone in the room decided, in the same silent second, that they didn't want the answer on a transcript.`},{id:"c13-v-tunnels",label:"The tunnels are the other building",description:"A fourth door photographed and never found. Brick warm as a radiator. An intercom with no wires, knocking 'all clear, coming up.'",requiredEvidenceIds:["c13-vm-pipe","c13-vm-gus","c13-ph-newdoor","c13-pin-junction"],isCanon:!1,epilogue:`You write the structural version: Harker Row is two buildings — the one above, which management rents to people, and the one below, which rents itself to management, on terms nobody living negotiated. The 1961 surveyor drew what he found and was made to cross it out; the initials on the strike-through match the initials on the maintenance handbook's knock codes, a man teaching future supers how to speak politely to the lower floors. Doors that appear in photographs and not in masonry. Altitude readings sinking through bedrock at a patient meter an hour — not falling. DESCENDING. Being taken down a stairwell that isn't on sheet 4 because it was struck out, per owner request, and the owner was not the LLC.

The report is filed under structural anomalies, which is where the county files its prayers. The city's response is perfect municipal poetry: the sublevels are condemned — declared unfit for occupancy. A notice is posted on the alley door. Within a week the notice is gone, and in its place, dead center, level, hung true, is a small brass frame containing the notice NEATLY FOLDED, the way you'd keep a letter from a tenant you'd decided to forgive.

The last line of your report is a maintenance recommendation, and you stand by it as the only actionable finding in the entire file: the next superintendent of Harker Row should be issued sixty keys. Whatever the sixty-first was holding shut has a new keyholder now, and he was always the conscientious kind. The buildings, you note, have never been in better repair. The radiators sing on key. Something square is maintaining a home down there, and for the first time in sixty-four years, it isn't behind on the work orders.`}]},aa=Object.freeze(Object.defineProperty({__proto__:null,default:ta},Symbol.toStringTag,{value:"Module"})),ia={id:"case-14",title:"Storm Chaser",victimName:"Wade Kessler, 37",summary:"Every chaser knows phantom echoes: bugs, birds, bad calibration. Wade's phantom had a hook echo, a debris ball, and perfect rotation — parked over the Hollett quarter for weeks, visible only on his app, under skies so blue they hurt. His truck was found at the field gate, hazards on, anemometer still spinning. There was no wind that day. There hasn't been wind there since 1987.",intake:`SUBJECT: Kessler, Wade A. (37). Reported missing by chase partner R. 'Bobbi' Brandt, Jun 22, after he drove alone to a location they had jointly agreed 'was a data error.'

DEVICE: Recovered Jun 21, 21:40, from the cab of his truck at the gate of the Hollett quarter (unfarmed since 1987). Truck: hazards on, doors closed, keys present. Mounted anemometer rotating at approx. 40 mph equivalent. Conditions at recovery: dead calm, ceiling unlimited.

METEOROLOGY: Subject's app displayed a stationary supercell at this location, sourced — per the app's own diagnostics — from 'STATION 7,' a radar site decommissioned in 1988 following a data-integrity scandal: its final weeks of output showed a tornado that 'failed to dissipate.' The station has no power service. Its feed updates every four seconds.

HISTORY: Jun 1987 — an F4 was tracked into the Hollett quarter. Damage survey found the track ENDED at the property line. Three storm spotters working the event were never located. The county's file on them was, per the archivist, 'thinned' in 1991.

Second-pass review requested. Do not stand in the northeast corner of the field for longer than feels reasonable. This sentence appears in the 1987 file too.`,contentWarningLevel:2,phone:{ownerLabel:"WADE K — storm spotter, call NWS first, me second",recoveredAt:"2026-06-23T21:15:00",batteryStart:44,wallpaperHue:250,lockScreenNotifications:[{appId:"messages",title:"Leo 🌪",preview:"dad did you see a tornado today. mom says ask you SAFELY",targetId:"c14-th-leo"},{appId:"messages",title:"Bobbi (chase)",preview:"WADE. the sky was EMPTY. answer your radio, answer ANYTHING",targetId:"c14-th-bobbi"},{appId:"phone",title:"Voicemail",preview:"STATION 7 — admin line · 1:22",targetId:"c14-vm-station"}]},messages:[{id:"c14-th-bobbi",contactName:"Bobbi (chase)",contactNumber:"(316) 555-0177",ghostTypingAfterSeconds:390,messages:[{id:"c14-m-bo-1",from:"them",text:"SPC has us moderate risk thursday. gas up, check the hail guards, IT'S SEASON BABY",timestamp:"2026-05-12T09:00:00"},{id:"c14-m-bo-2",from:"owner",text:"rig's ready. leo drew a tornado on the hood with washable marker. leaving it. it's the best liveried chase truck in kansas now",timestamp:"2026-05-12T09:20:00"},{id:"c14-m-bo-3",from:"owner",text:"bobbi. app question. you seeing this cell NE of hollett crossing? TVS marker, debris ball, the works. because radar mosaic shows clean air and I've refreshed everything twice",timestamp:"2026-05-28T16:22:00",evidenceLabel:"May 28: the cell appears — on his app only"},{id:"c14-m-bo-4",from:"them",text:"nothing here. nimbustrak's clean, GR2 is clean, NWS is clean. your app's hallucinating. what's your data source even set to",timestamp:"2026-05-28T16:30:00"},{id:"c14-m-bo-5",from:"owner",text:"that's the thing. diagnostics says the layer's coming from 'STATION 7.' I didn't add station 7. I can't REMOVE station 7. the toggle greys out",timestamp:"2026-05-28T16:41:00",evidenceLabel:"The layer source: STATION 7 — a feed he didn't add and can't remove"},{id:"c14-m-bo-6",from:"them",text:"ok that's a support ticket, not a chase target. promise me you're not driving out to look at a software bug",timestamp:"2026-05-28T16:44:00"},{id:"c14-m-bo-7",from:"owner",text:"I drove out to look at the software bug",timestamp:"2026-06-01T18:50:00"},{id:"c14-m-bo-8",from:"owner",text:"bobbi the field is calm and blue and the app says I am standing 400 yards from a violent tornado. and here's the part I need you to not laugh at: I BELIEVE THE APP. the air out here is wrong. pressure's wrong. my ears keep popping. there are no birds. there are no BUGS, bobbi, it's june in kansas and the windshield is clean",timestamp:"2026-06-01T19:15:00",evidenceLabel:"“I am standing 400 yards from a violent tornado… there are no birds. there are no bugs.”"},{id:"c14-m-bo-9",from:"them",text:"get in the truck and come back and we'll get you a beer and a psych eval, in whichever order",timestamp:"2026-06-01T19:18:00",evidenceLabel:"Bobbi, June 1: come back — “a beer and a psych eval, in whichever order”"},{id:"c14-m-bo-10",from:"them",text:"WADE. the sky was EMPTY. answer your radio, answer ANYTHING",timestamp:"2026-06-21T20:30:00"}]},{id:"c14-th-leo",contactName:"Leo 🌪",contactNumber:"(316) 555-0142",messages:[{id:"c14-m-le-1",from:"them",text:"dad I did my report on the fujita scale and got an A. ms lopez says I know 'an unusual amount' about wind",timestamp:"2026-05-20T16:00:00"},{id:"c14-m-le-2",from:"owner",text:"an A!! that's my boy. 'an unusual amount about wind' is going on the family crest",timestamp:"2026-05-20T16:20:00"},{id:"c14-m-le-3",from:"them",text:"when I'm 12 can I come on a chase. mom said ask you so you have to be the one to say no. she told me to tell you that part too",timestamp:"2026-06-10T18:30:00"},{id:"c14-m-le-4",from:"owner",text:"when you're 12 you can come on a BLUE SKY drive where we look at where storms USED to be. deal? we'll start with the safest storm in kansas. I know one that never moves an inch",timestamp:"2026-06-10T18:45:00",evidenceLabel:"To his son: “we'll start with the safest storm in kansas. I know one that never moves an inch.”"},{id:"c14-m-le-5",from:"them",text:"storms move dad. that's literally what they are. wind that MOVES",timestamp:"2026-06-10T18:47:00",evidenceLabel:"Leo, age 10: “storms move dad. that's literally what they are.”"},{id:"c14-m-le-6",from:"them",text:"dad did you see a tornado today. mom says ask you SAFELY",timestamp:"2026-06-21T19:00:00"}]},{id:"c14-th-forum",contactName:"Plains Chasers (group)",messages:[{id:"c14-m-fo-1",from:"them",text:"Dutch: anyone else's nimbustrak pulling a ghost layer near hollett crossing? asking for a friend. the friend is my sanity",timestamp:"2026-06-03T21:00:00",evidenceLabel:"Another chaser saw the ghost layer — briefly"},{id:"c14-m-fo-2",from:"owner",text:"YES. station 7 feed. TVS parked on the hollett quarter. you see it too??",timestamp:"2026-06-03T21:05:00"},{id:"c14-m-fo-3",from:"them",text:"Dutch: saw it for like an hour, then my app updated and it was gone. yours still showing it?",timestamp:"2026-06-03T21:10:00"},{id:"c14-m-fo-4",from:"owner",text:"mine won't update. app store says 'no updates available.' for eleven days it's said that. bobbi's updated twice in that window",timestamp:"2026-06-03T21:14:00",evidenceLabel:"His app alone refuses to update — eleven days and counting"},{id:"c14-m-fo-5",from:"them",text:"Grizz: old timers used to talk about station 7. channel 88 on the old spotter net. they'd say 'if 88 paints it and the sky doesn't, drive the OTHER way.' I always figured it was a drinking story",timestamp:"2026-06-03T21:30:00",evidenceLabel:"The old spotters' rule: “if 88 paints it and the sky doesn't, drive the OTHER way.”"},{id:"c14-m-fo-6",from:"them",text:"Grizz: also kessler. my dad spotted in '87. he knew the three that went missing. he kept his spotter card in his wallet till he died with one corner burned off. said the card came back like that from the hollett quarter and HE never went. it came back to him. think about that sentence as long as I have",timestamp:"2026-06-03T21:44:00",evidenceLabel:"1987: a missing spotter's card returned itself, one corner burned"}]},{id:"c14-th-nws",contactName:"NWS Spotter Desk",messages:[{id:"c14-m-nw-1",from:"owner",text:"Spotter WX-341 (Kessler) reporting: my app shows persistent rotation NE of Hollett Crossing, source 'Station 7.' Visual: clear air. Reporting the discrepancy, not the storm.",timestamp:"2026-06-02T10:00:00",evidenceLabel:"He reported it correctly: the discrepancy, not the storm"},{id:"c14-m-nw-2",from:"them",text:"Thanks WX-341. No returns at that location on any operational site. Station 7 was decommissioned in 1988 — if an app is labeling a layer with that ID, it's corrupt archive data. Good instinct reporting it. Stay with visuals.",timestamp:"2026-06-02T10:30:00"},{id:"c14-m-nw-3",from:"owner",text:"Understood. One more: does the archive explain why Station 7 was decommissioned?",timestamp:"2026-06-02T10:35:00"},{id:"c14-m-nw-4",from:"them",text:"Before my time. File says 'data integrity.' Off the record, WX-341: my predecessor kept a note taped in the desk drawer that says 'do not answer questions about 7 after dark.' Retiring in August, so — it's 10:36 AM, and that's everything I know.",timestamp:"2026-06-02T10:36:00",evidenceLabel:"The NWS desk note: “do not answer questions about 7 after dark.”"}]},{id:"c14-th-dana",contactName:"Dana (ex, Leo's mom)",contactNumber:"(316) 555-0119",messages:[{id:"c14-m-da-1",from:"them",text:"leo's science fair is the 26th. he built a wind tunnel out of a box fan and my good hair dryer. be there or explain yourself to him, I'm out of the middle",timestamp:"2026-06-15T12:00:00"},{id:"c14-m-da-2",from:"owner",text:"wouldn't miss it. also tell him the hair dryer counts as 'borrowed for science' which is legally different from taken",timestamp:"2026-06-15T12:20:00"},{id:"c14-m-da-3",from:"them",text:"wade. bobbi called me. why is bobbi calling ME about where you chase. we've been divorced four years and I STILL know that means you're doing the thing where you go alone",timestamp:"2026-06-18T21:00:00",evidenceLabel:"Dana: “you're doing the thing where you go alone”"},{id:"c14-m-da-4",from:"owner",text:"one more trip out there and I'm done with it. I'm documenting something and then I'm handing it to people smarter than me. I promise. science fair on the 26th. I'll be the loud dad",timestamp:"2026-06-18T21:15:00",evidenceLabel:"“one more trip out there and I'm done… I'll be the loud dad”"}]},{id:"c14-th-hollett",contactName:"Marv Hollett",contactNumber:"(316) 555-0163",messages:[{id:"c14-m-ho-1",from:"owner",text:"Mr. Hollett — Wade Kessler, the spotter who's been parking at your gate. Thanks for not shooting at me. Question: why's the quarter section fallow? Rest of your ground is immaculate.",timestamp:"2026-06-08T17:00:00"},{id:"c14-m-ho-2",from:"them",text:"Dad's rule, then mine: we don't work the northeast quarter. Equipment quits in it. Not breaks — QUITS. Diesel dies at the property line and starts on the other side. GPS on the combine says it's raining. It has said that for as long as combines have had GPS.",timestamp:"2026-06-08T17:30:00",evidenceLabel:"The farmer: equipment QUITS in the quarter — combine GPS says it's raining, always"},{id:"c14-m-ho-3",from:"owner",text:"Since '87?",timestamp:"2026-06-08T17:32:00"},{id:"c14-m-ho-4",from:"them",text:"Since '87. Dad watched the funnel come across Route 12 and set down in that corner like a dog told to sit. His word. SIT. Then the sirens quit and the sky went blue and the field's been wrong ever since. We let it have the quarter. Cheap rent, considering.",timestamp:"2026-06-08T17:40:00",evidenceLabel:"“Set down in that corner like a dog told to sit… We let it have the quarter. Cheap rent, considering.”"}]},{id:"c14-th-work",contactName:"Kessler HVAC (Ray)",contactNumber:"(316) 555-0188",messages:[{id:"c14-m-wo-1",from:"them",text:"mrs deitz's AC again. she says it's 'breathing weird.' it's a compressor, wade, but she asks for you because you 'listen to it right'",timestamp:"2026-06-16T08:00:00"},{id:"c14-m-wo-2",from:"owner",text:"on it after lunch. and she's not wrong, machines tell you everything if you listen right. people too. weather too",timestamp:"2026-06-16T08:15:00"}]},{id:"c14-th-nimbus",contactName:"NimbusTrak Support",messages:[{id:"c14-m-ni-1",from:"owner",text:"Bug report: my install shows a persistent layer sourced 'STATION 7' that I cannot disable. Attached diagnostics.",timestamp:"2026-06-04T11:00:00"},{id:"c14-m-ni-2",from:"them",text:"NimbusTrak: Thanks Wade! We checked your diagnostics. There is no layer named STATION 7 in your install, and the attached file you sent us is empty (0 KB). Try reinstalling!",timestamp:"2026-06-04T13:00:00",evidenceLabel:"Support received his diagnostics as an empty file. Twice."},{id:"c14-m-ni-3",from:"owner",text:"Reinstalled. It survived the reinstall. It's the only thing that survived the reinstall — I lost all my saved chase logs, but station 7 is still there.",timestamp:"2026-06-04T15:20:00",evidenceLabel:"The layer survived a full reinstall. Nothing else did."},{id:"c14-m-ni-4",from:"them",text:"NimbusTrak: That's not possible, but we believe you believe it! Escalating to engineering. (Engineering note, sent in error: 'another 88 ticket. archive & close per policy.')",timestamp:"2026-06-04T16:00:00",evidenceLabel:"Engineering's note, sent in error: “another 88 ticket. archive & close per policy.”"}]},{id:"c14-th-unknown",contactName:"Unknown",messages:[{id:"c14-m-un-1",from:"them",text:"spotter wx-341. report conditions at your location.",timestamp:"2026-06-14T04:40:00",evidenceLabel:"4:40 AM, unknown number, spotter-net phrasing: “report conditions at your location.”"},{id:"c14-m-un-2",from:"owner",text:"who is this? I report to the NWS desk, not this number",timestamp:"2026-06-14T08:30:00"},{id:"c14-m-un-3",from:"them",text:"the desk closes. the net doesn't. three positions open. report co 7 clipping: Station 7's final transmission — “three positions open. report conditions.”"},{id:"c14-ph-dashcam",caption:"",timestamp:"2026-06-21T19:58:00",aspect:"landscape",deleted:!0,meta:{takenAt:"2026-06-21T19:58:00",editedAt:"2026-06-21T19:54:00",device:"Dash cam (auto-import)",location:"Hollett quarter gate"},svg:s('<rect width="400" height="300" fill="#101318"/><rect x="20" y="20" width="360" height="200" rx="6" fill="#182028"/><rect x="30" y="30" width="340" height="120" fill="#22364a"/><rect x="30" y="150" width="340" height="50" fill="#2e3120"/><path d="M180 30 Q200 30 210 60 Q225 100 205 150 L165 150 Q150 100 165 60 Q172 30 180 30z" fill="#0a0d12"/><ellipse cx="188" cy="34" rx="90" ry="14" fill="#0c1016"/><rect x="0" y="230" width="400" height="70" fill="#0b0d10"/><text x="200" y="262" text-anchor="middle" font-family="monospace" font-size="9" fill="#4a5560">through the WINDSHIELD: the wedge. out the SIDE WINDOW, same frame: blue sky.</text><text x="200" y="280" text-anchor="middle" font-family="monospace" font-size="8" fill="#39404b">the storm exists straight ahead. only straight ahead. it exists in the direction of looking.</text>',{aspect:"landscape",base:"#0c0f13",grain:.14}),evidenceLabel:"The dash cam frame: the tornado visible through the windshield — blue sky out the side window, same frame"},{id:"c14-ph-nightfield",caption:"",timestamp:"2026-06-21T20:04:00",aspect:"landscape",meta:{takenAt:"2026-06-21T20:04:00",device:"This phone",location:"Hollett quarter"},svg:s('<rect width="400" height="300" fill="#060708"/>'+C(200,200,100,"#12160e",.4),{aspect:"landscape",base:"#050607",grain:.2}),flashlight:{hiddenSvg:s('<rect width="400" height="300" fill="#0a0d08"/>'+Array.from({length:4},(t,e)=>`<ellipse cx="200" cy="200" rx="${160-e*35}" ry="${55-e*12}" fill="none" stroke="#1a2212" stroke-width="6" transform="rotate(${e*8} 200 200)"/>`).join("")+g(120,190,.85,.5,"#05070a")+g(285,195,.85,.5,"#05070a")+g(200,145,.85,.5,"#05070a")+'<text x="200" y="278" text-anchor="middle" font-family="monospace" font-size="9" fill="#3f4a38">the grass lies down in a spiral. and standing in the lanes: three people. spotting. facing the center. positions one, two, three.</text>'+E("20:04:41",400,300),{aspect:"landscape",base:"#080a06",grain:.13})},evidenceLabel:"His flashlight photo: grass flattened in a spiral — three figures standing in it, facing the center"},{id:"c14-ph-leo-drawing",caption:"leo's science fair preview: 'THE FUJITA SCALE by leo k.' there's a sixth drawing after F5. he labeled it 'dad's one.' kid draws a storm standing still. I never told him it stands still",timestamp:"2026-06-17T19:00:00",aspect:"portrait",meta:{takenAt:"2026-06-17T19:00:00",device:"This phone"},svg:s('<rect width="300" height="400" fill="#161310"/><rect x="45" y="50" width="210" height="300" fill="#d8d2c2" opacity="0.9"/><text x="150" y="85" text-anchor="middle" font-family="serif" font-size="11" fill="#3a5c8a">THE FUJITA SCALE by leo k.</text>'+Array.from({length:5},(t,e)=>`<path d="M${70+e*36} 130 q8 -25 ${6+e*2} -45" stroke="#55503f" stroke-width="${2+e}" fill="none"/><text x="${70+e*36}" y="145" text-anchor="middle" font-family="serif" font-size="8" fill="#55503f">F${e}</text>`).join("")+`<path d="M150 230 q0 -30 0 -55 q0 -20 0 -20" stroke="#7a3a42" stroke-width="8" fill="none"/><ellipse cx="150" cy="150" rx="40" ry="10" fill="#7a3a42" opacity="0.6"/><text x="150" y="250" text-anchor="middle" font-family="serif" font-size="9" fill="#7a3a42">dad's one</text><text x="150" y="268" text-anchor="middle" font-family="serif" font-size="8" fill="#55503f">(it doesn't go anywhere. it waits.)</text>`,{aspect:"portrait",base:"#100e0a",grain:.1}),evidenceLabel:"Leo's drawing: a sixth tornado after F5, labeled “dad's one — it doesn't go anywhere. it waits.”"}],notes:[{id:"c14-n-chaselog",title:"chase log — the stationary cell",timestamp:"2026-06-19T22:00:00",evidenceLabel:"His chase log: three weeks of measurements at the Hollett quarter",body:`logging like a spotter, not a believer. dates, numbers, facts.

may 28 — first paint. station 7 layer, can't disable. cell age field: overflow. filed with nimbustrak AND nws. did everything right. want that on record: I did everything RIGHT first.

jun 1 — site visit 1. clear air. pressure 940mb ON MY KESTREL — that's hurricane-core pressure, under blue sky. recalibrated. 940 again. bought a second kestrel. 940.

jun 5 — station 7 site. dish rusted solid, and turning-sound anyway, once per 4 seconds. same as the feed's update rate. stood there 20 min matching it against the app. sync never drifted. a dead antenna is SCANNING.

jun 8 — marv hollett's testimony. 'sit.' like a dog told to sit. 38 years.

jun 12 — anemometer test. 40mph in dead calm. leo's kite string: limp. instruments believe the storm. bodies don't. or bodies believe it slower.

jun 15 — the hail circle. not melting. took a piece in the cooler: melted NORMALLY once it crossed the property line. took video. video file corrupts at exactly the property line every time. four takes.

jun 21 plan — last trip, full documentation: dashcam, both kestrels, the good camera, tripods at positions marked on grizz's dad's old spotter map (found it at the historical society — three positions marked around the NE corner, initialed by the three who never came back. they were STATIONED there. it wasn't random. the net posted them).

after this: everything goes to the NWS, the state climatologist, and honestly whoever answers. then science fair on the 26th. then blue-sky drives with my boy until he's sick of me.

the rest is locked. code: the station, then the channel.`},{id:"c14-n-locked",title:"read this one, bobbi",timestamp:"2026-06-21T18:30:00",lock:{code:"0788",hintText:"“the station, then the channel.” — the dead radar has a number; the old spotter net had another.",clueSourceIds:["c14-th-forum","c14-ph-dome"]},evidenceLabel:"The locked note, written at the gate, 90 minutes before the end",body:`bobbi. writing this in the truck at the gate because you're the only one who won't sand the edges off it when you pass it on.

what I think it is, in spotter language:

in '87 an F4 crossed route 12 and something about this quarter section CAUGHT it. don't ask me the mechanism — ask me the evidence: a storm that radar tracked to a point and never off it. a station that recorded the truth and got decommissioned for it. three spotters posted to positions around it who never came home, and a spotter NET that kept transmitting 'three positions open' for six hours after everyone had run. it wasn't malfunctioning, bobbi. it was RECRUITING. it's been recruiting on channel 88 for thirty-eight years, and station 7's feed found its way into my app because I'm the kind of man who checks the discrepancy instead of updating the software. it posts positions. it staffs itself. every net needs spotters and this storm intends to be watched.

the three figures in my night photo are standing at grizz's dad's map positions. positions one, two, three. still on duty. facing the center. and the center — the app has always shown four TVS markers, bobbi. I thought it was noise. it's not noise. it's position four, and it's open, and the unknown number keeps asking me to report conditions.

so here's what I want you to know before I walk the fence line WITH THE CAMERA, WHICH IS ALL I'M DOING:

1. everything's documented. cooler in the truck bed: hail sample, both kestrels, the spotter map, microfilm copies. chain of custody starts with you.
2. if the anemometer's still spinning when someone finds the truck: DO NOT stand in the northeast corner longer than feels reasonable. you'll know what 'reasonable' means when you feel it end.
3. tell dana I said the loud-dad thing and meant it. tell leo his sixth drawing was right and his mother is never to know I confirmed it. tell him the safest storm in kansas turned out to need watching after all, and his dad was a trained spotter, and trained spotters don't abandon a watch.

it's been the honor of my life to look at the sky on purpose. — WX-341, reporting conditions.`},{id:"c14-n-hvac",title:"work — parts to order",timestamp:"2026-06-16T12:00:00",evidenceLabel:"His parts list for Tuesday — a man mid-week, mid-life, mid-plan",body:`deitz compressor: soft-start kit (listen to it Tuesday first)
