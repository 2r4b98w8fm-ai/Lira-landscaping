 text-anchor="middle" font-family="serif" font-size="7" fill="#7a3a42">on-property for restoration, duration at our</text><text x="150" y="296" text-anchor="middle" font-family="serif" font-size="7" fill="#7a3a42">discretion, billed as extended integration.</text><rect x="65" y="320" width="80" height="3" fill="#3a3427"/>',{aspect:"portrait",base:"#0e0c0b",grain:.1}),evidenceLabel:"Deleted photo of waiver §9: guests “may be relocated… duration at our discretion, billed as extended integration”"},{id:"c10-ph-clipboard",caption:"",timestamp:"2025-11-01T16:14:00",aspect:"portrait",deleted:!0,meta:{takenAt:"2025-11-01T16:14:00",device:"This phone",location:"north path (off rhythm)"},svg:s('<rect width="300" height="400" fill="#100f0d"/><rect x="60" y="60" width="180" height="280" rx="6" fill="#2a2318"/><rect x="75" y="85" width="150" height="240" fill="#d3cab4" opacity="0.9"/><rect x="125" y="52" width="50" height="20" rx="6" fill="#3d3226"/><text x="150" y="110" text-anchor="middle" font-family="monospace" font-size="8" fill="#3a3427">QUIET CENSUS — NOV</text>'+["W. TOMLIN — day 2","R. OKAFOR — day 41","D. PRICE — day 190","H. YUEN — day 388","M. SOL — day 1,101","(bed 6 — prepared)"].map((t,e)=>`<text x="85" y="${140+e*28}" font-family="monospace" font-size="8" fill="${e===5?"#7a3a42":"#55503f"}">${t}</text>`).join(""),{aspect:"portrait",base:"#0c0b09",grain:.11}),evidenceLabel:"The Quiet Cabins census: five guests, held 2 to 1,101 days — and “bed 6 — prepared”"},{id:"c10-ph-selfcare",caption:"day 3. I slept nine hours. I forgot what nine hours does to a face. maybe this place is fine and I'm just broken in the specific shape of someone who can't accept kindness",timestamp:"2025-10-28T09:40:00",aspect:"portrait",meta:{takenAt:"2025-10-28T09:40:00",device:"This phone"},svg:s('<rect width="300" height="400" fill="#1a1d17"/><circle cx="150" cy="180" r="70" fill="#2c3328" opacity="0.8"/><rect y="290" width="300" height="110" fill="#141810"/><circle cx="240" cy="80" r="30" fill="#4a4632" opacity="0.4"/>',{aspect:"portrait",base:"#12150e",grain:.12})}],notes:[{id:"c10-n-hike",title:"walking notes (kept on paper, typed up at marker 31)",timestamp:"2025-11-01T23:30:00",evidenceLabel:"Her walking notes: everything wrong at Stillpoint, typed in one battery-saving burst",body:`typing fast, one bar, 40% battery. paper notes transcribed:

oct 29 — tomlin missed movement AND nourish. asked aspen. 'restoring in the quiet cabins.' asked to visit. 'guests restore alone.' he's a 61-year-old man with a bad hip who told me his daughter's wedding is nov 8. he would CRAWL out for that wedding.

oct 30 — staff never eat. staff never yawn. staff are grateful for the quiet ones. juniper's lanyard flipped over at circle: the back is a MEDICATION SCHEDULE. six names. none of them are staff names.

oct 31 — tomlin 'left early on foot.' his boots are outside willow. city man, brand new boots, blisters by day 2. he did not walk out of these mountains barefoot.

nov 1 — followed the meal cart north, off the rhythm paths. three cabins the welcome map doesn't show. ramps. outside padlocks. six trays on the cart. I counted five names on juniper's lanyard. six trays. one tray is for somebody new.

plan: reclaimed my phone from the Basket tonight (tag 06, they don't count after silence hours). photos taken. tomorrow night I go back up past the marker to the meadow — you can see it from the ridge, north of their fence line, and there's something IN it, rows of something pale — document that, then drive out at dawn whether checkout likes it or not.

locked note has the rest. code: my tag, then the marker where the bars appear.`},{id:"c10-n-locked",title:"for the sheriff (not the retreat)",timestamp:"2025-11-02T00:15:00",lock:{code:"0631",hintText:"“my tag, then the marker where the bars appear.” — the Basket gave her a number; the trail gave her another.",clueSourceIds:["c10-ph-basket","c10-n-hike"]},evidenceLabel:"The locked note: her formal statement, written like a nurse's chart",body:`STATEMENT OF FARRAH HADDAD, RN — written 02:15, Nov 2, cabin Cedar, by lantern.

I am documenting in the format I trust: findings, not feelings.

FINDING 1: Stillpoint Ridge operates an unlicensed long-term custodial facility ('Quiet Cabins') holding at minimum five persons, one for over three years, medicated per a schedule worn on a staff lanyard, billed to their own accounts as 'extended integration.' I have photographed the census and the waiver clause that launders it.

FINDING 2: W. Tomlin was moved to the Quiet Cabins on or about Oct 29 following a panic episode at evening circle — an episode I witnessed and could have treated with a chair, water, and ten minutes. They took him north instead. His 'departure on foot' is fabricated; exhibit: his boots.

FINDING 3: guests sign §9 without reading it because they are exhausted people begging for rest. I signed it. I am in the inventory too, if they want me to be. The only thing between any guest and bed 6 is staff discretion and a padlock.

FINDING 4 (unverified): there is a meadow north of the fence that the retreat's maps refuse. The staff will not walk north of the fence. Aspen, who is never unsettled, is unsettled by the meadow. Whatever the retreat is doing in the Quiet Cabins, it is a HUMAN wrongness — billing, sedation, cowardice. The meadow is not in that category. The staff behave like tenants about the meadow. Like the fence is the landlord's.

TOMORROW: meadow at dusk, photos, then out at first light. If this note reaches anyone instead of me: the census names five people who cannot ask for help. Go north of the rhythm paths. Bring the county. Bring bolt cutters.

— F. Haddad, RN. Eleven years ICU. I still want to be a nurse. Turns out that was the question and this place answered it.`},{id:"c10-n-packing",title:"packing (soft colors???)",timestamp:"2025-10-24T21:00:00",body:`oatmeal cardigan (softest color I own)
hiking boots (broken in, unlike SOME people's)
paper, pen, layla's number ON PAPER
the little med kit. yes it's a detox. the kit comes. non-negotiable`},{id:"c10-n-gratitude",title:"gratitude journal (assigned)",timestamp:"2025-10-30T20:00:00",evidenceLabel:"Her gratitude journal — and the day-6 prompt she refused to answer",body:`day 1: grateful for sleep
day 2: grateful for sleep, again, genuinely
day 3: grateful for nine hours and a face I recognized
day 4: grateful for tomlin's decaf joke at breakfast
day 5: tomlin wasn't at breakfast
day 6: (assigned prompt: 'what would you give to feel this rested forever?')
day 6: I left day 6 blank. the prompt is doing a lot of work and I don't like the job it applied for.`}],voicemails:[{id:"c10-vm-layla",callerLabel:"Layla (sis)",callerNumber:"(720) 555-0139",timestamp:"2025-11-08T16:00:00",durationSec:27,tone:"plain",transcript:`[automated transcript — audio partially recovered]
“It's me. The sheriff took the report — county, like you said, not the retreat, I DID IT LIKE YOU SAID. They're sending someone up tomorrow. Farrah, your voicemail is the only place your voice still lives right now and I hate it. Paper promise, remember? You promised on paper. Come make it true.”`},{id:"c10-vm-memo1",callerLabel:"Voice memo — Farrah (synced)",timestamp:"2025-11-09T23:35:00",durationSec:38,tone:"plain",evidenceLabel:"Synced memo 1: her voice on the ridge, one week after the retreat says she left",transcript:`[voice memo — final sync batch]
“Memo one. It's Farrah Haddad, it's November ninth, I think — I've been keeping to the tree line for days because they walk the fence at night now. If this syncs: I did not leave on November second. Aspen and two guides I'd never seen 'walked me out' — north, not toward the road. NORTH. I got loose at the fence line and I've been between the boundary and the meadow since. There are worse places to be stuck. That's not a joke. I've seen where the trays go. The meadow is safer than the retreat. Hold that thought, whoever you are, because I need you to believe the next memo.”`},{id:"c10-vm-memo2",callerLabel:"Voice memo — Farrah (synced)",timestamp:"2025-11-10T00:40:00",durationSec:31,tone:"distorted",evidenceLabel:"Synced memo 2: the stones, and what she found at the sixth row",transcript:`[voice memo — final sync batch, wind interference]
“Memo two. The stones — the REST stones — they're in rows and the rows are old, the lichen says decades, some say a century. It's not the retreat's work. The retreat is twelve years old and it's SCARED of this place, and I understand why now, because — [wind] — the sixth row is new. The stone is clean. The carving is fresh. And the ground in front of it is — [wind] — it's not dug, that's the thing. It's not DUG. It's just… ready.”`},{id:"c10-vm-memo3",callerLabel:"Voice memo — Farrah (synced)",timestamp:"2025-11-10T02:10:00",durationSec:117,tone:"breathing",evidenceLabel:"Synced memo 3: the last two minutes — and the second voice",transcript:`[voice memo — final sync batch. two speakers detected. forensic linguistics disputes this.]
FARRAH (whisper): “Memo three. Someone's crossing the meadow. Not staff. Staff don't come past the fence. It's — hold on. It's carrying a lantern with no light in it. I'm going to stay very still and keep recording, because you deserve the whole chart, whoever you are. Vitals: I'm okay. I'm cold, and I'm okay.”
[ninety seconds: wind, grass, breathing — steady, then steadier, then slow]
SECOND VOICE (very close, conversational): “eleven years. you can rest now, if you want. only if you want.”
FARRAH: [a long exhale] “…what happens to the five in the cabins?”
SECOND VOICE: “first them, then you. that's a nurse's answer. we thought it would be.”
[footsteps in grass, two sets, receding]
[the phone remains. at 02:14 it syncs. then nothing.]

⚠ EVIDENCE ANNOTATION: on Nov 11, county deputies executing a warrant found the Quiet Cabins EMPTY, doors open, padlocks neatly stacked, five guests sitting at the main lodge asking for their families by name. None can describe who let them out. All five, separately, used the same phrase: 'the nurse came first.'`},{id:"c10-vm-retreat",callerLabel:"Stillpoint Ridge",timestamp:"2025-11-11T10:00:00",durationSec:24,tone:"static",evidenceLabel:"Stillpoint's voicemail after the raid: serene to the last",transcript:`[automated transcript]
“Farrah, this is Willow at Stillpoint. There's been a great deal of disruption here — vehicles, questions, doors opened without ceremony. We know you're at peace with whatever role you played. We forgive you. The mountain forgives everyone eventually. Your belongings are at reception. Someone should collect them soon. The Basket doesn't like… [remainder unrecoverable]”`}],calendarEvents:[{id:"c10-cal-leave",title:"WELLNESS LEAVE BEGINS 🎉",date:"2025-10-24",time:"08:00",createdBy:"owner"},{id:"c10-cal-checkin",title:"Stillpoint check-in",date:"2025-10-26",time:"11:00",createdBy:"owner"},{id:"c10-cal-checkout",title:"checkout — CALL LAYLA FIRST THING",date:"2025-11-05",time:"10:00",createdBy:"owner",struck:!0,evidenceLabel:"Her checkout reminder — struck through on Nov 2 by an account named “stillpoint-sync”"},{id:"c10-cal-integration",title:"extended integration",date:"2025-11-05",time:"10:00",recurring:"daily",createdBy:"external",detail:"Added Nov 2 by 'stillpoint-sync', an integration her account never authorized. It repeats daily. It has no end date.",evidenceLabel:"“extended integration” — added to her calendar by the retreat, daily, no end date"},{id:"c10-cal-rtw",title:"return-to-work paperwork due",date:"2025-11-10",time:"09:00",createdBy:"owner"},{id:"c10-cal-shift",title:"first shift back 💙 (ease in. HA.)",date:"2025-11-12",time:"07:00",createdBy:"owner",evidenceLabel:"Her first shift back at the ICU, still on the calendar"}],locationPins:[{id:"c10-pin-hospital",label:"St. Augustine Hospital",timestamp:"2025-10-23T19:30:00",x:15,y:20},{id:"c10-pin-home",label:"Home — Quarry St",timestamp:"2025-10-25T22:00:00",x:22,y:32},{id:"c10-pin-drive",label:"Mountain highway (drive up)",timestamp:"2025-10-26T09:40:00",x:45,y:50},{id:"c10-pin-retreat",label:"Stillpoint Ridge Retreat",timestamp:"2025-10-26T11:02:00",x:65,y:62,detail:"Last fix before the Basket. The phone goes dark here for six days."},{id:"c10-pin-marker31",label:"Trail marker 31 (ridge)",timestamp:"2025-11-01T23:38:00",x:72,y:45,detail:"The phone wakes here, twice: Nov 1 (her texts to Layla and the hike notes) and briefly Nov 2 at 00:20.",evidenceLabel:"Marker 31: the phone's two waking moments during her stay"},{id:"c10-pin-meadow",label:"North meadow — final sync",timestamp:"2025-11-10T02:14:00",x:78,y:30,detail:"The final sync: 02:14, Nov 10 — 0.4 miles past the retreat's fence, inside a meadow Stillpoint's counsel denies and the USGS has mapped since 1954. Searchers found flattened grass in a neat rectangle, phone-sized, at the head of the sixth row of stones. No phone.",evidenceLabel:"The final sync point: the sixth row of stones — flattened grass in a phone-sized rectangle"}],browserHistory:[{id:"c10-b-burnout",query:"nurse burnout when to take leave before you break",timestamp:"2025-10-10T23:40:00",evidenceLabel:"Her October search: “nurse burnout when to take leave before you break”"},{id:"c10-b-retreat",query:"stillpoint ridge retreat reviews",timestamp:"2025-10-14T20:00:00",evidenceLabel:"Her review search: hundreds of five-star reviews, not one complaint, twelve years"},{id:"c10-b-noreviews",query:"why would a business have zero negative reviews ever",timestamp:"2025-10-14T20:30:00"},{id:"c10-b-basket",query:"can a retreat legally hold your phone",timestamp:"2025-10-21T12:00:00"},{id:"c10-b-tomlin",query:"walter tomlin albuquerque daughter wedding november 8",timestamp:"2025-11-01T23:44:00",evidenceLabel:"From the ridge: she searched for Tomlin's daughter's wedding — it was real, and he never arrived"},{id:"c10-b-lawsuit",query:"stillpoint ridge lawsuit missing guest 2022",timestamp:"2025-11-01T23:46:00",evidenceLabel:"“stillpoint ridge lawsuit missing guest 2022” — settled, sealed"},{id:"c10-b-waiver",query:"waiver relocated on property restoration is this legal imprisonment",timestamp:"2025-11-01T23:50:00"},{id:"c10-b-ranger",query:"nearest ranger station to stillpoint ridge",timestamp:"2025-11-02T00:18:00",evidenceLabel:"Her last search, 12:18 AM Nov 2: the nearest ranger station"}],hiddenApp:{disguiseIcon:"weather",disguiseLabel:"Stillpoint",revealAfterClueIds:["c10-th-aspen","c10-n-hike"],title:"Stillpoint — Steward View",heading:"Steward console · guest ledger",body:`The retreat's guest app: rhythm schedules, gratitude prompts, weather on the ridge. Staff devices unlock a second view. Her phone received the staff view on Nov 2 — pushed to it, deliberately or carelessly, the morning they 'walked her out.'

It was still syncing when the meadow took the last word.`,entries:[{label:"HADDAD, F. — Cedar",status:"WALKED OUT 11/02",detail:"record trimmed · billing: extended integration"},{label:"TOMLIN, W. — Willow",status:"QUIET — BED 2",detail:"day 4 · family inquiries: deflect, warmly"},{label:"OKAFOR, R. — QUIET BED 1",status:"DAY 41",detail:"billing active · next of kin: none listed"},{label:"YUEN, H. — QUIET BED 4",status:"DAY 388",detail:"billing active · 'doing beautifully'"},{label:"SOL, M. — QUIET BED 5",status:"DAY 1,101",detail:"billing active · account nearly empty · review"},{label:"BED 6",status:"PREPARED",detail:"assignment pending"},{label:"NORTH FENCE",status:"DO NOT WALK",detail:"steward note: we keep our side. it keeps its side."}],footer:"The ledger's last line is the retreat's only honest sentence: 'we keep our side. it keeps its side.' The Quiet Cabins were a business. The meadow was never in the business plan. On Nov 11, bed 6 was still empty, the five guests were on the lodge porch waiting for their families, and every stone in the sixth row had grass growing at its head — except one kept clear, like a made bed.",evidenceLabel:"The Steward console: the Quiet Cabins ledger, “record trimmed” — and the north fence rule"},liveEvents:[{id:"c10-live-stillpoint",kind:"notification",afterSeconds:330,title:"Stillpoint",body:"Today's gratitude prompt: what would you give to feel this rested forever?",glitch:!0},{id:"c10-live-unknown",kind:"message",afterSeconds:620,threadId:"c10-th-unknown",message:{id:"c10-m-un-live",from:"them",text:"you've been reading a long time without resting. the meadow notices readers. it likes the thorough ones.",timestamp:"2025-11-12T21:41:00",evidenceLabel:"To whoever is reading: “the meadow notices readers. it likes the thorough ones.”"}}],verdicts:[{id:"c10-v-walked",label:"She walked into the backcountry on her own",description:"Eleven years of burnout, a leave she called a question, and mountains that answer questions like that. Exposure, not malice.",requiredEvidenceIds:["c10-m-la-2","c10-n-gratitude","c10-b-burnout"],isCanon:!1,epilogue:`The kindest-looking verdict and the laziest: a exhausted woman, a beautiful wilderness, a one-way walk. Search and rescue grids the drainage for nine days and finds no gear, no track, no Farrah.

What they do find — because you sent them north when the retreat kept steering them south — is the Quiet Cabins, and five people who needed her theory to be wrong. It was wrong. Her memos alone dismantle it: nobody documenting a custodial-care scandal in chart format, with exhibits, plans a one-way walk. Nurses don't abandon a census with names on it. Your report says so, formally, and reclassifies the case within the month.

The gratitude journal's blank day 6 gets quoted at the licensing hearing anyway, by Stillpoint's counsel, as evidence of 'a guest in crisis.' Layla stands up in the gallery and reads day 5 aloud — 'tomlin wasn't at breakfast' — and asks the room which sister sounds like the one in crisis. The room recesses early.`},{id:"c10-v-retreat",label:"Stillpoint erased her like the others",description:"An unlicensed custodial ward billed as 'integration,' a fabricated departure, four prior 'early departures on foot' — and a nurse with a census in her pocket.",requiredEvidenceIds:["case-10.hidden","c10-n-locked","c10-ph-clipboard","c10-m-sp-4","c10-m-bk-2"],isCanon:!0,epilogue:`Your report follows her chart format, because her chart was better evidence than anything the county gathered: FINDING, exhibit, FINDING, exhibit. The Quiet Cabins. The medication lanyard. Waiver §9. The $870 'extended integration' billed to a woman they claimed had already left — the invoice is the confession; bureaucracies always bill their crimes.

Stillpoint loses its license, then its LLC, then its name — it reopens two states away as 'Fernhollow' within a year, same tree-named guides, and your report's appendix predicting exactly that is the only part the wire services quote. Aspen — legal name attached at last — takes a plea for unlawful imprisonment and billing fraud, and answers every question except the ones about the north fence, which she declines 'respectfully, and permanently.'

Tomlin walks his daughter through her wedding reception in a wheelchair, eight months late, at a do-over party the whole ICU where Farrah worked chips in for. The other four go home, or to real care, with real doors that lock from the inside.

Farrah is not found. The county lists her as missing. The five from the cabins insist otherwise — 'the nurse came first' — and your report records their statements without adopting them, which is the closest a government document comes to hope.

At the ICU, Bex tapes a note inside the med room cabinet where the sticky notes go: 'F.H. — eleven years — she still wanted to be a nurse.' It's laminated now. Night shift touches it like a door frame.`},{id:"c10-v-aspen",label:"Aspen handled it personally",description:"The guide who texted during sacred silence, knew where she stood on a dark ridge, and led the 'walk out' — north.",requiredEvidenceIds:["c10-m-as-1","c10-m-as-3","c10-vm-memo1"],isCanon:!1,epilogue:`The lone-wolf version: Aspen as a predator using the retreat's machinery for something personal. The texts support it — 'bring it to me first, only to me' is grooming grammar — and memo one puts Aspen at the head of the walk north.

It half-survives contact with the evidence. Aspen led the walk; Aspen also, per two junior guides' statements, stopped at the fence. Would not cross. Ordered the juniors back when Farrah broke loose PAST the fence line, into the meadow — and the juniors describe Aspen's face at that moment with a word neither of them was prompted to use. Both said 'bereaved.'

'She went north,' Aspen tells you in the only unguarded minute of six interviews. 'We don't lose the ones who go north. We lose claim to them.' Then the lawyer's hand on the shoulder, and the window closes. The plea covers the cabins. The meadow is never charged, because you cannot charge a meadow, and everyone in the room was careful never to say that sentence out loud.`},{id:"c10-v-meadow",label:"The meadow received her",description:"Stones older than the retreat, a second voice on the final memo, five locked doors opened by no one — “the nurse came first.”",requiredEvidenceIds:["c10-vm-memo3","c10-ph-stones","c10-pin-meadow"],isCanon:!1,epilogue:`You write the version the physical file whispers: something older than Stillpoint holds the land north of the fence, has held it since before the county had a name for the quad, and it does not take. It receives. The stones say REST because that is the whole offer. A century of rows, and the lichen agrees with none of your timelines.

The second voice on memo three is analyzed four times. Two labs say wind. One says a woman. One returns the file with the analysis fee and no comment, which is its own finding.

What you cannot fold into any mundane account: the padlocks stacked neatly. Five guests who walked out of locked rooms and all reached for the same four words. The phone-shaped rectangle of flattened grass at the head of a fresh stone — a stone that, when the county finally photographs it properly, is carved not with REST like the others.

It says, in small, patient letters: OFF SHIFT.

The report is held pending reclassification. You sign it anyway, in the margin, where signatures don't count. Some charts deserve a witness even when the hospital won't file them.`}]},Jt=Object.freeze(Object.defineProperty({__proto__:null,default:Kt},Symbol.toStringTag,{value:"Module"})),Qt={id:"case-11",title:"The Reunion Thread",victimName:"Marcus Bell, 33",summary:"Five friends, one group chat, a 20-year reunion at the quarry where the sixth friend drowned. The chat hums along — jokes, logistics, old nicknames. But Kat replies to messages four minutes before they're sent. Duke is 'free Friday' from a phone that's been in an evidence locker since September. One by one, the friends stopped being the ones typing.",intake:`SUBJECT: Bell, Marcus J. (33). Reported missing by his wife Dec 14, after attending a 'reunion' at Blackwater Quarry the evening of Dec 13.

DEVICE: Recovered Dec 13, 20:31, from the hood of his car in the quarry lot, placed neatly, screen up. Battery 49%.

CROSS-REFERENCE: Of the four other participants in the reunion group chat — I. Munoz, D. Vance-Odom, K. Reyes, L. Pruett — NONE could be located at their residences. Munoz was reported missing in ANOTHER jurisdiction in August. Vance-Odom's phone has been in a property locker since a September traffic incident; his chat messages continued regardless. Reyes and Pruett are now missing-person cases as of this week, opened retroactively — both had 'gone quiet' per families, who assumed depression, travel, new jobs. The group chat assumed nothing. The group chat kept them all cheerful.

HISTORY: Dec 13, 2005 — Robert 'Foss' Fossey (12) went through quarry ice while the five subjects, then children, were present. Body never recovered. Case closed as misadventure on the strength of the five children's identical statements.

Second-pass review requested. The chat is still active.`,contentWarningLevel:3,phone:{ownerLabel:"M. BELL — if found call Elena",recoveredAt:"2025-12-15T21:00:00",batteryStart:49,wallpaperHue:205,lockScreenNotifications:[{appId:"messages",title:"Elena ❤",preview:"it's 8. you said 7:30. the quarry?? in DECEMBER?? call me",targetId:"c11-th-elena"},{appId:"messages",title:"CREEK FIVE 🌲",preview:"Kat: so glad we're all finally back together tonight!!",targetId:"c11-th-group"},{appId:"phone",title:"Voicemail",preview:"Pruett home (landline) · 0:44",targetId:"c11-vm-foss"}]},messages:[{id:"c11-th-group",contactName:"CREEK FIVE 🌲",messages:[{id:"c11-m-gr-1",from:"them",text:"Iris: TWENTY YEARS next december, creeps. we should do something. all five of us, one place, no excuses",timestamp:"2025-07-08T20:00:00"},{id:"c11-m-gr-2",from:"owner",text:"in. but not the quarry. anywhere but the quarry",timestamp:"2025-07-08T20:15:00",evidenceLabel:"Marcus, in July: “anywhere but the quarry”"},{id:"c11-m-gr-3",from:"them",text:"Iris: obviously not the quarry, ghoul. lonnie's lake house? kat's in?",timestamp:"2025-07-08T20:18:00"},{id:"c11-m-gr-4",from:"them",text:"Kat: in!! ✨",timestamp:"2025-07-08T20:20:00"},{id:"c11-m-gr-5",from:"them",text:"Duke: if there's beer I'm wherever you point me",timestamp:"2025-07-08T20:24:00"},{id:"c11-m-gr-6",from:"them",text:"Iris: actually. hear me out. maybe it SHOULD be the quarry. twenty years. we never once went back. maybe that's the whole problem with all five of us",timestamp:"2025-08-19T02:11:00",evidenceLabel:"Aug 19, 2:11 AM: “Iris” reverses herself — it should be the quarry. Iris was reported missing Aug 16."},{id:"c11-m-gr-7",from:"owner",text:"iris are you okay? that's a 2am take and not a you take",timestamp:"2025-08-19T08:30:00"},{id:"c11-m-gr-8",from:"them",text:"Iris: never better. cleanest my head's been in 20 years. trust me marcus. the quarry.",timestamp:"2025-08-19T08:31:00",evidenceLabel:"“cleanest my head's been in 20 years” — replied in 60 seconds, at work hours, unlike Iris"},{id:"c11-m-gr-9",from:"them",text:"Duke: fine by me. free friday to scout it btw",timestamp:"2025-09-30T14:00:00",evidenceLabel:"“Duke” is free Friday — from a phone in a property locker since Sept 22"},{id:"c11-m-gr-10",from:"them",text:"Kat: can't friday, at my sister's til the 9th! but YES to dec 13. symmetry ✨",timestamp:"2025-10-02T03:33:00",evidenceLabel:"“Kat” cites daytime plans in a 3:33 AM message. Her sister says Kat never visited."},{id:"c11-m-gr-11",from:"owner",text:"dec 13?? guys. that's the DAY. that's the actual day. why would we do it on the day",timestamp:"2025-10-02T08:45:00"},{id:"c11-m-gr-12",from:"them",text:"Lonnie: because we owe the day, marcus.",timestamp:"2025-10-02T08:44:00",evidenceLabel:"Lonnie's reply is timestamped one minute BEFORE the message it answers"},{id:"c11-m-gr-13",from:"them",text:"Kat: it's decided!! dec 13, 7pm, blackwater. dress warm. the ice should be thick enough by then 🧊",timestamp:"2025-11-20T19:00:00",evidenceLabel:"“the ice should be thick enough by then 🧊”"},{id:"c11-m-gr-14",from:"them",text:"Kat: so glad we're all finally back together tonight!!",timestamp:"2025-12-13T18:55:00"}]},{id:"c11-th-iris",contactName:"Iris 🌵",contactNumber:"(802) 555-0173",messages:[{id:"c11-m-ir-1",from:"them",text:"marcus. real talk, off the group. I've been having the dream again. the counting one. do you get the counting one",timestamp:"2025-08-10T23:30:00",evidenceLabel:"Iris, five days before she vanished: “the counting dream”"},{id:"c11-m-ir-2",from:"owner",text:"…every december. we should talk. actually talk, phone talk",timestamp:"2025-08-10T23:45:00"},{id:"c11-m-ir-3",from:"them",text:"friday. I'll call friday. there's something I want to tell the group and I want to practice it on you first because you were the only one who wanted to go back for him",timestamp:"2025-08-10T23:52:00",evidenceLabel:"“you were the only one who wanted to go back for him” — Iris never called"},{id:"c11-m-ir-4",from:"owner",text:"iris it's saturday. you didn't call",timestamp:"2025-08-16T10:00:00"},{id:"c11-m-ir-5",from:"owner",text:"your work says you didn't show. the group says you're 'never better.' those are different people, iris",timestamp:"2025-08-21T22:15:00"}]},{id:"c11-th-duke",contactName:"Duke",contactNumber:"(802) 555-0148",messages:[{id:"c11-m-du-1",from:"them",text:"bell!! fantasy draft sunday, don't be a coward",timestamp:"2025-09-14T12:00:00"},{id:"c11-m-du-2",from:"owner",text:"duke did you hear anything from iris. like actually HER, voice, not the chat",timestamp:"2025-09-20T17:30:00"},{id:"c11-m-du-3",from:"them",text:"chat iris says she's great. but no. no voice. now that you say it. huh. gonna drive by her place tuesday",timestamp:"2025-09-20T17:45:00",evidenceLabel:"Duke planned to check Iris's place “tuesday” — his accident was Monday night"},{id:"c11-m-du-4",from:"owner",text:"duke?",timestamp:"2025-09-24T20:00:00"},{id:"c11-m-du-5",from:"owner",text:"your sister says your truck got found on route 9 and you're 'taking time.' the chat says you're free friday. DUKE.",timestamp:"2025-10-01T21:00:00"}]},{id:"c11-th-kat",contactName:"Kat ✨",contactNumber:"(802) 555-0155",ghostTypingAfterSeconds:380,messages:[{id:"c11-m-ka-1",from:"them",text:"marcus bell. my mother saw YOUR mother at the pharmacy and now I'm contractually obligated to say hi. hi",timestamp:"2025-06-02T15:00:00"},{id:"c11-m-ka-2",from:"owner",text:"kat. real question, just us: in the chat lately do the others seem… off to you? iris flipped on the quarry. duke's gone quiet-but-chatty. it's like talking to greeting cards of them",timestamp:"2025-10-05T21:30:00",evidenceLabel:"Marcus to Kat: “it's like talking to greeting cards of them”"},{id:"c11-m-ka-3",from:"them",text:"u worry too much. everyone's fine. see u on the 13th ✨",timestamp:"2025-10-05T21:31:00",evidenceLabel:"Kat never once wrote “u” in nineteen years of texts. The reply took 60 seconds."},{id:"c11-m-ka-4",from:"owner",text:"kat you have never typed 'u' in your life. you correct MY grammar. call me. right now. say the thing you said at graduation, the dumb thing, prove it's you",timestamp:"2025-10-05T21:40:00"}]},{id:"c11-th-lonnie",contactName:"Lonnie",contactNumber:"(802) 555-0129",messages:[{id:"c11-m-lo-1",from:"them",text:"bell. call me tonight. not chat. PHONE. it's about kat's messages. I did the thing you said — I asked her to prove it's her",timestamp:"2025-11-30T16:20:00",evidenceLabel:"Lonnie, Nov 30: “I asked her to prove it's her” — his last genuine message"},{id:"c11-m-lo-2",from:"owner",text:"and??",timestamp:"2025-11-30T16:25:00"},{id:"c11-m-lo-3",from:"them",text:"she proved it. that's the problem. she knew the graduation thing. she knew the CREEK thing, marcus. the thing only six people ever knew. count who's left who could know it",timestamp:"2025-11-30T16:31:00",evidenceLabel:"“she knew the thing only six people ever knew. count who's left.”"},{id:"c11-m-lo-4",from:"owner",text:"five. five people are left who could know it. lonnie. FIVE.",timestamp:"2025-11-30T16:33:00"},{id:"c11-m-lo-5",from:"them",text:"yeah. unless we counted wrong in 2005. calling you at 8",timestamp:"2025-11-30T16:34:00",evidenceLabel:"“unless we counted wrong in 2005.” The 8 o'clock call never came."},{id:"c11-m-lo-6",from:"them",text:"sorry about last night, got busy! nothing to worry about. see you on the 13th, brother. we owe the day",timestamp:"2025-12-01T09:00:00",evidenceLabel:"The next morning “Lonnie” is cheerful — and repeats the chat's phrase: “we owe the day”"}]},{id:"c11-th-elena",contactName:"Elena ❤",contactNumber:"(802) 555-0186",messages:[{id:"c11-m-el-1",from:"them",text:"you talked in your sleep again. numbers. you were counting",timestamp:"2025-12-04T07:30:00"},{id:"c11-m-el-2",from:"owner",text:"december stuff. it passes after the 13th every year. I'm sorry love",timestamp:"2025-12-04T08:00:00"},{id:"c11-m-el-3",from:"them",text:"this year you counted to six, marcus. every other year it's five. I've never told you that I count too. I think you should skip the reunion",timestamp:"2025-12-04T08:05:00",evidenceLabel:"Elena: every year he counts to five in his sleep. This year, six."},{id:"c11-m-el-4",from:"owner",text:"I can't skip it. if I'm wrong, it's a sad party. if I'm right, someone has our friends and is gathering the rest, and the only place all of this ends is the quarry on the 13th. either way I have to stand on that shore. I left something for you in the notes app. code is the date we never say out loud",timestamp:"2025-12-12T23:40:00",evidenceLabel:"His last night: “someone has our friends and is gathering the rest… I have to stand on that shore”"},{id:"c11-m-el-5",from:"them",text:"it's 8. you said 7:30. the quarry?? in DECEMBER?? call me",timestamp:"2025-12-13T20:00:00"}]},{id:"c11-th-parks",contactName:"Blackwater Parks Dept",messages:[{id:"c11-m-pk-1",from:"owner",text:"Hi — checking if a small evening gathering at Blackwater Quarry on Dec 13 needs a permit? ~5 people, parking lot area only.",timestamp:"2025-12-02T10:00:00"},{id:"c11-m-pk-2",from:"them",text:"No permit needed for under 10, but heads up: the quarry gate is chained at dusk in winter. Has been for years. Whoever told you 7pm — the lot's not accessible at 7pm.",timestamp:"2025-12-02T10:30:00",evidenceLabel:"Parks Dept: the quarry gate is chained at dusk. A 7 PM reunion was never possible — for anyone driving."},{id:"c11-m-pk-3",from:"owner",text:"Then who unchains it?",timestamp:"2025-12-02T10:32:00"},{id:"c11-m-pk-4",from:"them",text:"Nobody, sir. That's rather the point of a chain.",timestamp:"2025-12-02T10:33:00"}]},{id:"c11-th-work",contactName:"Renee (work)",contactNumber:"(802) 555-0117",messages:[{id:"c11-m-wo-1",from:"them",text:"you left early again. everything good?",timestamp:"2025-12-10T16:00:00"},{id:"c11-m-wo-2",from:"owner",text:"family stuff. old family. I'll make up the hours after the 13th",timestamp:"2025-12-10T16:20:00"}]},{id:"c11-th-unknown",contactName:"Unknown",messages:[{id:"c11-m-un-1",from:"them",text:"you counted wrong in 2005. count again.",timestamp:"2025-12-06T03:13:00",evidenceLabel:"Dec 6, 3:13 AM, unknown number: “you counted wrong in 2005. count again.”"},{id:"c11-m-un-2",from:"owner",text:"foss?",timestamp:"2025-12-06T03:20:00",evidenceLabel:"Marcus's reply, one word: “foss?”"},{id:"c11-m-un-3",from:"them",text:"olly olly oxen free.",timestamp:"2025-12-06T03:21:00",evidenceLabel:"The answer: “olly olly oxen free.”"}]},{id:"c11-th-spam",contactName:"Blackwater Bulletin",messages:[{id:"c11-m-sp-1",from:"them",text:"BLACKWATER BULLETIN: This week in history — 20 years since the Fossey tragedy. Candlelight walk Sat. All welcome.",timestamp:"2025-12-08T09:00:00"},{id:"c11-m-sp-2",from:"them",text:"BLACKWATER BULLETIN: Ice safety reminder! No body of water in the county is certified safe for foot traffic. None. We mean the quarry. Stay off the quarry.",timestamp:"2025-12-11T09:00:00"}]}],photos:[{id:"c11-ph-2005",caption:"found the photo cleaning out mom's attic. summer 2005. six of us. six.",timestamp:"2025-07-20T14:00:00",aspect:"landscape",meta:{takenAt:"2025-07-20T14:00:00",device:"This phone (photo of a print)"},svg:s('<rect width="400" height="300" fill="#26221c"/><rect x="40" y="40" width="320" height="220" fill="#c9bfa4" opacity="0.9"/><rect x="55" y="55" width="290" height="170" fill="#7a8a6b" opacity="0.7"/><rect x="55" y="160" width="290" height="65" fill="#5c7a8a" opacity="0.6"/>'+Array.from({length:6},(t,e)=>g(85+e*48,205,.55,.9,e===5?"#2c3a44":"#3d3a30")).join("")+'<text x="200" y="250" text-anchor="middle" font-family="serif" font-size="9" fill="#55503f">creek five (+foss) — aug 05</text>',{aspect:"landscape",base:"#1a1712",grain:.12}),evidenceLabel:"The 2005 print: six kids at the creek — “creek five (+foss)”"},{id:"c11-ph-quarry-now",caption:"drove past blackwater for the first time in 20 years. it's smaller than the version in my head. the version in my head is the size of everything",timestamp:"2025-10-12T16:30:00",aspect:"landscape",meta:{takenAt:"2025-10-12T16:30:00",device:"This phone",location:"Blackwater Quarry overlook"},svg:s('<rect width="400" height="130" fill="#1a2026"/><rect y="130" width="400" height="170" fill="#10161a"/><ellipse cx="200" cy="215" rx="170" ry="60" fill="#0c1216"/><path d="M0 130 L70 90 L150 125 L250 85 L340 120 L400 95 V0 H0Z" fill="#0d1013"/><ellipse cx="200" cy="215" rx="120" ry="40" fill="#0e151a"/>',{aspect:"landscape",base:"#0c1014",grain:.13})},{id:"c11-ph-bar",caption:"'everyone's coming' they said. reunion pregame at duffy's. attendance: me and lonnie. the chat says iris duke and kat 'had a blast.' they were not here. NOBODY was here",timestamp:"2025-10-25T21:40:00",aspect:"landscape",meta:{takenAt:"2025-10-25T21:40:00",device:"This phone",location:"Duffy's Tavern"},svg:s('<rect width="400" height="300" fill="#181310"/><rect x="30" y="150" width="340" height="16" fill="#2c2014"/><rect x="40" y="166" width="320" height="90" fill="#12100c"/>'+g(120,145,.95,.9,"#3a3228")+g(210,148,.95,.9,"#33302a")+Array.from({length:3},(t,e)=>`<rect x="${260+e*34}" y="120" width="22" height="30" rx="4" fill="#0e0c09"/>`).join("")+'<circle cx="90" cy="70" r="16" fill="#4a3a20" opacity="0.4"/><circle cx="200" cy="60" r="14" fill="#4a3a20" opacity="0.35"/>',{aspect:"landscape",base:"#100d0a",grain:.13}),evidenceLabel:"The pregame photo: two people. The chat remembered five."},{id:"c11-ph-metadata",caption:"",timestamp:"2025-12-05T22:15:00",aspect:"portrait",deleted:!0,meta:{takenAt:"2025-12-05T22:15:00",device:"This phone (screenshot)"},svg:s('<rect width="300" height="400" fill="#0d1014"/><rect x="25" y="50" width="250" height="300" rx="8" fill="#12161c"/><text x="150" y="82" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a94b8">MESSAGE DETAILS — KAT ✨</text><text x="40" y="115" font-family="monospace" font-size="9" fill="#9aa3af">sent: 03:33:00</text><text x="40" y="135" font-f eone's been out on the ice. auger holes. a straight line of them. pointing at where the old dock was",timestamp:"2025-12-06T14:50:00",aspect:"landscape",meta:{takenAt:"2025-12-06T14:50:00",device:"This phone",location:"Blackwater Quarry"},svg:s('<rect width="400" height="300" fill="#1a2026"/><rect y="110" width="400" height="190" fill="#c9d2d8" opacity="0.25"/><ellipse cx="200" cy="205" rx="180" ry="70" fill="#d8e0e4" opacity="0.3"/>'+Array.from({length:6},(t,e)=>`<circle cx="${80+e*45}" cy="${240-e*14}" r="7" fill="#0c1216"/>`).join("")+'<rect x="330" y="140" width="50" height="10" fill="#26221c" opacity="0.7"/>',{aspect:"landscape",base:"#141a1e",grain:.12}),evidenceLabel:"Six auger holes in a straight line across the ice, aimed at the old dock"},{id:"c11-ph-flyer",caption:"'kat' sent a flyer for the reunion. it's nice. it's really nice. kat failed art. kat brags about failing art",timestamp:"2025-11-22T10:00:00",aspect:"portrait",meta:{takenAt:"2025-11-22T10:00:00",device:"This phone (saved image)"},svg:s('<rect width="300" height="400" fill="#101216"/><rect x="40" y="50" width="220" height="300" rx="6" fill="#1a2530"/><text x="150" y="110" text-anchor="middle" font-family="serif" font-size="16" fill="#c9d2da">TWENTY YEARS</text><text x="150" y="135" text-anchor="middle" font-family="serif" font-size="10" fill="#7a94a8">the creek five, together again</text><ellipse cx="150" cy="220" rx="80" ry="34" fill="#0e151a"/>'+Array.from({length:6},(t,e)=>`<circle cx="${95+e*22}" cy="290" r="4" fill="#3f5462"/>`).join("")+'<text x="150" y="330" text-anchor="middle" font-family="serif" font-size="9" fill="#7a94a8">dec 13 · 7pm · blackwater</text>',{aspect:"portrait",base:"#0c0e12",grain:.1}),evidenceLabel:"The reunion flyer “Kat” made: six dots along the bottom, not five"},{id:"c11-ph-ice-night",caption:"",timestamp:"2025-12-13T19:31:00",aspect:"landscape",meta:{takenAt:"2025-12-13T19:31:00",device:"This phone",location:"Blackwater Quarry"},svg:s('<rect width="400" height="300" fill="#05070a"/>'+C(200,190,110,"#0e141a",.4),{aspect:"landscape",base:"#04060a",grain:.2}),flashlight:{hiddenSvg:s('<rect width="400" height="300" fill="#080b0f"/><ellipse cx="200" cy="210" rx="180" ry="65" fill="#b8c4cc" opacity="0.14"/>'+Ct(200,196,24,"c11-pool")+pe(200,186,58,"c11-spat")+g(200,175,1,.9,"#030507")+'<ellipse cx="200" cy="188" rx="26" ry="5" fill="#000" opacity="0.6"/><text x="200" y="262" text-anchor="middle" font-family="monospace" font-size="9" fill="#44505c">standing on the ice. dead center. waiting. it waved us out like a crossing guard</text>'+E("19:31:44",400,300),{aspect:"landscape",base:"#070a0d",grain:.13})},evidenceLabel:"His last photo: a figure standing dead-center on the ice, waving them out"},{id:"c11-ph-elena",caption:"anniversary dinner. she planned it for the 12th 'so december has one good day in it before your sad week.' I don't deserve her and I'm keeping her anyway",timestamp:"2025-12-12T20:30:00",aspect:"portrait",meta:{takenAt:"2025-12-12T20:30:00",device:"This phone"},svg:s('<rect width="300" height="400" fill="#1a1512"/><rect x="50" y="220" width="200" height="16" fill="#2c2014"/><circle cx="110" cy="200" r="8" fill="#c96f2b" opacity="0.5"/><circle cx="190" cy="200" r="8" fill="#c96f2b" opacity="0.5"/><ellipse cx="150" cy="240" rx="40" ry="10" fill="#d8d2c2" opacity="0.4"/><circle cx="150" cy="120" r="40" fill="#2c2420" opacity="0.9"/>',{aspect:"portrait",base:"#130f0c",grain:.11})}],notes:[{id:"c11-n-tally",title:"who's actually left (keep updated)",timestamp:"2025-12-05T23:00:00",evidenceLabel:"His tally: last REAL contact with each friend, in order",body:`not who the chat says. who I have VERIFIED. voice, face, or something only they'd know, checked recently:

IRIS — last real contact aug 10 (the counting dream text). chat-iris continues. real iris: missing since aug 16 per her mom. THE CHAT FLIPPED HER VOTE THREE DAYS LATER.

DUKE — last real contact sept 20 (said he'd check iris's place tuesday). truck found on route 9 monday night. 'taking time.' chat-duke is 'free friday.' duke's phone has been AT THE POLICE STATION since september. I called and asked. they confirmed it's in a locker. the messages keep coming.

KAT — last real contact… june?? the pharmacy hi. everything since is 'u' and sparkles and 60-second replies at 3am. her sister says she never visited. kat is gone and I don't even know WHEN. that's the worst one. she's been a greeting card for months and we all just kept texting the card.

LONNIE — verified nov 30, 4:31pm (the call setup). then nothing. then next-morning cheerful. lonnie is gone as of nov 30, evening. I was an hour from a phone call that explained everything and now I'm the last one.

ME — still me. as far as I know. elena: if I start typing 'u,' run.

order: iris, duke, kat(?), lonnie. staggered. patient. whoever this is, they take one, then run the account warm so nobody looks. the chat isn't a chat. it's a TROPHY CASE with typing indicators.

full statement locked. code is the date we never say out loud.`},{id:"c11-n-locked",title:"for elena — and for whoever counts us",timestamp:"2025-12-12T23:55:00",lock:{code:"1213",hintText:"“the date we never say out loud.” — the newspaper says it. The reunion says it. He never would.",clueSourceIds:["c11-ph-clipping","c11-th-group"]},evidenceLabel:"The locked note: what actually happened on December 13, 2005",body:`elena. if you're reading this with the code, either I told you the date at last, or the worst happened and you figured it out, because you figure everything out.

here is the true version. the only other people who knew are gone or waiting at a quarry.

dec 13, 2005. six of us on the ice, not five. the papers say foss went out alone on a dare. there was no dare. there was a GAME — the counting game, our stupid hide-and-seek on the ice, eyes closed, count to a hundred while everyone scatters to the auger holes the ice fishermen left. foss was counting. WE hid. and when the ice went, it went where the COUNTER stands, dead center, and we heard it, and we were twelve, and we ran. all five of us. we ran and we agreed on the story in duke's garage with wet socks and we said 4:40 because lonnie's dad got home at 5 and we needed the math to work.

he was counting FOR US when the ice took him. and we made it a dare and made him reckless and made ourselves bystanders, and we were none of those things. we were hiding. he never got to olly-olly-oxen-free. that's the sentence I've been not-saying for twenty years: nobody ever called him home.

the checkin pact is in the calculator app — the whole 'story,' the annual roll call. we kept the lie in better repair than we kept each other.

if the person doing this is who I think it is — if he came out of that water twenty years ago and someone or something kept him, or he kept himself, and he's spent two decades learning our voices — then he doesn't want money and he doesn't want apologies. he wants the count finished. five hiders, found.

I'm going to the quarry. not because the chat told me to. because I'm going to stand where he stood and I'm going to say it — olly olly oxen free — loud, at the dead center, twenty years late. maybe that ends it. maybe nothing ends it. but he counted for us, elena. someone finally has to call him home.

I love you. I counted right this time. — M`},{id:"c11-n-reunion",title:"reunion logistics",timestamp:"2025-11-25T12:00:00",body:`dec 13, 7pm, blackwater lot
bring: thermoses (cocoa + the adult kind), camp chairs, bluetooth speaker, the 2005 photo
lonnie: firewood. duke: beer. kat: the flyer thing. iris: herself (her words)

(marcus: bring the words. you know the ones. twenty years of them.)`},{id:"c11-n-eulogy",title:"things I'd say (never sent, never said)",timestamp:"2025-12-08T02:00:00",evidenceLabel:"His unsent eulogy for Foss: “you were only ever where we told you to stand”",body:`foss —

you'd be 32. you'd be the best of us, which isn't a compliment because look at us, but you'd be the best of anybody.

you always counted slow to give us extra time. we knew. we never said thanks for that either.

I'm sorry we made you the careless one in the story. you were the carefullest kid on that ice. you were only ever where we told you to stand.`}],voicemails:[{id:"c11-vm-elena",callerLabel:"Elena ❤",callerNumber:"(802) 555-0186",timestamp:"2025-12-13T20:20:00",durationSec:26,tone:"plain",transcript:`[automated transcript — audio partially recovered]

025-12-13T19:40:00",x:80,y:58,detail:"The phone's final moving fix: dead center of the quarry, 7:40 PM, stationary for four minutes — the length of a slow count to one hundred. Then one fix back at the lot, 8:31 PM, where the phone was found on the car hood. The ice, surveyed the next morning, was unbroken. No footprints led out. Six auger holes, and none of them large enough for a person.",evidenceLabel:"Final fixes: four minutes at dead center — then the phone back on the car hood, over unbroken ice"}],browserHistory:[{id:"c11-b-foss",query:"robbie fossey blackwater quarry 2005 body never found",timestamp:"2025-08-22T00:30:00",evidenceLabel:"August: “robbie fossey… body never found”"},{id:"c11-b-survive",query:"can a child survive falling through ice undiscovered",timestamp:"2025-08-22T00:45:00"},{id:"c11-b-iris",query:"iris munoz missing burlington august",timestamp:"2025-09-25T21:00:00"},{id:"c11-b-duke",query:"route 9 single vehicle accident september 22 driver missing",timestamp:"2025-10-01T22:30:00",evidenceLabel:"He found Duke's accident report: single vehicle, driver never located"},{id:"c11-b-scheduler",query:"how to tell if texts are coming from a message scheduler",timestamp:"2025-12-05T21:40:00",evidenceLabel:"Dec 5: “how to tell if texts are coming from a message scheduler”"},{id:"c11-b-voice",query:"software that imitates someone's texting style from history",timestamp:"2025-12-05T22:00:00"},{id:"c11-b-gate",query:"what time does blackwater quarry gate close december",timestamp:"2025-12-13T17:50:00",evidenceLabel:"His last search, 5:50 PM on the 13th: when the gate closes"}],hiddenApp:{disguiseIcon:"calculator",disguiseLabel:"TackleBox",revealAfterClueIds:["c11-th-group","c11-n-tally"],title:"THE STORY — v. final",heading:"Keep it identical. Keep it forever.",body:`A vault disguised as a fishing calculator, installed the week after the funeral-with-no-casket, maintained for twenty years. Five children's insurance policy. It contains the agreed account of December 13, 2005 — and the roll call proving they kept it.

They rehearsed a lie annually with more discipline than most people rehearse anything true.`,entries:[{label:"THE ACCOUNT (memorize)",status:"UNCHANGED SINCE '05",detail:"4:40 · dare · he went alone · we were on shore"},{label:"Check-in 2006–2015",status:"5 / 5",detail:"all present · story holds"},{label:"Check-in 2016–2023",status:"5 / 5",detail:"all present · kat by phone twice"},{label:"Check-in 2024",status:"5 / 5",detail:"duke late · story holds"},{label:"Check-in 2025",status:"1 / 5",detail:"iris —. duke —. kat —. lonnie —. marcus: present."},{label:"AMENDMENT (unauthorized)",status:"ADDED 12/13 19:44",detail:"author unknown · text: 'six were present.'"},{label:"AMENDMENT (unauthorized)",status:"ADDED 12/13 20:31",detail:"author unknown · text: 'story concluded. all found.'"}],footer:"The vault required all five thumbprints to amend — a child's idea of security that held for two decades. The final two amendments were authored with no thumbprint at all, the second at the exact minute the phone was set down on the car hood. The account itself was never edited. Whoever concluded the story didn't need to correct it. Everyone who believed it was done believing it.",evidenceLabel:"The TackleBox vault: the pact of 2005, twenty years of roll calls — and two amendments no living hand signed"},liveEvents:[{id:"c11-live-group",kind:"message",afterSeconds:340,threadId:"c11-th-group",message:{id:"c11-m-gr-live",from:"them",text:"Kat: what a perfect night ✨ same time next year, everyone. and to whoever's reading along — you're welcome to come. we're so easy to find. we're all in one place now",timestamp:"2025-12-15T21:07:00",evidenceLabel:"The chat, still warm, to whoever reads it: “we're all in one place now”"}},{id:"c11-live-cal",kind:"notification",afterSeconds:620,title:"Calendar",body:"New event: REUNION — blackwater. Dec 13, next year. Repeats yearly.",glitch:!0}],verdicts:[{id:"c11-v-ice",label:"The ice took him, like it took Foss",description:"A grieving man, an anniversary, a frozen quarry at night. History doesn't need help repeating.",requiredEvidenceIds:["c11-pin-ice","c11-ph-augerholes","c11-n-eulogy"],isCanon:!1,epilogue:`The drowning verdict writes itself, which should have been your first warning. Divers go down in January when the ice clears. The quarry is deep and old and full of 2005's unanswered question, and now, presumably, 2025's.

They find nothing. Not Marcus. Not — and the dive supervisor's report states this with visible discomfort — not Foss, either, though sonar maps the entire floor at a resolution that has found car keys. Twenty years of everyone assuming the quarry kept him, and the quarry is empty. It was always empty. Whatever went through the ice in 2005 did not stay under it.

The unbroken ice stays in the file as 'refrozen.' The tire tracks under the chained gate stay in the file as 'unresolved.' Elena stays at the quarry fence some evenings, not crying, just counting — you watched her once, from the car, and her lips said five, then six, then stopped.`},{id:"c11-v-foss",label:"Foss came back for the count",description:"A boy who never got his olly-olly-oxen-free, four friends collected in order, and a chat kept warm to gather the last one.",requiredEvidenceIds:["case-11.hidden","c11-n-locked","c11-ph-metadata","c11-vm-count","c11-m-un-3"],isCanon:!0,epilogue:`You file the verdict the evidence keeps whispering and the law has no shelf for: someone survived December 13, 2005 — or something of him did — and spent twenty years learning five voices well enough to wear them. Iris in August. Duke in September. Kat, quietly, some unmarked day in summer. Lonnie in November. Each account kept warm afterward, a trophy case with typing indicators, herding the last hider toward the anniversary.

Your report cannot say what he is now. It says what he did: the scheduler queues, the vault amendments signed by no thumb, the roll call on the 7:44 voicemail with four 'here's in four stolen voices. It notes that Marcus went anyway — knowingly, note in hand, to stand at dead center and say the words nobody ever called across that ice. The last human act in this file is a man walking onto frozen water to finish a game of hide-and-seek twenty years late, and your report refuses to call that anything but what Elena calls it: brave.

No one is found. Not one of the six. The queue of 'Kat' messages runs dry in March, mid-sentence, as if the author finally had everyone he was writing for.

What you can't shake is the sequence: 'marcus, you're allowed to answer. you came. you're the only one who came on your own feet.' Every analyst hears menace in it, then listens twice more and hears something worse — gratitude. The five statements from 2005 said Foss went out alone. For the first time in twenty years, on the night the story concluded, that was finally false. Nobody was alone out there. The report ends with the landline voicemail, transcribed in full, because 'everybody's home' is either the most terrifying sentence in this archive or the only gentle one, and you have decided you are not qualified to say which.`},{id:"c11-v-lonnie",label:"Lonnie orchestrated everything",description:"The last friend 'taken' is the classic author. He proposed the phone call that never happened. He owed the day more than anyone.",requiredEvidenceIds:["c11-m-lo-3","c11-m-lo-6","c11-m-gr-12"],isCanon:!1,epilogue:`The living-suspect theory: Lonnie, who found the pact heavier than the others, staging four disappearances and a finale to bury the story with its witnesses. His reply arriving a minute before Marcus's message even looks like sloppy scheduling by a human hand.

It survives right up until forensics unlocks Lonnie's abandoned laptop. There's a draft email to a true-crime podcast, dated Nov 29, attaching the 2005 clipping and beginning: 'My name is Lon Pruett and twenty years ago five children lied about a sixth.' He was going to confess. To everyone. The night before he vanished, he'd asked 'Kat' to prove herself, and she had, and he understood what that proof meant, and he reached for the loudest microphone he could find.

The email was never sent. The draft's last edit is timestamped 8:00 PM, Nov 30 — the exact minute of the call he'd promised Marcus. It ends mid-word. The word was 'counting.'`},{id:"c11-v-pact",label:"The lie collapsed on its keepers",description:"Five people maintained one story for twenty years. Guilt is patient, coordinated, and better at scheduling than any app.",requiredEvidenceIds:["c11-ph-clipping","c11-cal-checkin","c11-n-tally"],isCanon:!1,epilogue:`The psychological verdict: no revenant, no orchestrator — five people rotting under the same secret, dropping away one by one as the twentieth anniversary approached, each disappearance mundane on its own. Iris walked away from her life; people do. Duke wandered from a crash; people do. The 'imposter' messages were the survivors themselves, performing wellness at each other because the alternative was the conversation none of them could have.

It explains almost everything, which is this case's cruelest trick — every file in this archive has a version that explains almost everything.

It does not explain the four voices on the 7:44 voicemail answering a roll call. It does not explain the vault amendments, or the landline dead since 2009, or tire tracks under a chained gate. You write those into an appendix titled 'residual anomalies,' and the phrase does its bureaucratic work, and the file closes.

On December 13th of next year, at 4:40 PM, a calendar reminder will fire on a phone in an evidence locker: 'check in (the story).' Nobody will answer it. That, at least, your report can guarantee. It's the only thing it can.`}]},Xt=Object.freeze(Object.defineProperty({__proto__:null,default:Qt},Symbol.toStringTag,{value:"Module"})),Zt={id:"case-12",title:"Dog Walker",victimName:"Sadie Kwan, 26",summary:"The dog kept pawing at the hallway wall. The client kept saying 'use only the front hall — the house confuses guests.' The county floor plan shows nine rooms. Her photos show ten. Somewhere between a twenty-minute walk and a house that measures wrong, Sadie Kwan started spending hours inside — and then she stopped existing on the app at all.",intake:`SUBJECT: Kwan, Sadie R. (26). Reported missing by roommate Dec 18 after failing to return from her 3 PM walk route.

DEVICE: Recovered Dec 17, 23:50, from the porch mail shelf of 44 Beechmont Terrace, screen cracked, placed under the client's doormat weights 'to keep it from blowing away' per the homeowner, G. Hollis, who called it in himself.

PLATFORM: WagRoute records show subject 'resigned' via in-app message Dec 17, 16:20 — typed, per stylometry, unlike any of her 1,400 prior messages. Her walk logs for 44 Beechmont show a pattern: 20-minute walks, followed by stationary interior GPS fixes of 2–4 hours, three times weekly, for six weeks. Hollis states she 'used the bathroom sometimes.'

PROPERTY: 44 Beechmont Terrace, single owner since 1996. County plans (sheet 09, filed 1988) show nine rooms. Exterior elevation shows a window on the northeast face with no corresponding interior room. Homeowner declined interior access; warrant pending.

HOUSEHOLD: G. Hollis, 58, sole occupant since his mother's death in 2011. Her pension has remained active. Flag for financial crimes.

Second-pass review requested. The dog has been surrendered to county shelter. The dog will not stop facing the house.`,contentWarningLevel:2,phone:{ownerLabel:"sadie 🐾 — walker, dog aunt, professional good girl sayer",recoveredAt:"2025-12-19T20:45:00",batteryStart:31,wallpaperHue:28,lockScreenNotifications:[{appId:"messages",title:"Nora 🏠",preview:"you're not home and biscuit's house is DARK. calling wagroute. calling everyone",targetId:"c12-th-nora"},{appId:"messages",title:"Unknown",preview:"she says thank you for the oranges.",targetId:"c12-th-unknown"},{appId:"messages",title:"Garrett Hollis (Biscuit)",preview:"Biscuit was upset after your visit. Dogs remember doors, Miss Kwan.",targetId:"c12-th-hollis"}]},messages:[{id:"c12-th-hollis",contactName:"Garrett Hollis (Biscuit)",contactNumber:"(419) 555-0161",messages:[{id:"c12-m-ho-1",from:"them",text:"Miss Kwan. Biscuit took to you at the meet-and-greet, which is rare. Three walks weekly, 3 PM sharp. House rules: enter by the front, leash by the coat rack, and please use only the front hall. The house confuses guests.",timestamp:"2025-10-27T09:00:00",evidenceLabel:"House rule from day one: “use only the front hall. The house confuses guests.”"},{id:"c12-m-ho-2",from:"owner",text:"no problem at all! front hall only. biscuit and I will be best friends by friday",timestamp:"2025-10-27T09:15:00"},{id:"c12-m-ho-3",from:"them",text:"You'll need the door application for entry — HollisHome. I've sent the install. The lock prefers it to keys.",timestamp:"2025-10-27T09:20:00",evidenceLabel:"He required his own door app, “HollisHome,” for entry"},{id:"c12-m-ho-4",from:"them",text:"Biscuit scratched the hallway wainscoting again, I see. If he paws at the wall, distract him. It's an old house. It settles, and he's never approved of the settling.",timestamp:"2025-11-07T16:00:00",evidenceLabel:"“If he paws at the wall, distract him.”"},{id:"c12-m-ho-5",from:"owner",text:"will do! also — random — I heard a radio? upstairs maybe? wanted to make sure I wasn't leaving one on somehow",timestamp:"2025-11-12T15:40:00",evidenceLabel:"Nov 12: she reported hearing a radio in the empty house"},{id:"c12-m-ho-6",from:"them",text:"There is no radio, Miss Kwan. The house carries sound from the street. It's one of its confusions. You walk the dog. The house is my department.",timestamp:"2025-11-12T15:41:00",evidenceLabel:"Answered in sixty seconds: “There is no radio… The house is my department.”"},{id:"c12-m-ho-7",from:"them",text:"You stayed forty minutes past the walk on Tuesday. The lock keeps a diary, Miss Kwan. I don't mind — Biscuit enjoys the company. But stay where Biscuit stays.",timestamp:"2025-11-21T18:00:00",evidenceLabel:"“The lock keeps a diary… stay where Biscuit stays.”"},{id:"c12-m-ho-8",from:"owner",text:"sorry!! he wanted extra fetch and then flopped on my feet. hostage situation, very cozy. won't run long again",timestamp:"2025-11-21T18:10:00"},{id:"c12-m-ho-9",from:"them",text:"Biscuit was upset after your visit. Dogs remember doors, Miss Kwan.",timestamp:"2025-12-16T19:00:00",evidenceLabel:"Dec 16, the night before: “Dogs remember doors, Miss Kwan.”"}]},{id:"c12-th-nora",contactName:"Nora 🏠",contactNumber:"(419) 555-0138",ghostTypingAfterSeconds:390,messages:[{id:"c12-m-no-1",from:"them",text:"bring home milk if you pass the good bodega. also a photo of biscuit. priorities in that order reversed",timestamp:"2025-11-05T14:30:00"},{id:"c12-m-no-2",from:"owner",text:"nora. weird one. biscuit's house has a window on the OUTSIDE that I can't find on the INSIDE. I walked the upstairs hall counting doors while he peed forever against a hedge. the window should be at the end of the hall. the hall ends in wall",timestamp:"2025-11-14T16:10:00",evidenceLabel:"Nov 14: a window outside with no room inside"},{id:"c12-m-no-3",from:"them",text:"old houses are weird?? closets get sealed?? (why were you counting doors sadie)",timestamp:"2025-11-14T16:15:00"},{id:"c12-m-no-4",from:"owner",text:"because biscuit sits at that wall. every single walk, before and after. he sits, he paws once, and he looks at me. nora he's not being a weird dog. he's being a CORRECT dog. dogs sit like that at doors",timestamp:"2025-11-14T16:22:00",evidenceLabel:"“he's being a CORRECT dog. dogs sit like that at doors.”"},{id:"c12-m-no-5",from:"them",text:"sadie I love you. walk the dog. cash the checks. do not renovate the man's house with your eyes",timestamp:"2025-11-14T16:25:00"},{id:"c12-m-no-6",from:"owner",text:"…nora. update I can't say out loud. someone answered the wall today. biscuit pawed and something pawed BACK. gentle. three times. I have to figure out what to do and you have to not tell anyone yet. promise me. it's not what it sounds like. or it's exactly what it sounds like. I need a week",timestamp:"2025-12-01T17:45:00",evidenceLabel:"Dec 1: “something pawed BACK. gentle. three times.”"},{id:"c12-m-no-7",from:"them",text:"SADIE.",timestamp:"2025-12-01T17:46:00"},{id:"c12-m-no-8",from:"them",text:"you're not home and biscuit's house is DARK. calling wagroute. calling everyone",timestamp:"2025-12-17T21:30:00"}]},{id:"c12-th-wagroute",contactName:"WagRoute",messages:[{id:"c12-m-wr-1",from:"them",text:"WagRoute: You're a TOP WALKER! 🐾 127 five-star walks. Clients say: 'treats every dog like family.'",timestamp:"2025-11-01T12:00:00"},{id:"c12-m-wr-2",from:"owner",text:"Question: can I see previous walkers' notes for a client? 44 Beechmont Terrace. Want to check the dog's history.",timestamp:"2025-11-16T10:00:00"},{id:"c12-m-wr-3",from:"them",text:"WagRoute: For privacy, walker notes aren't shared! FYI this client has had 6 walkers this year — you're doing great sticking with it! Some dogs are a journey! 🐾",timestamp:"2025-11-16T10:05:00",evidenceLabel:"Six walkers in one year at 44 Beechmont — WagRoute called it “a journey”"},{id:"c12-m-wr-4",from:"owner",text:"Six?? Can you tell me why the others stopped?",timestamp:"2025-11-16T10:08:00"},{id:"c12-m-wr-5",from:"them",text:"WagRoute: Walkers come and go! One noted the client was 'particular about the hallway' — that's all we can share. Keep being awesome! 🐾",timestamp:"2025-11-16T10:10:00",evidenceLabel:"The only note WagRoute would share: “particular about the hallway”"},{id:"c12-m-wr-6",from:"them",text:"WagRoute: We've received your resignation. We're sorry to see you go, Sadie! Final payout processing. 🐾",timestamp:"2025-12-17T16:21:00",evidenceLabel:"Her “resignation,” Dec 17, 4:21 PM — typed like a stranger, per stylometry"}]},{id:"c12-th-okabe",contactName:"Mrs. Okabe (Mochi)",contactNumber:"(419) 555-0126",messages:[{id:"c12-m-ok-1",from:"them",text:"Mochi has once again eaten a sock. He is fine. He is always fine. The socks are never fine. See you Tuesday, dear.",timestamp:"2025-12-09T18:00:00"},{id:"c12-m-ok-2",from:"owner",text:"mochi is an agent of chaos and I would take a bullet for him. tuesday!",timestamp:"2025-12-09T18:10:00"},{id:"c12-m-ok-3",from:"them",text:"You seemed tired Tuesday, Sadie. And you asked me odd questions about my neighbor's mother. I knew Adelaide Hollis, dear. Lovely woman. Terrible son. Why do you ask after a woman fourteen years dead?",timestamp:"2025-12-11T17:00:00",evidenceLabel:"Mrs. Okabe: “Why do you ask after a woman fourteen years dead?”"},{id:"c12-m-ok-4",from:"owner",text:"mrs okabe — one more odd question and then I'll explain everything soon, promise. did adelaide like oranges?",timestamp:"2025-12-11T17:15:00",evidenceLabel:"Her question: “did adelaide like oranges?”"},{id:"c12-m-ok-5",from:"them",text:"She grew them in pots in that northeast room, the one with the good morning light. How on earth did you know that, dear?",timestamp:"2025-12-11T17:20:00",evidenceLabel:"Mrs. Okabe: Adelaide grew oranges “in that northeast room” — the room that isn't on the plan"}]},{id:"c12-th-jules",contactName:"Jules 💛",contactNumber:"(419) 555-0187",messages:[{id:"c12-m-ju-1",from:"them",text:"birthday dinner friday!! I booked the place with the tiny desserts you make fun of and secretly love",timestamp:"2025-12-10T13:00:00"},{id:"c12-m-ju-2",from:"owner",text:"I love YOU and I tolerate the desserts. friday 💛 fair warning I might be weird and distracted, work thing. big work thing. good big. I think I'm about to do the best thing I've ever done",timestamp:"2025-12-10T13:20:00",evidenceLabel:"“I think I'm about to do the best thing I've ever done”"},{id:"c12-m-ju-3",from:"them",text:"cryptic!! proud of you for whatever it is. friday",timestamp:"2025-12-10T13:22:00"},{id:"c12-m-ju-4",from:"them",text:"sadie it's friday",timestamp:"2025-12-19T19:30:00"}]},{id:"c12-th-mom",contactName:"Mom",contactNumber:"(419) 555-0109",messages:[{id:"c12-m-mo-1",from:"them",text:"Grandma's recipe box came to you? The movers mislabeled it. Keep the almond cookie card and mail the rest, thief.",timestamp:"2025-11-28T11:00:00"},{id:"c12-m-mo-2",from:"owner",text:"the almond card was always mine, this is a formality. love you. hey mom — weird question. if you knew something that would blow up a family, but saying nothing hurts someone every single day, what's the rule?",timestamp:"2025-11-28T11:30:00",evidenceLabel:"To her mom: “saying nothing hurts someone every single day — what's the rule?”"},{id:"c12-m-mo-3",from:"them",text:"The rule is the person being hurt gets to decide, if they can. And if they can't, you decide like you'll have to say it to their face one day. Why? Sadie? WHY?",timestamp:"2025-11-28T11:45:00",evidenceLabel:"Her mother's rule: “the person being hurt gets to decide, if they can”"}]},{id:"c12-th-hardware",contactName:"Beechmont Hardware",messages:[{id:"c12-m-hw-1",from:"them",text:"BEECHMONT HARDWARE: Your order is ready — 1x stud finder, 1x pry bar (small), 1x LED puck lights 3pk.",timestamp:"2025-12-04T10:00:00",evidenceLabel:"Dec 4: a stud finder, a small pry bar, puck lights"},{id:"c12-m-hw-2",from:"owner",text:"thanks! quick q — do you carry door hinges that don't squeak? asking for a very old door",timestamp:"2025-12-04T10:15:00",evidenceLabel:"“hinges that don't squeak… for a very old door”"}]},{id:"c12-th-library",contactName:"County Records Office",messages:[{id:"c12-m-li-1",from:"them",text:"RECORDS: Your requested copies are ready — 44 Beechmont Terrace, plan sheet 09 (1988), and elevation sheet 09-E. $4.50 at pickup.",timestamp:"2025-11-19T14:00:00",evidenceLabel:"She pulled the county plans: sheet 09 and the elevation"},{id:"c12-m-li-2",from:"them",text:"RECORDS: Also located per your request — obituary, Adelaide R. Hollis, 2011. Note: our clerk flagged that no burial plot is registered countywide under that name. Unusual, not unheard of.",timestamp:"2025-11-26T15:00:00",evidenceLabel:"The clerk's flag: Adelaide Hollis, obituary 2011 — no burial plot registered anywhere in the county"}]},{id:"c12-th-unknown",contactName:"Unknown",messages:[{id:"c12-m-un-1",from:"them",text:"she says thank you for the oranges.",timestamp:"2025-12-15T22:40:00",evidenceLabel:"Dec 15, from a number with no records: “she says thank you for the oranges.”"},{id:"c12-m-un-2",from:"owner",text:"who is this? is she okay? is this the neighbor? PLEASE",timestamp:"2025-12-15T22:45:00"},{id:"c12-m-un-3",from:"them",text:"she practices the numbers every night like you showed her. she wanted you to know she's fast now.",timestamp:"2025-12-15T22:47:00",evidenceLabel:"“she practices the numbers every night like you showed her. she's fast now.”"}]}],photos:[{id:"c12-ph-biscuit",caption:"BISCUIT. eleven out of ten. would take a bullet, would take several",timestamp:"2025-10-29T15:20:00",aspect:"portrait",meta:{takenAt:"2025-10-29T15:20:00",device:"This phone",location:"44 Beechmont Terr"},svg:s('<rect width="300" height="400" fill="#1d1914"/><ellipse cx="150" cy="270" rx="95" ry="70" fill="#8a6b3a"/><circle cx="150" cy="160" r="60" fill="#9a7a44"/><ellipse cx="108" cy="120" rx="18" ry="30" fill="#7a5c30" transform="rotate(-20 108 120)"/><ellipse cx="192" cy="120" rx="18" ry="30" fill="#7a5c30" t m. and two handprints — one dried near-black. one still red.</text>'+E("16:20:11",400,300),{aspect:"landscape",base:"#0f0c07",grain:.13})},evidenceLabel:"Inside the annex wall: years of tally marks — and two handprints, one old, one fresh"},{id:"c12-ph-oranges",caption:"bodega run. don't ask why a dog walker needs this many oranges. (the answer is good. the answer is the best answer I've ever had)",timestamp:"2025-12-05T14:30:00",aspect:"portrait",meta:{takenAt:"2025-12-05T14:30:00",device:"This phone"},svg:s('<rect width="300" height="400" fill="#171310"/><rect x="60" y="220" width="180" height="130" rx="10" fill="#2a2014"/>'+Array.from({length:9},(t,e)=>`<circle cx="${95+e%3*55}" cy="${250+Math.floor(e/3)*34}" r="20" fill="#b8681f"/><circle cx="${88+e%3*55}" cy="${243+Math.floor(e/3)*34}" r="6" fill="#d8863a" opacity="0.6"/>`).join(""),{aspect:"portrait",base:"#110e0a",grain:.1}),evidenceLabel:"Nine oranges — “the answer is the best answer I've ever had”"},{id:"c12-ph-mochi",caption:"mochi post-sock, unrepentant. mrs okabe says he has 'the digestion of a cement mixer and the conscience of a senator'",timestamp:"2025-12-09T15:10:00",aspect:"landscape",meta:{takenAt:"2025-12-09T15:10:00",device:"This phone",location:"Okabe residence"},svg:s('<rect width="400" height="300" fill="#1c1814"/><ellipse cx="200" cy="220" rx="90" ry="50" fill="#c9a05a"/><circle cx="200" cy="150" r="45" fill="#d8b06a"/><path d="M165 115 l-8 -26 22 14z M235 115 l8 -26 -22 14z" fill="#b8905a"/><circle cx="185" cy="145" r="6" fill="#1a1410"/><circle cx="215" cy="145" r="6" fill="#1a1410"/><ellipse cx="200" cy="168" rx="9" ry="6" fill="#2a2018"/>',{aspect:"landscape",base:"#141110",grain:.1})},{id:"c12-ph-doorcode",caption:"",timestamp:"2025-12-14T16:45:00",aspect:"portrait",deleted:!0,meta:{takenAt:"2025-12-14T16:45:00",device:"This phone"},svg:s(`<rect width="300" height="400" fill="#100e0b"/><rect x="70" y="80" width="160" height="240" fill="#cfc7b2" opacity="0.88" transform="rotate(-2 150 200)"/><text x="150" y="130" text-anchor="middle" font-family="serif" font-size="12" fill="#2a2620">for A. —</text><text x="150" y="170" text-anchor="middle" font-family="serif" font-size="11" fill="#3a3427">front door: hold ◉ then</text><text x="150" y="195" text-anchor="middle" font-family="serif" font-size="16" fill="#7a3a42">2 — 6 — 2 — 6</text><text x="150" y="240" text-anchor="middle" font-family="serif" font-size="10" fill="#3a3427">practice till it's fast.</text><text x="150" y="262" text-anchor="middle" font-family="serif" font-size="10" fill="#3a3427">porch. gate. LEFT at the sidewalk.</text><text x="150" y="284" text-anchor="middle" font-family="serif" font-size="10" fill="#3a3427">blue house = okabe = safe.</text>`,{aspect:"portrait",base:"#0c0a08",grain:.11}),evidenceLabel:"Deleted photo of a handwritten card “for A.”: the door code, and the route to the blue house"}],notes:[{id:"c12-n-walklog",title:"beechmont log (the real one)",timestamp:"2025-12-14T22:00:00",evidenceLabel:"Her real log of 44 Beechmont — six weeks from dog walks to a rescue",body:`wagroute gets 'walked biscuit, good boy, 20 min.' this note gets the truth.

nov 12 — the radio again. big band music, then it stopped MID-SONG when I called out. radios don't get embarrassed. people do.

nov 14 — window outside, no room inside. hollis says the house 'confuses guests.' the house is the only honest one here.

nov 19 — pulled the county plans. sheet 09. northeast corner is a 'mechanical chase,' 11 feet wide. chases are for ducts. this house has radiators.

nov 26 — adelaide hollis. obit 2011, no plot anywhere in the county. pension still active per the mail I should not have read on the hall table (window envelope, I didn't open anything, I just READ, that's barely a crime).

nov 30 — I found the seam behind the coat rack. saw through it. wallpaper with little oranges. a tray. a MADE BED. someone lives in the chase, and someone changes those sheets.

dec 1 — biscuit pawed. and it pawed back. three times. gentle. I sat down on the floor and biscuit put his head in my lap like: finally. FINALLY she gets it. this is what I've been SAYING.

dec 2 — talked through the wall in a whisper. she's real. she's ADELAIDE. she's been in there since 'the funeral.' he's not violent with her, she says — worse, he's SCHEDULED with her. fed at biscuit's times. walked in the yard at night twice a month, blindfolded, 'for her eyes.' fourteen years. she asked if the orange trees on the porch survived. there are no orange trees. there is no porch furniture. there is nothing left of her out here except a dog who remembers doors.

dec 5+ — oranges through the seam, one at a time. taught her the door app pattern through the wall (she can hear the beeps from inside — the lock beeps the code EVERY TIME HE ENTERS. fourteen years of hearing freedom in four beeps and never knowing the tune had words).

plan is in the locked note. code: the house, then the sheet that proves it.

mom's rule: the person being hurt gets to decide. she decided. she said the word through the wall and the word was OUT.`},{id:"c12-n-locked",title:"the plan (locked, obviously)",timestamp:"2025-12-15T23:30:00",lock:{code:"4409",hintText:"“the house, then the sheet that proves it.” — the address on the gate, the plan in the county file.",clueSourceIds:["c12-ph-floorplan","c12-n-walklog"]},evidenceLabel:"The locked note: the extraction plan, hour by hour",body:`WEDNESDAY DEC 17. hollis has his rotary club lunch 12-2 (every third wednesday, confirmed twice). walk is 3pm. that's my legal reason to be inside.

12:15 — enter with the app like normal. biscuit gets a chew (sorry buddy, you're the distraction today, you've earned a career change).
12:20 — coat rack moved. seam + pry bar. hinges oiled LAST week (did it during thursday's walk — the panel is a DOOR, it was always a door, it has hinges on her side. think about that. don't think about that.)
12:30 — she walks out. fourteen years, eleven feet. I gave her my gray coat and nora's old boots (nora I'll explain).
12:40 — NOT my car (he knows my car). taxi from the corner, prepaid, to the women's center on fullerton. they know she's coming — 'an elderly fraud victim.' true enough to start.
1:00 — I put the panel back. I finish the walk at 3 like nothing. thursday I 'quit' wagroute slowly and normally.
then: the center's advocate calls financial crimes about the pension. paper does the rest. paper is slower than a pry bar but paper can't be pushed back through a wall.

contingency, because nora's voice is in my head: if he comes home early, I am a dog walker who heard a noise and found a hidden door, full stop. adelaide hides on the porch. the CARD (photo in my deleted folder — deleted in case he ever grabs my phone, recoverable because I'm not an amateur) has the code and the route to okabe's. she practices the numbers every night. she's fast now.

if this goes wrong in the specific way I won't type: everything above is true, sheet 09 is at county records under my name, and the pension trail is fourteen years long. you don't need me. you just need the paper. and somebody feed biscuit — he did all the actual detective work.`},{id:"c12-n-clients",title:"pack roster 🐾",timestamp:"2025-11-01T12:00:00",body:`biscuit (golden, 44 beechmont) — M/W/F 3pm. front hall only per client. best boy. SITTER at walls, see log

,timestamp:"2025-12-17T12:14:00",x:70,y:45,detail:"Entered 12:14 PM — on schedule with her plan. Interior fixes show the front hall, then the northeast corner at 12:26. At 12:41, a fix at the corner TAXI STAND, forty seconds long. Then back inside the house at 12:44. She went back in.",evidenceLabel:"12:41 PM: she reached the taxi stand — then went back inside at 12:44"},{id:"c12-pin-last",label:"44 Beechmont — final fix",timestamp:"2025-12-17T16:19:00",x:70,y:44,detail:"Final fix, 4:19 PM: interior, northeast corner — inside the eleven feet the floor plan calls a chase. One minute later, her WagRoute resignation was typed. The phone was found on the porch that night, under the doormat weights, 'to keep it from blowing away.'",evidenceLabel:"Final fix, 4:19 PM: inside the space the plans call a chase"}],browserHistory:[{id:"c12-b-plan",query:"44 beechmont terrace floor plan county records how to request",timestamp:"2025-11-17T21:00:00",evidenceLabel:"She researched how to pull the county plans for his house"},{id:"c12-b-window",query:"house has window outside but no room inside old houses",timestamp:"2025-11-14T20:30:00",evidenceLabel:"“house has window outside but no room inside”"},{id:"c12-b-adelaide",query:"adelaide hollis obituary 2011",timestamp:"2025-11-24T22:00:00"},{id:"c12-b-pension",query:"pension keeps paying after death who checks",timestamp:"2025-11-26T21:15:00",evidenceLabel:"“pension keeps paying after death who checks”"},{id:"c12-b-report",query:"report elder abuse anonymously without proof what happens",timestamp:"2025-12-02T23:40:00",evidenceLabel:"Dec 2: “report elder abuse anonymously without proof what happens”"},{id:"c12-b-welfare",query:"police welfare check can it make things worse for captive person",timestamp:"2025-12-02T23:55:00",evidenceLabel:"Why she didn't call 911: “can a welfare check make things worse for a captive person”"},{id:"c12-b-studfinder",query:"stud finder find hollow space behind wall",timestamp:"2025-12-03T20:00:00"},{id:"c12-b-shelter",query:"fullerton women's center intake elderly fraud victim",timestamp:"2025-12-12T21:30:00",evidenceLabel:"She arranged intake at the women's center — “elderly fraud victim”"},{id:"c12-b-last",query:"how long does a rotary club lunch last",timestamp:"2025-12-16T23:20:00",evidenceLabel:"Her last search: “how long does a rotary club lunch last”"}],hiddenApp:{disguiseIcon:"clock",disguiseLabel:"HollisHome",revealAfterClueIds:["c12-th-hollis","c12-n-walklog"],title:"HollisHome — Owner Console",heading:"44 Beechmont Terrace · household schedule",body:`The door app he required her to install. Guest mode shows a lock button. Owner mode — which pushed itself to her phone at 4:20 PM on Dec 17, the minute after her last fix — shows the household.
