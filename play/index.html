The annex has no study. The app has a cohort.`,entries:[{label:"Subject 01 (device: shelf slot 1)",status:"FINISHED 2019",detail:"retention: stable · node: unlisted"},{label:"Subject 04 (device: shelf slot 4)",status:"FINISHED 2022",detail:"retention: stable · node: unlisted"},{label:"Subject 07 (device: shelf slot 7)",status:"RETIRED",detail:"woke during questioning · file closed"},{label:"Subject 09 — C. BRANDT",status:"FINISHED (early)",detail:"10 nights · answers: complete · commendation"},{label:"Night 11–14 audio",status:"RECORDED",detail:"empty room · storage shelf · 31 hrs"},{label:"Subject 09 relocation",status:"TRACKED",detail:"node: HARLOW · retention re-established 11/21"},{label:"Cohort intake",status:"OPEN (1 slot)",detail:"flyer restocked · one tab remaining"}],footer:"He planned his escape in the one room where plans are collected. The app logged his relocation to Harlow two days after he arrived — “retention re-established.” Whatever the study is studying, it doesn't need the annex, and it doesn't lose subjects. It graduates them.",evidenceLabel:"DreamLog's cohort ledger: Casey “FINISHED (early)” — relocation to Harlow already TRACKED"},liveEvents:[{id:"c6-live-kestrel",kind:"message",afterSeconds:320,threadId:"c6-th-kestrel",message:{id:"c6-m-ke-live",from:"them",text:"the phone is enrolled, not the subject. whoever holds it now may continue. night 11 is available to you.",timestamp:"2025-11-23T21:21:00",evidenceLabel:"The study, to whoever holds the phone: “night 11 is available to you”"}},{id:"c6-live-dreamlog",kind:"notification",afterSeconds:620,title:"DreamLog",body:"You seem tired. A bed has been prepared.",glitch:!0}],verdicts:[{id:"c6-v-lab",label:"The study took him",description:"A lab with no department, a proctor who pays first and never blinks, seven unclaimed phones on a shelf — and an empty slot with his name on it.",requiredEvidenceIds:["c6-m-ke-3","c6-ph-storage","c6-ph-ceiling","c6-vm-proctor"],isCanon:!1,epilogue:`You write the version the annex was dressed for: an unlicensed operation harvesting… something… from sleeping students, and Casey as its ninth taking. The seven shelf phones support you — three trace to students who withdrew abruptly between 2017 and 2023, none of whom can be located. The university seals the annex behind real locks this time.

It's a strong report. It has one soft spot you chose not to press: the duffel. Victims don't pack a go-bag, sell their bike, and scout a bus bay. You left the duffel out of the narrative because it complicated it.

In March, CampusCash quietly logs the first of eleven cash payments against Casey Brandt's balance. Money orders. Postmarked from three different towns, none of them Harlow. You never amend the report. Some soft spots you press. Some you let sleep.`},{id:"c6-v-staged",label:"Casey staged the whole thing",description:"The debt, the hearing, the sold bike, the ticket in his cousin's name, the phone left behind on purpose. The creepy lab wasn't his abductor — it was his alibi.",requiredEvidenceIds:["c6-n-locked","c6-ph-packlist","c6-m-ma-5","c6-pin-busstation","c6-pin-gap"],isCanon:!0,epilogue:`Your report says what the locked note says: Casey Brandt walked out the east door at 6:40 AM with a gray duffel and boarded Route 88 under a borrowed name, having built — with a bio major's care — a disappearance designed to read as a taking. The debt gets a face, the hearing gets an empty chair, and a missing-victim file gets sympathy where a runaway's would get invoices. It worked on everyone. It nearly worked on you.

He is not brought back. He's twenty, he committed no crime worth the word, and the wifi handshake at the food cart is evidence of a breakfast, not a felony. The file converts to 'voluntary — welfare confirmed' after a payphone call reaches Marisol in December. She won't say what he said. She'll only confirm the word he used to prove it was him, and she won't say that either.

What your report does not resolve — what you append, flag, and are told to unflag — is the annex. The study that predates his debt. The seven phones that predate his birth, one of them. The cohort ledger that logged his arrival in Harlow before his bus did. Casey planned his escape in the one room on Earth where plans are collected nightly, out loud, from the clearest talker in the cohort.

He thinks he got away because he did get away. Those are two different sentences. The proctor said he'd learn to sleep inside the difference. Somewhere north, in a town with one payphone, he's learning.`},{id:"c6-v-collectors",label:"The recovery partners collected",description:"$6,300, a blown deadline, a lender that 'does house calls' — and a kid who vanished the morning after his final notice.",requiredEvidenceIds:["c6-vm-collector","c6-m-cc-4","c6-m-da-4"],isCanon:!1,epilogue:`You chase the ugliest human read: Recovery Partners LLC, whose corporate filing lists a nail salon and whose 'partners' have priors that make the campus PD sit up straight. The timing damns them — final notice on the 20th, gone by the 21st.

Except he was gone by the 20th at 6:40 AM, before the notice sent. And the partners, when found, are genuinely furious: you can't collect from a ghost, and they'd been watching the dorm for a week. Their surveillance notes — which they surrender with unsettling eagerness once 'accessory' is mentioned — describe Casey leaving the annex that morning, duffel on shoulder, 'walking weird. slow. like someone told him not to run.'

The notes describe one more thing, and the man who wrote them quit collections over it: a tall figure in a gray cardigan watching Casey go from the annex roof. 'Not following him,' the note says. 'Just. Keeping track.' The file stays open on a technicality. Everything true in it belongs to somebody else's verdict.`},{id:"c6-v-unknown",label:"The records disagree with each other",description:"A phone in two places at once. A dead line that keeps recording. A study that answers questions by asking them of the sleeping.",requiredEvidenceIds:["c6-vm-annex","c6-cal-wake","case-06.hidden"],isCanon:!1,epilogue:`You write the contradictions without resolving them, because resolving them would require choosing which physics to believe. A phone that produced a wifi handshake from a shelf. A disconnected line that recorded a conversation four days after its last subscriber. An app with no install source, no storage footprint, and thirty-one hours of audio of an empty room in which, twice, something adjusts a chair.

The report is accepted with a note: 'Recommend classifying device anomalies as hardware faults.' You recommend nothing. The seven other phones go to a state lab. The state lab loses them — all seven, one incident report, the word 'misrouted.'

dec 2, 5am. I did the dumb thing. box #34 had a torn corner, barely, and I. okay. I opened it. photographed it. resealed it with THEIR tape (kept a roll from a drop where the tape came loose). pills. hundreds of bottles, zero labels. I don't know what they are and I don't want to. two more weeks, then the ring, then days forever.

if I need to write anything else down it goes in the locked one. code is the address. the whole problem is the address.`},{id:"c7-n-locked",title:"if I don't clock out",timestamp:"2025-12-03T21:50:00",lock:{code:"1148",hintText:"“code is the address. the whole problem is the address.” — the stop that doesn't exist.",clueSourceIds:["c7-n-log","c7-th-recipient"]},evidenceLabel:"The locked note, written 40 minutes before his last route",body:`9:50pm. route starts at 10. writing this fast.

they know. the text last night said 'you opened one.' tonight's route has ONE verge stop and it's stop 35 — the LAST one — and it says FULL CARGO, driver unload. 47 boxes. they've never taken more than 3 a night. they're not restocking. they're closing.

and the 'adjustment' was accepted 'on my behalf.' I never enrolled in that. somebody inside fleetly's pipe accepts these for us. finds the drivers who need money, feeds them forties, rotates them out when they get curious. delray got curious. 'transferred.'

plan, because simone says I always need a plan:
1. run the route normal, stops 1-34.
2. at verge: unload HALF, stay in the headlights, knock twice, leave. engine running the whole time.
3. tomorrow: theo's cop friend gets the photo, the log, the tape roll, everything. all of it's backed up in the cloud folder marked TAXES 2023 because nobody, criminal or cop, has ever willingly opened a folder marked taxes.
4. two weeks notice, effective the second the ring is on her finger.

 depot, 05:50, van parked in its bay. No route data exists between Verge Rd and here. The drive takes 22 minutes. The gap is four hours. The van returned with MORE packages than it left with.",evidenceLabel:"A four-hour gap, then the depot — the van returned carrying 47 boxes it never picked up"}],browserHistory:[{id:"c7-b-address",query:"1148 verge road",timestamp:"2025-11-22T00:30:00",evidenceLabel:"His first search for the address: zero results, on every map service"},{id:"c7-b-gps",query:"gps takes me to address that isn't on any map",timestamp:"2025-11-23T02:15:00"},{id:"c7-b-forum",query:"fleetly driver forum ghost stops gratuity",timestamp:"2025-11-25T10:30:00",evidenceLabel:"The driver forum: every “ghost stops” thread locked by moderators within hours"},{id:"c7-b-delray",query:"delray thibodeaux fleetly driver",timestamp:"2025-11-26T11:00:00",evidenceLabel:"He searched for Delray — the driver who had Verge Road before him"},{id:"c7-b-pills",query:"unmarked white pill bottles no label bulk what are they",timestamp:"2025-12-02T05:40:00"},{id:"c7-b-accomplice",query:"am I an accomplice if I didn't know what I was delivering",timestamp:"2025-12-02T06:20:00",evidenceLabel:"Search after opening the box: “am I an accomplice if I didn't know”"},{id:"c7-b-tipline",query:"state police narcotics tip line anonymous",timestamp:"2025-12-02T06:25:00"},{id:"c7-b-quit",query:"how to quit fleetly without penalty mid contract",timestamp:"2025-12-03T20:45:00",evidenceLabel:"His last search, an hour before the route: how to quit"}],hiddenApp:{disguiseIcon:"calculator",disguiseLabel:"LoadCalc",revealAfterClueIds:["c7-th-rex","c7-n-log"],title:"VERGE — Routing Console",heading:"Injection node · district 6",body:`It presents as a cargo-weight calculator. It came pre-installed on the phone Fleetly issued him — and, per the driver forum's locked threads, on every night phone in district 6.

It is the door someone props open between dispatch and the driver's screen.`,entries:[{label:"Ghost stops — active",status:"4 ADDRESSES",detail:"1148 VERGE · 300B CANAL SPUR · 77 LEVEE GAP · 0 ISLE ST"},{label:"Drops routed — YTD",status:"1,204",detail:"all marked received · avg 88 sec"},{label:"Driver: D. THIBODEAUX",status:"ROTATED OUT 10/29",detail:"curiosity flag · 61 drops"},{label:"Driver: A. BOUDREAUX",status:"ROTATED OUT 12/04",detail:"curiosity flag · opened cargo · 35 drops"},{label:"Driver: R. KOWALCZYK",status:"ASSIGNED 12/05",detail:"financial profile: suitable · begins tonight"},{label:"Gratuity ledger",status:"BALANCED",detail:"source account: FLEETLY DISTRICT 6 PETTY — sub 0448"},{label:"Cargo class 9.9",status:"MANIFEST SEALED",detail:"contents: per agreement · do not test"}],footer:"The gratuities come out of a Fleetly petty account. The rotation list reads like payroll. Rex starts tonight. Whatever 'rotated out' means, the console spells it the way payroll spells everything: quietly, in the passive voice, with the driver as the object of the sentence.",evidenceLabel:"The routing console: ghost addresses, a driver rotation ledger — Andre “ROTATED OUT 12/04,” Rex assigned next"},liveEvents:[{id:"c7-live-recipient",kind:"message",afterSeconds:340,threadId:"c7-th-recipient",message:{id:"c7-m-re-live",from:"them",text:"the route is open again. whoever is reading: no experience necessary. the pay is forty.",timestamp:"2025-12-05T22:06:00",evidenceLabel:"The recipient, to whoever reads the thread now: “the route is open again. the pay is forty.”"}},{id:"c7-live-dispatch",kind:"notification",afterSeconds:640,title:"Fleetly Dispatch",body:"ROUTE 6N assigned. 35 stops. Adjustments accepted on your behalf.",glitch:!0}],verdicts:[{id:"c7-v-ran",label:"He took the cargo and ran",description:"A man three weeks from a ring, sitting on a van full of unmarked product worth more than any wedding. Temptation has a weight class too.",requiredEvidenceIds:["c7-ph-ringbudget","c7-ph-opened","c7-m-si-7"],isCanon:!1,epilogue:`You test the cynical read: he knew what the boxes were worth, and stop 35 — full cargo, no witnesses — was the score of a lifetime. Men have vanished for less than a van of product.

It collapses on arithmetic. The van came BACK — with the cargo, plus boxes it never picked up. Thieves don't return the merchandise with interest. And the cloud folder — TAXES 2023, surrendered by his brother the same week — is not the work of a man planning a heist. It's the work of a man building a witness statement he expected to survive long enough to give.

The ring fund sits untouched at $4,800. In June, on what would have been the date, Simone withdraws it and gives it to Mama Boudreaux. Neither of them will say for what. Some funds change purpose the way verdicts should have.`},{id:"c7-v-network",label:"The Verge network rotated him out",description:"Someone inside Fleetly's pipe feeds ghost stops to broke night drivers, pays them in forties, and 'rotates out' the ones who get curious. Andre opened a box.",requiredEvidenceIds:["case-07.hidden","c7-m-re-6","c7-ph-opened","c7-m-un-3","c7-n-locked"],isCanon:!0,epilogue:`Your report draws the machine whole: a routing console wedged between dispatch and the drivers' screens, four ghost addresses, twelve hundred drops, gratuities drawn from Fleetly's own petty account — sub 0448 — and a rotation ledger that hires the desperate and retires the curious. Andre opened one box, and the ledger did what ledgers do.

The TAXES 2023 folder breaks it open. Warrants land on the 47 boxes, the console, the petty account. Three arrests: a district routing supervisor, a depot loader, a man with no job title whose phone contains the 'recipient' threads of nine drivers across four years. All three take pleas. None of the three will say where Andre is, and the sentencing judge notes for the record that all three seemed more afraid of the question than the sentence.

What the pleas don't resolve, your report lists at the end, unflagged, because you've learned: the lab results on the pill bottles come back 'inconclusive — recommend no further testing,' twice, from two labs. Delray Thibodeaux stays missing. The concrete step at the culvert is jackhammered out by the county and is there again in the spring, swept clean. And 'route adjustment gratuities' start appearing that summer in a delivery app two states east — forty dollars a drop, an address that isn't on any map.

Rex quit the night before his first Verge run. He drives a school bus now. Days.`},{id:"c7-v-fleetly",label:"Fleetly is the network",description:"The console shipped on company phones. The forties came from a company account. Corporations don't get infiltrated by their own payroll.",requiredEvidenceIds:["c7-m-fl-4","c7-vm-fleetly","c7-m-di-1"],isCanon:!1,epilogue:`You write it up the chain instead of into it: the console is preinstalled, the gratuities are line items, the carrier agreement forbids drivers from photographing their own screens — §14.2, drafted by someone who knew exactly what would appear on those screens. This isn't a rat in the pipe. This is the pipe.

Fleetly's response is a masterclass: full cooperation, three terminations, a settlement with the family, and a 'comprehensive third-party audit' conducted by a firm that shares a mailing address with Fleetly's outside counsel. The audit finds 'isolated misconduct.' The stock recovers in a week.

You keep one artifact for yourself, in a drawer: the route summary voicemail. '35 of 35 stops delivered. Customer satisfaction: excellent.' The system counted Andre's last stop as complete. Somewhere in a database that no audit will ever be allowed to reach, something was delivered to 1148 Verge Road that night, and the customer was satisfied.`},{id:"c7-v-address",label:"The address took its delivery",description:"A step that exists only when there's a delivery. A dead exchange counting boxes eight hours early. A van that drove home with no one in it.",requiredEvidenceIds:["c7-vm-exchange","c7-ph-dashcam","c7-ph-culvert","c7-pin-depotreturn"],isCanon:!1,epilogue:`You write the version that fits the physical evidence and nothing else: there is a place on Verge Road that exists at delivery time only, and it had been receiving for years before anyone thought to route a human into its arithmetic. The step that comes and goes. The rail dents in pairs, decades deep. The dash cam frame of van 221 driving itself home, GPS refusing to say from where. The counting voice on an exchange that died in 1987, inventorying the cargo before any living person did.

The report is not rejected. It is 'held pending reclassification,' which is the filing system's way of closing its eyes. The 47 boxes sit in evidence. The warrant to open them is signed, twice, and both times the signing judge's office calls to say the paperwork has been 'misrouted.' The word does a lot of work in this case. Everyone lets it.

County road crews report that the turnout at 1146-to-1150 Verge measures nine feet longer some nights than others. The report recommends new survey markers. The markers go in. In the spring they're gone — not vandalized, not removed. Received.`}]},Yt=Object.freeze(Object.defineProperty({__proto__:null,default:zt},Symbol.toStringTag,{value:"Module"})),Vt={id:"case-08",title:"The Babysitting App",victimName:"Maddie Okafor, 17",summary:"A teenage babysitter's favorite clients paid double, tipped in cash, and asked only one thing: never check on the children — they're sleeping. Five sits. She never once saw the kids, or the parents, or the truth about the address. The night of the overnight booking, she saw all three.",intake:`SUBJECT: Okafor, Madison A. (17). Reported missing by her mother Nov 30, after failing to return from an overnight babysitting booking.

DEVICE: Recovered Dec 1 from the front hall of 1207 Fernway Lane. Battery 46%, face down on the floor beside the door. Rear door of the residence found open.

PROPERTY: 1207 Fernway Lane has been condemned and unoccupied since a 2023 electrical fire. Power and water disconnected. Investigators found the front rooms furnished and clean — space heaters, battery lamps, staged family photographs — and the rest of the house fire-damaged and empty. There are no children's beds. There have never been children's beds.

PLATFORM: SitterTrust confirms five completed bookings at this address by family account 'The Wexlers' (ID-verified badge: yes; verification vendor: 'legacy, records unavailable'). Payment: prepaid cards. The account is still active.

Second-pass review requested. A minor is missing. Treat every hour as the first hour.`,contentWarningLevel:3,phone:{ownerLabel:"maddie 🍥 — sitter, senior, future vet",recoveredAt:"2025-12-02T20:30:00",batteryStart:46,wallpaperHue:305,lockScreenNotifications:[{appId:"messages",title:"Mom",preview:"Madison Amara. It is 2am. You call me RIGHT NOW.",targetId:"c8-th-mom"},{appId:"messages",title:"The Wexlers (SitterTrust)",preview:"The kids miss you already. Same time next week?",targetId:"c8-th-wexler"},{appId:"messages",title:"Zoe 🧃",preview:"did you check the thing I sent. maddie. CHECK THE THING",targetId:"c8-th-zoe"}]},messages:[{id:"c8-th-mom",contactName:"Mom",contactNumber:"(313) 555-0119",messages:[{id:"c8-m-mo-1",from:"them",text:"New family tonight? Text me the address like always.",timestamp:"2025-10-18T16:00:00"},{id:"c8-m-mo-2",from:"owner",text:"the wexlers, 1207 fernway lane. app-verified, mom. green badge and everything. $30/hr!!",timestamp:"2025-10-18T16:10:00",evidenceLabel:"She sent her mom the address, like always — trusting the green badge"},{id:"c8-m-mo-3",from:"them",text:"$30?? What do these people do?",timestamp:"2025-10-18T16:12:00"},{id:"c8-m-mo-4",from:"owner",text:"'consulting.' rich people are vague, mom. their loss my college fund",timestamp:"2025-10-18T16:15:00"},{id:"c8-m-mo-5",from:"them",text:"You're quiet about the Wexler sits lately. Everything okay with them?",timestamp:"2025-11-20T18:30:00"},{id:"c8-m-mo-6",from:"owner",text:"yeah. they're just… a quiet family. I'll tell you about it sunday. it's probably nothing. I want it to be nothing",timestamp:"2025-11-20T18:47:00",evidenceLabel:"“I'll tell you about it sunday… I want it to be nothing” — Sunday never came"},{id:"c8-m-mo-7",from:"them",text:"Madison Amara. It is 2am. You call me RIGHT NOW.",timestamp:"2025-11-30T02:01:00"}]},{id:"c8-th-wexler",contactName:"The Wexlers (SitterTrust)",messages:[{id:"c8-m-wx-1",from:"them",text:"Hi Maddie! We saw your lovely profile. Our twins, Emmy and Jonah (6), need a regular sitter. Saturdays, 7pm on. We pay $30/hr — good sitters are worth it. The lockbox code is on the app. — Kara W.",timestamp:"2025-10-16T13:00:00"},{id:"c8-m-wx-2",from:"them",text:"One house rule, and it's important: the twins will already be asleep when you arrive. Please don't check on them — Emmy wakes if the door so much as breathes, and then nobody sleeps. Just be present downstairs. That's what we're paying for. 🙂",timestamp:"2025-10-16T13:05:00",evidenceLabel:"The one house rule: never check on the children"},{id:"c8-m-wx-3",from:"owner",text:"of course! I'll be quiet as a mouse. see you saturday!",timestamp:"2025-10-16T13:20:00"},{id:"c8-m-wx-4",from:"them",text:"We're running late, don't wait up for us — cash is under the blue vase, plus extra. You're wonderful. The kids already feel safer with you in the house. — K",timestamp:"2025-10-18T22:40:00",evidenceLabel:"The parents were always “running late” — she never once met them"},{id:"c8-m-wx-5",from:"owner",text:"no problem! it was a quiet night. I didn't hear a peep from the twins 🙂",timestamp:"2025-10-18T23:55:00"},{id:"c8-m-wx-6",from:"them",text:"They're heavy sleepers. It runs in the family.",timestamp:"2025-10-18T23:57:00"},{id:"c8-m-wx-7",from:"owner",text:"quick q — Emmy left a drawing on the stairs I think? should I put it in her room?",timestamp:"2025-11-15T21:30:00"},{id:"c8-m-wx-8",from:"them",text:"Leave it exactly where it is, please. Emmy has a system. Do not go upstairs, Maddie. We discussed the rule. We'd hate to lose you over the rule.",timestamp:"2025-11-15T21:31:00",evidenceLabel:"One question about the stairs — answered in sixty seconds: “We'd hate to lose you over the rule.”"},{id:"c8-m-wx-9",from:"them",text:"Big ask: we need an overnight, Sat the 29th. Double rate, triple tip. The twins asked for you specifically. Jonah drew you. You're family now, Maddie.",timestamp:"2025-11-24T10:00:00",evidenceLabel:"The overnight booking: “The twins asked for you specifically… You're family now.”"},{id:"c8-m-wx-10",from:"them",text:"The kids miss you already. Same time next week?",timestamp:"2025-11-30T09:00:00",evidenceLabel:"Sent the morning after she vanished: “The kids miss you already.”"}]},{id:"c8-th-zoe",contactName:"Zoe 🧃",contactNumber:"(313) 555-0164",ghostTypingAfterSeconds:380,messages:[{id:"c8-m-zo-1",from:"them",text:"how are the ghost kids lmao. still asleep?",timestamp:"2025-11-01T22:15:00"},{id:"c8-m-zo-2",from:"owner",text:"FIVE SITS zoe. five. I have never heard a toilet flush in that house. the parents text the SECOND I wonder anything. it's like the house can hear me think",timestamp:"2025-11-01T22:20:00",evidenceLabel:"Five sits: she never heard a single sound of another person in the house"},{id:"c8-m-zo-3",from:"them",text:"ok that's not a family that's a terrarium and you're the exhibit. QUIT",timestamp:"2025-11-01T22:22:00"},{id:"c8-m-zo-4",from:"owner",text:"it's $30 an hour and they asked me to install a bedtime app for the kids. 'StoryTime.' it plays ocean sounds through the house speakers. the house has SPEAKERS zoe. condemned houses with surround sound",timestamp:"2025-11-08T23:10:00",evidenceLabel:"The “mom” had her install a bedtime app that plays through the empty house's speakers"},{id:"c8-m-zo-5",from:"them",text:"WAIT. condemned??? what do you mean condemned",timestamp:"2025-11-08T23:12:00"},{id:"c8-m-zo-6",from:"owner",text:"found a notice under the doormat. 2023. I'm telling myself it's old paperwork. rich people buy condemned houses and fix them right?? right",timestamp:"2025-11-08T23:20:00"},{id:"c8-m-zo-7",from:"them",text:"I searched the address. maddie there was a FIRE. nobody bought it. it's on the county condemned list TODAY. I'm sending you the link. do not go back. did you check the thing I sent. maddie. CHECK THE THING",timestamp:"2025-11-28T21:40:00",evidenceLabel:"Zoe found it: the house is on the county condemned list — currently"},{id:"c8-m-zo-8",from:"owner",text:"I checked it. I'm going tomorrow anyway BUT LISTEN — one last sit, I leave the app running, I get proof, and then we call the police with a FOLDER not a feeling. I have a plan and a bus schedule and I'm not stupid",timestamp:"2025-11-28T22:30:00",evidenceLabel:"Her plan for the overnight: get proof, then go to the police — “a folder, not a feeling”"},{id:"c8-m-zo-9",from:"them",text:"maddie??? you said you'd text at midnight. it's 12:40",timestamp:"2025-11-30T00:40:00"}]},{id:"c8-th-sittertrust",contactName:"SitterTrust",messages:[{id:"c8-m-st-1",from:"them",text:"SitterTrust: Congrats Maddie! You're a TOP SITTER 🌟 Your sitter ID #4471 now shows a gold ring. Families love you!",timestamp:"2025-10-25T12:00:00",evidenceLabel:"Her sitter ID: #4471"},{id:"c8-m-st-2",from:"owner",text:"How do you verify families? The Wexler family — can you confirm their ID check? Something feels off.",timestamp:"2025-11-21T16:00:00"},{id:"c8-m-st-3",from:"them",text:"SitterTrust: Great question! Families with the green badge completed identity verification at signup. For privacy, we can't share details. Rest assured: your safety is our #1 priority! 💛",timestamp:"2025-11-21T16:02:00",evidenceLabel:"The app's answer to “something feels off”: rest assured"},{id:"c8-m-st-4",from:"owner",text:"Can you at least tell me WHEN they verified?",timestamp:"2025-11-21T16:05:00"},{id:"c8-m-st-5",from:"them",text:"SitterTrust: The Wexler family account was verified in 2021 via a legacy vendor. Those records are unavailable. Anything else we can help with? 💛",timestamp:"2025-11-21T16:06:00",evidenceLabel:"“Verified in 2021 via a legacy vendor. Those records are unavailable.”"},{id:"c8-m-st-6",from:"them",text:"SitterTrust: New booking request! THE WEXLERS — Sat Nov 29, overnight. Rate: $60/hr. Accept?",timestamp:"2025-11-24T10:01:00"}]},{id:"c8-th-calloway",contactName:"Mrs. Calloway",contactNumber:"(313) 555-0146",messages:[{id:"c8-m-ca-1",from:"them",text:"Maddie you're a lifesaver. The boys are STILL talkin 30:00",evidenceLabel:"Her sit-by-sit log of everything wrong at Fernway Lane",body:`keeping notes like for the calloways, except these are getting weird so now they're EVIDENCE-flavored notes.

sit 1 (oct 18) — normal? big clean house. kids asleep. parents 'late,' cash under vase, $40 extra.

sit 2 (oct 25) — the mantle photos. twins wear the same clothes in EVERY photo. also every photo is the same three poses. also I found no toys. a six-year-old lives here and there are no toys.

sit 3 (nov 1) — no toilet flush, no snore, no white noise machine, NOTHING. texted zoe. she said terrarium. can't stop thinking the word terrarium.

sit 4 (nov 8) — 'storytime' app request. ocean sounds through ceiling speakers. found the county notice under the mat. googled nothing because I didn't want to know yet. that's on me.

sit 5 (nov 15) — the drawing on the stairs. it was NOT there when I arrived. I walked past those stairs nine times. then it was there. kara texted about it 60 seconds after I picked it up. there is no camera I can see. there is definitely a camera I can't.

nov 23 — mrs. calloway asked who these people ARE and I realized: I know their venmo, their vase, their wifi password. I have never heard their voices. I've never seen the twins blink. because I've never seen the twins.

sat is the overnight. I'm going. proof, then police, then never again. locking the plan in the pink note. code is my number — the one the app gave me. I'm a number to them anyway.`},{id:"c8-n-locked",title:"pink note 🔒",timestamp:"2025-11-28T23:50:00",lock:{code:"4471",hintText:"“code is my number — the one the app gave me. I'm a number to them anyway.”",clueSourceIds:["c8-th-sittertrust","c8-ph-profile"]},evidenceLabel:"The pink note: her plan for the overnight, and her exits",body:`PLAN. because zoe's right and I'm going in smart or not at all.

1. arrive 7pm like normal. text mom the address AGAIN (paper trail).
2. storytime app stays running — if it's what I think it is, it's recording, and recordings go both ways. leave it logged in. let them keep their own receipts.
3. midnight: text zoe the code word (jacaranda). 12:05: 'bathroom' → check ONE thing: the basement door. it's the only door with a new lock in a condemned house. new locks protect something. condemned houses have nothing. so.
4. if ANYTHING is wrong: back door (I unlocked the storm latch on sit 4, they never fixed it — noted), through the yard gap behind the azaleas, down to the 9 bus. NOT home. home address is on the app and I don't know who reads the app. crossroads shelter takes minors no questions. call mom from their desk phone.
5. phone gets LEFT. it's the app's eyes. you don't bring the eyes.

if someone else is reading this: I left on my own feet. look for me at shelters, not in lakes. and check the storytime app. it goes both ways.

— m. (future vet, current genius, hopefully)`},{id:"c8-n-college",title:"college fund math 🎓",timestamp:"2025-11-10T17:00:00",evidenceLabel:"Her college fund: $2,340 saved — untouched after she vanished",body:`saved: $2,340

cash. The driver remembers a girl without a coat who asked him not to announce her stop.",evidenceLabel:"The 11:58 PM bus: one youth fare, cash — a girl without a coat"}],browserHistory:[{id:"c8-b-family",query:"wexler family fernway lane",timestamp:"2025-11-08T23:30:00",evidenceLabel:"Her search for the family: no Wexlers, anywhere, ever"},{id:"c8-b-fire",query:"1207 fernway lane fire 2023",timestamp:"2025-11-28T21:50:00",evidenceLabel:"The night before: she read about the fire"},{id:"c8-b-verify",query:"sittertrust how do families get verified badge",timestamp:"2025-11-21T15:50:00"},{id:"c8-b-quiet",query:"is it normal to never hear kids at all during babysitting",timestamp:"2025-11-01T23:00:00"},{id:"c8-b-address",query:"can a babysitting app share my home address with families",timestamp:"2025-11-28T22:00:00",evidenceLabel:"“can a babysitting app share my home address with families” — it can. It did."},{id:"c8-b-speakers",query:"storytime app what permissions does it need microphone why",timestamp:"2025-11-09T00:15:00"},{id:"c8-b-shelter",query:"crossroads youth shelter hours minors no id",timestamp:"2025-11-28T22:20:00",evidenceLabel:"She researched the shelter — the night BEFORE the overnight. She had her exit planned."},{id:"c8-b-bus",query:"route 9 last bus saturday night",timestamp:"2025-11-28T22:25:00"},{id:"c8-b-disappear",query:"how to stay hidden from someone who knows your address",timestamp:"2025-11-28T22:40:00",evidenceLabel:"Her last search: how to stay hidden from someone who knows your address"}],hiddenApp:{disguiseIcon:"clock",disguiseLabel:"StoryTime",revealAfterClueIds:["c8-th-zoe","c8-n-sitlog"],title:"StoryTime — Console",heading:"Signed in as: QUIETMAN",body:`The bedtime app 'Kara' asked her to install. It plays ocean sounds through the house's speakers. That is the only true thing about it.

It goes both ways. She knew. She left it logged in on purpose.`,entries:[{label:"1207 Fernway — Living Rm",status:"● LIVE",detail:"archive: 5 sits · 31 hrs"},{label:"1207 Fernway — Stairs",status:"● LIVE",detail:"event flagged: 'the drawing' 11/15"},{label:"1207 Fernway — Basement",status:"● LIVE",detail:"operator station · do not schedule"},{label:"Sitter #4471 — audio",status:"ARCHIVED",detail:"phone mic · 31 hrs · consent: app EULA §22"},{label:"Sitter #3306",status:"CONCLUDED 2024",detail:"'the Harmons' · 7 sits"},{label:"Sitter #2189",status:"CONCLUDED 2022",detail:"'the Boyds' · 9 sits"},{label:"Sitter #4471",status:"INTERRUPTED",detail:"checked the basement · exit: rear · status: OPEN"}],footer:"Three families. Three names. One operator, one condemned house, one console. Sitters #3306 and #2189 are 'concluded.' Maddie is 'interrupted — status OPEN.' She left the console logged in and running: the folder she promised. It recorded him too.",evidenceLabel:"The StoryTime console: operator QUIETMAN, three invented families, two “concluded” sitters — Maddie “INTERRUPTED”"},liveEvents:[{id:"c8-live-booking",kind:"notification",afterSeconds:320,title:"SitterTrust",body:"New booking request! THE WEXLERS — Saturday, overnight. Accept?",glitch:!0},{id:"c8-live-unknown",kind:"message",afterSeconds:600,threadId:"c8-th-unknown",message:{id:"c8-m-un-live",from:"them",text:"are you the police? her mother? it doesn't matter. the saturday is open. the saturday is always open.",timestamp:"2025-12-02T20:40:00",evidenceLabel:"To whoever holds the phone: “the saturday is always open.”"}}],verdicts:[{id:"c8-v-runaway",label:"A seventeen-year-old ran away",description:"School pressure, a secretive 'family,' cash income her mom never saw. Teenagers leave. Most come back.",requiredEvidenceIds:["c8-m-mo-6","c8-n-college","c8-pin-buses"],isCanon:!1,epilogue:`You write it as a runaway and the file quietly hates you for it. Runaways take their phones. Runaways take their college fund — hers sits untouched. Runaways don't leave a locked note that begins 'PLAN' and ends with where to look for them.

The one true thing in this verdict: she did get on a bus, and she did it on her own two feet. But 'ran away' and 'escaped' are different words, and the difference is the man the report declines to go looking for.

The Wexler account books three more sitters in the spring. SitterTrust approves them all. The green badge glows like a porch light on a dead street.`},{id:"c8-v-escaped",label:"There was never a family — and she beat him",description:"A predator built the Wexlers out of a condemned house and an app's green badge. Maddie figured it out, planned her exit, and walked out his back door before the trap closed.",requiredEvidenceIds:["case-08.hidden","c8-n-locked","c8-ph-basement","c8-b-shelter","c8-pin-buses"],isCanon:!0,epilogue:`Your report tells it in her own structure, because her structure was better than yours: a plan, numbered. She suspected by sit three, confirmed by sit five, and walked into the overnight with a paper trail, an unlatched storm door, a memorized bus schedule, and a shelter that takes minors, no questions. At 11:48 PM she opened the basement door and saw the monitors. Ninety seconds later she was through the azaleas. The phone — the app's eyes — she left face down on his floor, still recording him.

Eight days later, a desk phone at a youth shelter two counties away calls her mother. The first word is 'jacaranda.' The call lasts an hour. Maddie comes home in January, after the arrest — because there is an arrest: the StoryTime console she deliberately left running captured the operator returning, packing the staged furniture, and speaking to the empty twins' room in two practiced voices. A 54-year-old former property inspector who knew which houses stayed empty. Sitters #2189 and #3306 are reopened as cases. One is found. One is not.

What the report can't file: the voicemail from the dead landline, two children whispering on a track the app never shipped. The operator's lawyer plays it in court to argue the recordings are unreliable. The judge allows the argument. The jury convicts him anyway — jurors, afterward, all mention the same thing: he never once asked what happened to the girl. He only asked, twice, whether the Saturday booking was still marked open.

Maddie testified from behind a screen. She's going to be a vet. Dogs are worth 80 years.`},{id:"c8-v-app",label:"SitterTrust built the trap",description:"A 'verified' badge from a vendor whose records vanished, an app that hands out sitters' addresses, a safety team that answers fear with emoji.",requiredEvidenceIds:["c8-m-st-5","c8-b-address","c8-m-st-3"],isCanon:!1,epilogue:`You write the institutional verdict: the platform sold trust it never manufactured. The 'legacy vendor' that verified the Wexlers in 2021 turns out to be a dissolved LLC that verified 40,000 accounts in eighteen months, sight unseen, for $1.99 each. The green badge is a graphic. It was always a graphic.

SitterTrust settles the class action with badge-design changes and a safety center full of stock photography. Their CEO tells a podcast the Fernway case was 'a powerful learning.' The word 'Maddie' does not appear in the episode.

Everything in this verdict is true. It's just not the whole animal — the badge didn't stage the living room, or print the photos, or practice the voices. The badge only opened the door. Somebody still has to be standing behind it. Your report names the door and lets the man behind it keep his shadow, and that's why, alone at night, you don't reread this one.`},{id:"c8-v-twins",label:"Emmy and Jonah are real — somehow",description:"A drawing that appeared on stairs no one climbed. Children's voices on a dead line. A review: “she finally checked.”",requiredEvidenceIds:["c8-ph-drawing","c8-vm-monitor","c8-ph-mantle"],isCanon:!1,epilogue:`You write the verdict no one assigns you: something in that house played the children. Not the operator — his console logs every sound he ever piped through the speakers, and the whispers on the dead landline aren't in them. The drawing isn't in them. He was interrogated about the drawing and asked for a lawyer, and the detective who was in the room says he didn't ask like a guilty man. He asked like a scared one.

Fire records list two adult occupants in 2023, no children. County records before the renumbering are water-damaged, which is a sentence you've read in too many files lately.

The house is demolished in the spring. The lot stays empty. The neighbor across the street — the only occupied house left — puts her porch light on a timer, off at ten, every night, religiously. Asked why, she says the same thing three times, to three different canvassers: 'So nobody thinks it's for them.'

Maddie is home and safe and did everything right. That's the file's official comfort. Unofficially: on her first night back, her mother heard her cross the hall and lock her bedroom door — and from inside, very quietly, say 'goodnight' twice.`}]},Gt=Object.freeze(Object.defineProperty({__proto__:null,default:Vt},Symbol.toStringTag,{value:"Module"})),Ut={id:"case-09",title:"Neighborhood Watch",victimName:"Hal Brennan, 45",summary:"A cul-de-sac dad joined the anonymous neighborhood watch and finally felt useful: sectors, badge numbers, tips about everyone on the street. He filed 214 reports on his neighbors. He never asked who was filing the reports on him — until the night his own schedule arrived in his inbox, formatted like all the others.",intake:`SUBJECT: Brennan, Harold D. (45). Reported missing by his wife Dec 10, returning from her sister's to an empty house — doors locked, alarm set, car in garage, dinner half-eaten on the table.

DEVICE: Recovered Dec 10 from the kitchen counter. Battery 67%. Beside it: subject's reflective watch vest, folded; his logbook missing from its shelf (outline in dust preserved).

CANVASS: All fourteen households on Maplecrest Court interviewed. All fourteen gave materially identical statements, including three identical phrasings: 'Hal kept to himself lately,' 'we watch out for each other here,' and 'the street has never been safer.' No household reports seeing or hearing anything on the night of Dec 9.

NOTES: The 'Maplecrest Watch' tip line number traces to no carrier, no VOIP provider, and no registration. The HOA denies operating a watch. The HOA's own meeting minutes reference the watch 41 times.

Second-pass review requested. Recommend interviewers do not park on the court itself.`,contentWarningLevel:2,phone:{ownerLabel:"HAL B — Maplecrest Watch, Sector 4",recoveredAt:"2025-12-11T21:00:00",batteryStart:67,wallpaperHue:95,lockScreenNotifications:[{appId:"messages",title:"Dana ❤",preview:"Home Sunday. Sister says hi. Eat a vegetable, Harold.",targetId:"c9-th-dana"},{appId:"messages",title:"Maplecrest Watch",preview:"SUBJECT: BRENNAN, HAL. Begins tonight.",targetId:"c9-th-watch"},{appId:"phone",title:"Voicemail",preview:"Maplecrest Watch · 0:48",targetId:"c9-vm-schedule"}]},messages:[{id:"c9-th-watch",contactName:"Maplecrest Watch",messages:[{id:"c9-m-wa-1",from:"them",text:"Welcome, volunteer. You are SECTOR 4, BADGE 12. The street thanks you. Tips are anonymous. Tips are mandatory. One per week keeps your standing current.",timestamp:"2025-08-04T21:00:00",evidenceLabel:"The Watch's welcome: Sector 4, Badge 12 — “tips are anonymous. tips are mandatory.”"},{id:"c9-m-wa-2",from:"owner",text:"Happy to help keep the street safe. What kind of tips are useful?",timestamp:"2025-08-04T21:15:00"},{id:"c9-m-wa-3",from:"them",text:"Everything is useful. Departures. Arrivals. Lights. Deliveries. Guests. Habits are the fence, volunteer. A street that knows its habits cannot be surprised.",timestamp:"2025-08-04T21:16:00",evidenceLabel:"“Habits are the fence. A street that knows its habits cannot be surprised.”"},{id:"c9-m-wa-4",from:"them",text:"TIP DIGEST W/E 10/12 — MELTON (4407): departs 2:10am Tuesdays, returns 4am, headlights off. VU (4411): new visitor, gray coupe, stays past midnight. CARSON (4402): garage light left on 6 nights. Note and normalize.",timestamp:"2025-10-12T20:00:00",evidenceLabel:"A weekly digest: every household's habits, distributed to every volunteer"},{id:"c9-m-wa-5",from:"owner",text:"Filed 6 this week. Also — who compiles the digest? Asking so I can flag a correction.",timestamp:"2025-11-02T20:30:00"},{id:"c9-m-wa-6",from:"them",text:"The digest compiles. Corrections are not necessary. The digest has never been wrong.",timestamp:"2025-11-02T20:31:00",evidenceLabel:"“The digest compiles.” — no compiler, no corrections"},{id:"c9-m-wa-7",from:"owner",text:"I want to step back from the watch for a while. Dana's away and I'm behind at work. No hard feelings.",timestamp:"2025-11-30T19:00:00",evidenceLabel:"Nov 30: Hal tried to quit the Watch"},{id:"c9-m-wa-8",from:"them",text:"Standing noted as LAPSED. Volunteers do not step back, volunteer. Sectors do not unwatch. You know our habits now. Now we are even.",timestamp:"2025-11-30T19:01:00",evidenceLabel:"“Sectors do not unwatch. You know our habits now. Now we are even.”"},{id:"c9-m-wa-9",from:"them",text:"SUBJECT: BRENNAN, HAL. Begins tonight.",timestamp:"2025-12-02T21:00:00",evidenceLabel:"Dec 2: his own name arrives, formatted like every tip he ever filed"}]},{id:"c9-th-dana",contactName:"Dana ❤",contactNumber:"(614) 555-0151",messages:[{id:"c9-m-da-1",from:"them",text:"Landed at Carol's. Three weeks of casseroles and complaining, pray for me. Love you.",timestamp:"2025-11-18T15:00:00"},{id:"c9-m-da-2",from:"owner",text:"pray for CAROL. love you more. house is fine, street is fine, everything's fine",timestamp:"2025-11-18T15:20:00"},{id:"c9-m-da-3",from:"them",text:"You said 'fine' three times, Harold.",timestamp:"2025-11-18T15:22:00"},{id:"c9-m-da-4",from:"owner",text:"the watch thing got weird. I tried to quit. dana they knew you were at carol's. I never told the tip line that. I never told ANYONE that except gary",timestamp:"2025-12-03T22:15:00",evidenceLabel:"The Watch knew Dana was away — Hal had told exactly one person"},{id:"c9-m-da-5",from:"them",text:"Then Gary told them. Harold. Come stay at Carol's. I mean it. TONIGHT.",timestamp:"2025-12-03T22:20:00"},{id:"c9-m-da-6",from:"owner",text:"and leave the house dark for them? no. a dark house is a tip, dana. I'm going to sit in my lit living room like a man who has done nothing wrong. because I haven't. mostly. I'll explain sunday",timestamp:"2025-12-03T22:31:00",evidenceLabel:"“a dark house is a tip” — he stayed to keep the lights on"},{id:"c9-m-da-7",from:"them",text:"Home Sunday. Sister says hi. Eat a vegetable, Harold.",timestamp:"2025-12-08T18:00:00"}]},{id:"c9-th-gary",contactName:"Gary (4409)",contactNumber:"(614) 555-0177",ghostTypingAfterSeconds:390,messages:[{id:"c9-m-ga-1",from:"them",text:"poker thursday. bring the good chips not the sad chips",timestamp:"2025-11-13T17:00:00"},{id:"c9-m-ga-2",from:"owner",text:"gary. straight answer. are you on the watch?",timestamp:"2025-12-03T21:00:00"},{id:"c9-m-ga-3",from:"them",text:"everybody's on the watch, hal.",timestamp:"2025-12-03T21:20:00",evidenceLabel:"Gary: “everybody's on the watch, hal.”"},{id:"c9-m-ga-4",from:"owner",text:"I'm not asking everybody. I'm asking the guy who's had a key to my house for ten years",timestamp:"2025-12-03T21:22:00"},{id:"c9-m-ga-5",from:"them",text:"and in ten years has anything ever happened to your house? you're welcome. that's the watch. that's ALL the watch is. stop pulling the thread hal. the sweater is the street",timestamp:"2025-12-03T21:30:00",evidenceLabel:"“stop pulling the thread. the sweater is the street.”"},{id:"c9-m-ga-6",from:"owner",text:"who filed on the meltons, gary? the 2am tuesdays? because I checked. dave melton drives his mother to dialysis. that's the 2am. we put DIALYSIS in a digest",timestamp:"2025-12-05T23:40:00",evidenceLabel:"The Meltons' 2 AM “suspicious departures” were dialysis runs — Hal checked"},{id:"c9-m-ga-7",from:"them",text:"you filed on the meltons, hal. august 12th. tip #9. you want me to read you your own words?",timestamp:"2025-12-05T23:44:00",evidenceLabel:"Gary's answer: HAL filed the Melton tip himself — August, tip #9"},{id:"c9-m-ga-8",from:"owner",text:"…that's not. I filed LIGHTS. I filed a light being on",timestamp:"2025-12-05T23:46:00"},{id:"c9-m-ga-9",from:"them",text:"it all goes in the same digest, buddy. see you thursday. bring the good chips",timestamp:"2025-12-05T23:47:00"}]},{id:"c9-th-hoa",contactName:"Maplecrest HOA Board",messages:[{id:"c9-m-ho-1",from:"them",text:"Patrice: Reminder! Holiday lights go UP the 1st and DOWN the 26th per covenant 11.3. The street looks best when we all match! 🎄",timestamp:"2025-11-28T10:00:00"},{id:"c9-m-ho-2",from:"owner",text:"Question for the board: does the HOA run the Maplecrest Watch? Yes or no. It's a simple question.",timestamp:"2025-12-04T09:00:00"},{id:"c9-m-ho-3",from:"them",text:"Patrice: The HOA has no affiliation with any watch program! That said, participation reflects wonderfully in your standing review. Happy holidays! 🎄",timestamp:"2025-12-04T09:15:00",evidenceLabel:"The HOA: no affiliation with the Watch — which “reflects wonderfully in your standing review”"},{id:"c9-m-ho-4",from:"them",text:"Patrice: Hal, your lawn was looking shaggy so the street took care of it while you were out Tuesday! No charge. Neighbors helping neighbors! 🌱",timestamp:"2025-12-07T16:00:00",evidenceLabel:"“the street took care of it while you were out” — he wasn't out Tuesday. He was home."}]},{id:"c9-th-abby",contactName:"Abby (college!)",contactNumber:"(614) 555-0128",messages:[{id:"c9-m-ab-1",from:"them",text:"dad I need $40 and emotional support, in that order",timestamp:"2025-11-20T13:00:00"},{id:"c9-m-ab-2",from:"owner",text:"sent $60. the extra $20 is emotional support in its most useful form",timestamp:"2025-11-20T13:10:00"},{id:"c9-m-ab-3",from:"them",text:"dad why did a 'maplecrest watch' account follow my campus insta. dad what is a maplecrest watch",timestamp:"2025-12-06T22:00:00",evidenceLabel:"The Watch followed his daughter's college account — 200 miles away"},{id:"c9-m-ab-4",from:"owner",text:"block it. don't post your class schedule. I'll handle this abby. it's a neighborhood thing and it stays in the neighborhood if I handle it",timestamp:"2025-12-06T22:10:00",evidenceLabel:"“it stays in the neighborhood if I handle it” — three days before he vanished"}]},{id:"c9-th-melton",contactName:"Dave Melton (4407)",contactNumber:"(614) 555-0193",messages:[{id:"c9-m-me-1",from:"owner",text:"Dave, it's Hal from 4405. This is overdue: I owe you an apology. I'd like to give it in person. Also there's something about the street you deserve to know.",timestamp:"2025-12-08T17:30:00",evidenceLabel:"Dec 8: Hal arranged to apologize to Melton and tell him “something about the street”"},{id:"c9-m-me-2",from:"them",text:"Wednesday, my porch, 7pm. Bring whatever this is about written down. I like paper.",timestamp:"2025-12-08T18:00:00"},{id:"c9-m-me-3",from:"them",text:"It's Wednesday. Porch light's on for you.",timestamp:"2025-12-10T19:05:00",evidenceLabel:"Melton waited on his porch. Hal was already gone."}]},{id:"c9-th-brother",contactName:"Russ (brother)",contactNumber:"(614) 555-0136",messages:[{id:"c9-m-ru-1",from:"them",text:"you sounded off on the phone. this watch club — you were the same way about the model trains. obsessed, then trapped by the other train guys. quit like you quit trains",timestamp:"2025-12-04T20:00:00"},{id:"c9-m-ru-2",from:"owner",text:"the train guys never stood on my lawn at 2am, russ",timestamp:"2025-12-04T20:12:00",evidenceLabel:"“the train guys never stood on my lawn at 2am”"},{id:"c9-m-ru-3",from:"them",text:"I'm sorry, they WHAT",timestamp:"2025-12-04T20:13:00"},{id:"c9-m-ru-4",from:"owner",text:"four of them. facing the house. not moving. I turned the porch light on and they left in four directions. russ they didn't RUN. they dispersed. like a shift ending",timestamp:"2025-12-04T20:20:00",evidenceLabel:"Four figures on his lawn at 2 AM — dispersing “like a shift ending”"}]},{id:"c9-th-hardware",contactName:"Maple True Value",messages:[{id:"c9-m-hw-1",from:"them",text:"MAPLE TRUE VALUE: Your order is ready — 4x motion flood lights, 2x deadbolt, 1x door bar.",timestamp:"2025-12-05T11:00:00",evidenceLabel:"Dec 5: floodlights, deadbolts, a door bar"},{id:"c9-m-hw-2",from:"them",text:" sept — 14 tips. dana says the log is 'a diary about other people's garbage cans.' the street's never been safer though. that's not nothing.

oct — the melton tip came back around in the digest with words I didn't write. 'headlights off.' I never wrote headlights off. someone ADDED to my tip. or someone else is also filing on the meltons. of course someone else is also filing. everyone is filing on everyone. I did the math tonight: 14 houses, one tip a week minimum. that's 728 tips a year about 14 families. we are eating ourselves in weekly installments.

nov — tried to quit. 'sectors do not unwatch.' the digest knew dana was at carol's. only gary knew. so gary files too. of course gary files. gary has had our key for ten years, and I have had the wrong worry for ten years.

dec 2 — my name in the digest. my coffee. my mail. my WINDOW LATCH. reading your own habits in that font does something to your spine. I filed 214 of these. 214 spines.

dec 8 — saw inside gary's garage. it's not gary's operation. gary's folder is in there too, thick as anyone's. there's no head of this thing. that's what I'll tell melton wednesday. the tip line isn't a person. it's the STREET. it's been the street since before us — some of the digest files go back past the subdivision, past the farms. locked the important stuff in the red note. code: sector, then badge.`},{id:"c9-n-locked",title:"red note — for melton",timestamp:"2025-12-09T00:30:00",lock:{code:"0412",hintText:"“code: sector, then badge.” — the vest has both.",clueSourceIds:["c9-ph-vest","c9-n-watchlog"]},evidenceLabel:"The red note: everything he was bringing to Melton's porch",body:`melton — you said bring it written down. here it is written down.

1. the watch is real, the HOA lies, and every house on this court files weekly tips on every other house. mine included. I filed on you. tip #9, august. I'm sorry. you'll hear how sorry on wednesday.

2. there is no leader. I broke into that thought like a house: gary's garage is just the PRINT SHOP. the tip line number doesn't exist. the digest 'compiles.' I've traced tips back through the HOA minutes to 1988, and in the county archive there's a 'road association circular' for this land from 1961 — same format. same phrase. 'note and normalize.' the street was watching when it was a dirt road, dave.

3. what happens to lapsed volunteers: I found three names in old minutes who 'moved away suddenly.' none of them sold their houses. the houses got 'maintained.' the carsons' place? the carsons have been gone since 2019, dave. think about who's been bringing the casseroles.

4. if I don't make it to your porch wednesday: it will look like I left dana. I would never leave dana. check the digest that goes out friday. if it says 4405 is 'maintained,' show this note to someone OFF the street. mail it, don't drive it. they note the cars.

— hal brennan, 4405. sector 4, badge 12. 214 tips. I'm sorry for every one.`},{id:"c9-n-honeydew",title:"before dana's home",timestamp:"2025-12-07T10:00:00",evidenceLabel:"His list for Dana's homecoming — gutters, vacuuming, the yellow flowers",body:`fix gutter clip (north side)

flowers thursday — the yellow ones she pretends not to love

Every house watches. Every house is watched. The ledger does not have an owner. It has a quorum.`,entries:[{label:"4402 — CARSON",status:"MAINTAINED (2019)",detail:"casserole rotation active · file: 122 pp"},{label:"4405 — BRENNAN",status:"MAINTAINED (12/09)",detail:"consensus: 13-0 · file: 214 tips filed, 209 received"},{label:"4407 — MELTON",status:"WATCHED",detail:"porch meeting noted · standing under review"},{label:"4409 — GARY R.",status:"VOLUNTEER · PRINT",detail:"file: thick · everyone's file is thick"},{label:"4411 — VU",status:"WATCHED",detail:"gray coupe: normalized"},{label:"D. BRENNAN (spouse)",status:"PENDING",detail:"waves back: not yet · the street is patient"},{label:"ARCHIVE",status:"1961 — PRESENT",detail:"circulars · farm-era ledgers · 'note and normalize'"}],footer:"Hal filed 214 tips and received 209. The vote on him was 13–0 — fourteen households, minus his own. The archive goes back past the subdivision, past the farms, to when the court was a dirt road with four houses that all faced each other. It has always been a street that knows its habits. It has never once been surprised.",evidenceLabel:"The Digest's ledger: BRENNAN “MAINTAINED 12/09, consensus 13–0” — and Dana marked PENDING"},liveEvents:[{id:"c9-live-digest",kind:"notification",afterSeconds:330,title:"Maplecrest Alerts",body:"TIP DIGEST — SPECIAL: a device at 4405 is being reviewed by someone new. Noted.",glitch:!0},{id:"c9-live-watch",kind:"message",afterSeconds:610,threadId:"c9-th-watch",message:{id:"c9-m-wa-live",from:"them",text:"you hold the phone in your left hand. you read the long messages twice. welcome, volunteer. your sector will be assigned.",timestamp:"2025-12-11T21:11:00",evidenceLabel:"The Watch, to whoever reads the phone: “welcome, volunteer. your sector will be assigned.”"}}],verdicts:[{id:"c9-v-left",label:"He walked out on his life",description:"A marriage under strain, an obsession his wife mocked, a brother saying quit. Men his age disappear into new lives every day.",requiredEvidenceIds:["c9-m-da-6","c9-b-movers","c9-n-honeydew"],isCanon:!1,epilogue:`Midlife departure: the mover quotes, the strained calls, the obsessive little log. You can build it. You can even almost believe it, until you re-read the honey-do list — gutter clip, vacuum, the yellow flowers she pretends not to love. Men leaving their wives do not schedule the flowers.

Dana never accepts it, and Dana turns out to be right in the worst available way: in February the 'watch' account that followed Abby's campus page posts a photo. It's the yellow flowers, in a vase, on a kitchen table. Not Dana's kitchen. Nobody can identify the kitchen.

The post is deleted in nine minutes. The account has never posted before or since. Your report stays filed under voluntary departure. You keep a printout of the photo in the folder anyway, because somewhere a kitchen has his flowers in it, and 'voluntary' has to live with that.`},{id:"c9-v-street",label:"The street maintained him",description:"Fourteen households, weekly quorums, a digest with no compiler — and a unanimous vote the night the chair was pushed in.",requiredEvidenceIds:["case-09.hidden","c9-n-locked","c9-ph-owntip","c9-vm-schedule","c9-cal-quorum"],isCanon:!0,epilogue:`Your report names all thirteen voting households and charges none of them, because there is nothing chargeable in the file: no body, no blood, no witness who is not also a suspect, and a street full of people with the same calm sentence — 'we watch out for each other here.' The red note reaches Melton's hands and then the county prosecutor's, and it is the most complete map of the machine anyone will ever draw: the tips, the print shop, the casserole rotation, the maintained houses, the archive going back to dirt.

What the prosecution cannot survive is the thing Hal found first: there is no head. Gary's folder is thick. Patrice's folder is thick. The digest compiles. You cannot indict a habit that fourteen households keep for each other, and the habit knows it.

Dana sells the house in the spring — to a young couple the listing agent describes as 'lovely, cash, very community-minded.' The Watch account unfollows Abby the day escrow closes. The street's file on the Brennans, presumably, is marked closed.

Melton mails the note's copies to three newspapers, from three mailboxes, in three towns, exactly as instructed. One prints it. The comment section fills, within hours, with hundreds of replies from suburbs across the country, and the most-liked comment — posted by an account with a house number for a name — says only: 'Every street has a digest. Yours is just politer about it.' The paper takes the story down that weekend. 'Note and normalize,' the editor says, when asked why. He doesn't know why he chose those words.

Hal Brennan filed 214 tips. His last act was an apology, written down, delivered late. Your report ends by entering it into the record in full, because someone on that street should finally have their words kept the way they meant them.`},{id:"c9-v-gary",label:"Gary handled it personally",description:"The key, the garage, the print shop, ten years of access — and a poker invitation two days after the vote.",requiredEvidenceIds:["c9-ph-garage","c9-m-ga-7","c9-m-da-4"],isCanon:!1,epilogue:`The best friend with the key: you interview Gary four times, and Gary cries in two of them, and both times the tears read true. Yes, the garage is the print shop — he inherited the job from the last guy at 4409, who inherited it from the guy before. No, he doesn't know who started it. Yes, he filed on Hal. Hal filed on him. 'That's the street,' he says, and then, quietly, 'that was supposed to be all it was.'

His alibi for quorum night is thirteen neighbors. Of course it is.

The detail that ends the theory is the folded vest. Gary, shown the photo, identifies it before you finish the question — and then goes gray, actually gray, and asks for water. The vests, he explains, get folded and returned to the print shop when a volunteer's standing resolves. He'd printed the labels for years and never asked what 'resolves' meant. There's a bin of them in the garage. You went back and counted. Eleven vests, folded identically, going back decades. Sector 4 has had a lot of badge 12s.`},{id:"c9-v-older",label:"The Watch predates the watchers",description:"A tip line with no carrier. Circulars from 1961. A meeting recorded in a sealed house. Fourteen lamps that all went out at 2:10.",requiredEvidenceIds:["c9-vm-meeting","c9-b-1961","c9-m-wa-6"],isCanon:!1,epilogue:`You write the deep version: the Maplecrest Watch is older than Maplecrest, older than the HOA, older than the pavement — a standing arrangement the land came with, which each generation of neighbors joins believing they invented it. The 1961 circular. The farm-era ledgers Hal found references to. A tip line that no phone company has ever billed, ringing anyway.

The county archivist, who has no reason to humor you, confirms the ugly part: 'road associations' with identical language appear in records for eleven other subdivisions in the region, all built on parcels from the same original land company. The land company dissolved in 1911. Its filings list no officers. Its seal — you have it photographed — is a ring of fourteen small houses, windows filled in by hand.

The report is returned to you unsigned, with a sticky note: 'We live in these neighborhoods too.' You resubmit it once. It comes back the same day.

You live eight miles from Maplecrest Court, on a street with a community app and a welcome barbecue. Last month the digest — your street calls it a 'newsletter' — mentioned that you'd been working late. It was phrased warmly. Everything is phrased warmly. You read it twice, holding your phone in your left hand, and somewhere in the file of you, that was noted.`}]},_t=Object.freeze(Object.defineProperty({__proto__:null,default:Ut},Symbol.toStringTag,{value:"Module"})),Kt={id:"case-10",title:"The Wellness Retreat",victimName:"Farrah Haddad, 34",summary:"A burnt-out nurse surrendered her phone at a no-signal wellness retreat and vanished three days before checkout. Two days after she was declared missing, her phone synced one last batch of photos and voice memos — from a location the retreat says isn't on their property. The phone itself has never been found.",intake:`SUBJECT: Haddad, Farrah N. (34). Booked at Stillpoint Ridge Retreat Oct 26 – Nov 5. Staff state she 'left the program early, on foot, against guidance' on Nov 2. No exit was logged. Reported missing by her sister Nov 8.

DEVICE: NOT RECOVERED. What follows is a court-ordered reconstruction of her device from cloud sync. Final sync: Nov 10, 02:14 — five days after checkout, two days after the missing-person report — containing 9 photos and 3 voice memos. Sync originated from coordinates in an alpine meadow 0.4 miles north of the retreat's marked boundary. Stillpoint's counsel states, in writing, that 'no such meadow exists on or adjacent to the property.' The USGS quad for the area shows the meadow. It has shown the meadow since 1954.

RETREAT: Twelve years operating. Zero negative reviews on any platform. County records show four prior 'early departures, on foot' since 2019. None was reported by the retreat. All four were reported by families, later. Two remain open.

Second-pass review requested. Stillpoint has offered investigators a complimentary weekend. Decline it.`,contentWarningLevel:2,phone:{ownerLabel:"Farrah — if lost return to any ICU, they know me",recoveredAt:"2025-11-12T21:30:00",batteryStart:23,wallpaperHue:158,lockScreenNotifications:[{appId:"messages",title:"Layla (sis)",preview:"the retreat says you LEFT?? farrah answer me. I'm calling everyone.",targetId:"c10-th-layla"},{appId:"messages",title:"Stillpoint Ridge",preview:"Your journey with us is complete. We hope you found what you carried in. 🌿",targetId:"c10-th-stillpoint"},{appId:"phone",title:"Voice memo synced",preview:"north meadow · 1:57",targetId:"c10-vm-memo3"}]},messages:[{id:"c10-th-layla",contactName:"Layla (sis)",contactNumber:"(720) 555-0139",messages:[{id:"c10-m-la-1",from:"them",text:"ten days no phone?? YOU? the woman who charts in her sleep?",timestamp:"2025-10-20T19:00:00"},{id:"c10-m-la-2",from:"owner",text:"that's the point, lay. eleven years of codes and vents and families crying in hallways. I need somewhere my hands aren't needed. somewhere quiet enough to hear whether I still want to be a nurse",timestamp:"2025-10-20T19:20:00",evidenceLabel:"Why she went: “somewhere quiet enough to hear whether I still want to be a nurse”"},{id:"c10-m-la-3",from:"them",text:"ok that broke my heart. go. detox. but memorize my number, actual paper, promise me",timestamp:"2025-10-20T19:22:00"},{id:"c10-m-la-4",from:"owner",text:"paper promise made. if you don't hear from me by checkout+1, that's nov 6, you call the county up there. sheriff, not the retreat. write THAT on paper too",timestamp:"2025-10-20T19:30:00",evidenceLabel:"Her instruction, before going in: “checkout+1… call the county. sheriff, not the retreat.”"},{id:"c10-m-la-5",from:"them",text:"why sheriff not the retreat??",timestamp:"2025-10-20T19:31:00"},{id:"c10-m-la-6",from:"owner",text:"because places with no bad reviews scare me more than places with some. nurse instinct. probably nothing. love you",timestamp:"2025-10-20T19:40:00",evidenceLabel:"“places with no bad reviews scare me more than places with some”"},{id:"c10-m-la-7",from:"owner",text:"IT'S ME. one bar on a ridge, no time. I'm fine but this place is wrong. tomlin from orientation is GONE gone — staff say he 'left early on foot.' his boots are still outside cabin willow. lay, his BOOTS. more soon, battery dying, doing one more hike up here tomorrow night with the phone. don't call the retreat. county. remember",timestamp:"2025-11-01T23:48:00",evidenceLabel:"Her ridge text, Nov 1: Tomlin “left on foot” — his boots still outside his cabin"},{id:"c10-m-la-8",from:"them",text:"FARRAH. leave NOW. drive out tonight. please please please",timestamp:"2025-11-02T07:15:00"},{id:"c10-m-la-9",from:"them",text:"the retreat says you LEFT?? farrah answer me. I'm calling everyone.",timestamp:"2025-11-06T10:00:00"}]},{id:"c10-th-stillpoint",contactName:"Stillpoint Ridge",messages:[{id:"c10-m-sp-1",from:"them",text:"Welcome, Farrah 🌿 Your journey begins Oct 26. Arrival guidance: devices are lovingly kept in the Basket at reception. Guests wear soft colors. Guides go by tree names. Silence hours 9pm–9am are sacred. There is nothing to fear at Stillpoint but what you brought with you.",timestamp:"2025-10-22T10:00:00",evidenceLabel:"The welcome message: the Basket, tree names, sacred silence — “nothing to fear but what you brought”"},{id:"c10-m-sp-2",from:"owner",text:"Quick medical note: I'm an ICU nurse. If any guest ever needs help, I'm happy to assist — I keep a small kit.",timestamp:"2025-10-22T10:30:00"},{id:"c10-m-sp-3",from:"them",text:"How generous! Stillpoint has its own wellness protocols, so your hands can finally rest. Guests who feel unwell visit the Quiet Cabins to restore. You needn't ever think of them again. 🌿",timestamp:"2025-10-22T10:32:00",evidenceLabel:"First mention of the Quiet Cabins: “you needn't ever think of them again.”"},{id:"c10-m-sp-4",from:"them",text:"Farrah, our records show you enjoyed a beautiful integration and departed on foot Nov 2, declining our shuttle. We're holding your belongings with love. Your journey with us is complete. We hope you found what you carried in. 🌿",timestamp:"2025-11-06T09:00:00",evidenceLabel:"The retreat's story, unprompted, in writing: “departed on foot Nov 2, declining our shuttle”"},{id:"c10-m-sp-5",from:"them",text:"A note from our care team: grief is a journey too, Layla. We are holding space for your family. Should you wish to process on-site, sisters of guests receive our compassion rate. 🌿",timestamp:"2025-11-09T11:00:00",evidenceLabel:"Sent to Farrah's phone but addressed to LAYLA — offering her sister the “compassion rate”"}]},{id:"c10-th-tomlin",contactName:"Tomlin (cabin Willow)",contactNumber:"(505) 555-0171",ghostTypingAfterSeconds:400,messages:[{id:"c10-m-to-1",from:"them",text:"farrah! tomlin, from orientation — the guy who asked if decaf was mandatory. trading numbers before the Basket eats our phones. buddy system for the digitally detoxing",timestamp:"2025-10-26T11:30:00"},{id:"c10-m-to-2",from:"owner",text:"buddy system accepted. if I start weaving baskets unironically, stage an intervention",timestamp:"2025-10-26T11:35:00"},{id:"c10-m-to-3",from:"them",text:"deal. same if I start calling the guides by their tree names without laughing. ok phone's going in the Basket. see you on the other side of serenity",timestamp:"2025-10-26T11:58:00",evidenceLabel:"Tomlin's last message before the Basket, Oct 26, 11:58 AM"}]},{id:"c10-th-bex",contactName:"Bex (charge nurse)",contactNumber:"(720) 555-0184",messages:[{id:"c10-m-be-1",from:"them",text:"unit survived day 1 without you. barely. go be a person. that's an order",timestamp:"2025-10-24T20:00:00"},{id:"c10-m-be-2",from:"owner",text:"trying!! packing list says 'soft colors only.' bex I own scrubs and one funeral dress",timestamp:"2025-10-24T20:15:00"},{id:"c10-m-be-3",from:"them",text:"farrah?? your sister called the UNIT looking for you. tell me you're okay",timestamp:"2025-11-07T14:00:00"},{id:"c10-m-be-4",from:"them",text:"I looked up that retreat on the nurse forums like you asked me to back in october. finally found the thread. a hospice nurse went there in 2022. her family's still posting. farrah CALL ME",timestamp:"2025-11-07T18:30:00",evidenceLabel:"Bex found the 2022 thread: a hospice nurse who went to Stillpoint and never came back"}]},{id:"c10-th-mom",contactName:"Mama",contactNumber:"(720) 555-0102",messages:[{id:"c10-m-mo-1",from:"them",text:"Ten days without hearing your voice. I don't like it, hayati, but I understand it. Rest well.",timestamp:"2025-10-25T18:00:00"},{id:"c10-m-mo-2",from:"owner",text:"I'll rest, I promise. and I'll call the second I'm out. keep my plants alive and my father calm, in that order",timestamp:"2025-10-25T18:20:00"},{id:"c10-m-mo-3",from:"them",text:"Your plants are alive. Your father is not calm. It is November 7th, Farrah.",timestamp:"2025-11-07T09:00:00"}]},{id:"c10-th-hr",contactName:"St. Aug Hospital HR",messages:[{id:"c10-m-hr-1",from:"them",text:"St. Augustine HR: Your wellness leave (Oct 24 – Nov 10) is approved. We're proud of you for prioritizing yourself, Farrah!",timestamp:"2025-10-15T12:00:00"},{id:"c10-m-hr-2",from:"them",text:"St. Augustine HR: Reminder — return-to-work paperwork due Nov 10. We can't wait to have you back. 💙",timestamp:"2025-11-08T09:00:00"}]},{id:"c10-th-aspen",contactName:"Aspen (guide)",messages:[{id:"c10-m-as-1",from:"them",text:"Farrah, it's Aspen 🌿 You seemed unsettled after the gratitude circle. The mountain shows people things. If you saw something on your walk that troubled you, bring it to me first. Only to me.",timestamp:"2025-10-31T21:30:00",evidenceLabel:"Guide Aspen, during sacred silence hours: “bring it to me first. Only to me.”"},{id:"c10-m-as-2",from:"owner",text:"How are you texting me? My phone is in the Basket. This phone is in the Basket, Aspen.",timestamp:"2025-11-01T23:52:00",evidenceLabel:"Her reply from the ridge: “How are you texting me? This phone is in the Basket.”"},{id:"c10-m-as-3",from:"them",text:"The Basket keeps things safe, Farrah. It doesn't keep them asleep. Come down from the ridge. The meadow is cold at night.",timestamp:"2025-11-01T23:54:00",evidenceLabel:"Aspen knew she was on the ridge — “the meadow is cold at night.”"}]},{id:"c10-th-pharm",contactName:"Alpine Pharmacy",messages:[{id:"c10-m-ph-1",from:"them",text:"ALPINE RX: Your prescription is ready for pickup.",timestamp:"2025-10-23T11:00:00"},{id:"c10-m-ph-2",from:"them",text:"ALPINE RX: Reminder — prescription will be returned to stock Nov 12.",timestamp:"2025-11-09T11:00:00"}]},{id:"c10-th-bank",contactName:"Summit CU",messages:[{id:"c10-m-bk-1",from:"them",text:"Summit CU: $2,900.00 charged — STILLPOINT RIDGE RETREAT. Reply STOP to opt out of alerts.",timestamp:"2025-10-26T12:10:00"},{id:"c10-m-bk-2",from:"them",text:"Summit CU: $870.00 charged — STILLPOINT RIDGE RETREAT (EXTENDED INTEGRATION). If this wasn't you, call immediately.",timestamp:"2025-11-06T08:00:00",evidenceLabel:"Nov 6: the retreat billed her $870 for an “extended integration” — four days after they say she left"}]},{id:"c10-th-unknown",contactName:"Unknown",messages:[{id:"c10-m-un-1",from:"them",text:"the meadow isn't on our maps because our maps are honest about what belongs to us. she walked past the boundary. what's past the boundary was never ours to fence.",timestamp:"2025-11-10T02:20:00",evidenceLabel:"Six minutes after the final sync: “what's past the boundary was never ours to fence.”"}]}],photos:[{id:"c10-ph-basket",caption:"goodbye phone. into the Basket. my tag is 06 which feels insultingly low for how attached we are",timestamp:"2025-10-26T12:01:00",aspect:"portrait",meta:{takenAt:"2025-10-26T12:01:00",device:"This phone",location:"Stillpoint Ridge — reception"},svg:s('<rect width="300" height="400" fill="#1a1712"/><ellipse cx="150" cy="260" rx="120" ry="70" fill="#3a2f1e"/><ellipse cx="150" cy="240" rx="105" ry="55" fill="#2a2115"/>'+Array.from({length:6},(t,e)=>`<rect x="${85+e%3*50}" y="${210+Math.floor(e/3)*34}" width="30" height="20" rx="4" fill="#10121a" transform="rotate(${-8+e*4} ${100+e%3*50} ${220+Math.floor(e/3)*34})"/>`).join("")+'<rect x="120" y="150" width="60" height="26" rx="4" fill="#cfc7b2" opacity="0.85"/><text x="150" y="168" text-anchor="middle" font-family="monospace" font-size="12" fill="#3a3427">TAG 06</text>',{aspect:"portrait",base:"#13100b",grain:.11}),evidenceLabel:"The Basket at reception — her phone, tag 06"},{id:"c10-ph-cabin",caption:"cabin cedar. no clock, no mirror, no lock on the inside. 'locks are walls we build against ourselves' ok but also against OTHER PEOPLE, aspen",timestamp:"2025-10-26T14:20:00",aspect:"landscape",meta:{takenAt:"2025-10-26T14:20:00",device:"This phone",location:"Stillpoint Ridge"},svg:s('<rect width="400" height="300" fill="#151a14"/><rect x="80" y="110" width="240" height="140" fill="#2a2318"/><path d="M70 110 L200 60 L330 110Z" fill="#1f1a10"/>'+N(170,150,60,100,"#0e0c08")+'<rect x="110" y="140" width="40" height="40" fill="#26303a" opacity="0.6"/><path d="M30 250 Q90 230 150 250 M250 252 Q310 232 370 250" stroke="#101408" stroke-width="10" fill="none"/>',{aspect:"landscape",base:"#101408",grain:.12}),evidenceLabel:"Cabin Cedar: no clock, no mirror — and no lock on the inside"},{id:"c10-ph-schedule",caption:"the daily rhythm board. note there is no hour labeled 'free.' every hour is a NAMED hour",timestamp:"2025-10-27T09:15:00",aspect:"portrait",meta:{takenAt:"2025-10-27T09:15:00",device:"This phone"},svg:s('<rect width="300" height="400" fill="#171410"/><rect x="45" y="50" width="210" height="300" rx="6" fill="#d3cab4" opacity="0.9"/><text x="150" y="85" text-anchor="middle" font-family="serif" font-size="13" fill="#3a3427">THE RHYTHM 🌿</text>'+["6a WAKING","7a MOVEMENT","9a NOURISH","11a GRATITUDE","1p LISTENING","3p WALKING","5p NOURISH","7p CIRCLE","9p SILENCE"].map((t,e)=>`<text x="65" y="${115+e*25}" font-family= " fill="#0f130c"/>'+Array.from({length:3},(t,e)=>`<rect x="${50+e*120}" y="130" width="90" height="90" fill="#151009"/><path d="M${44+e*120} 130 L${95+e*120} 104 L${146+e*120} 130Z" fill="#0f0c07"/><rect x="${80+e*120}" y="160" width="26" height="60" fill="#0a0806"/>`).join("")+'<path d="M92 190 h8 M212 190 h8 M332 190 h8" stroke="#5c5648" stroke-width="4"/><rect x="46" y="240" width="100" height="12" fill="#1a150c"/><text x="200" y="278" text-anchor="middle" font-family="monospace" font-size="9" fill="#44504a">three cabins. ramps. padlocks on the OUTSIDE. a meal cart with six trays</text>'+E("16:10:22",400,300),{aspect:"landscape",base:"#090b08",grain:.13})},evidenceLabel:"The Quiet Cabins: wheelchair ramps, padlocks on the OUTSIDE, a meal cart with six trays"},{id:"c10-ph-marker",caption:"trail marker 31. this is where the bars appear — one, sometimes two, if you hold the phone like an offering",timestamp:"2025-11-01T23:40:00",aspect:"portrait",meta:{takenAt:"2025-11-01T23:40:00",device:"This phone",location:"ridge trail"},svg:s('<rect width="300" height="400" fill="#0a0c0e"/><rect x="135" y="140" width="14" height="220" fill="#26221c"/><rect x="110" y="120" width="80" height="46" rx="4" fill="#2c3626"/><text x="150" y="150" text-anchor="middle" font-family="monospace" font-size="18" fill="#9fe8a0" opacity="0.8">31</text>'+Array.from({length:12},(t,e)=>`<circle cx="${e*53%300}" cy="${e*31%110}" r="1.4" fill="#3f4a58"/>`).join(""),{aspect:"portrait",base:"#080a0c",grain:.15}),evidenceLabel:"Trail marker 31 — the one place on the mountain with signal"},{id:"c10-ph-meadow",caption:"the north meadow. not on the welcome map. not on ANY of their maps. it's right THERE. you can see it from the ridge",timestamp:"2025-11-09T23:50:00",aspect:"landscape",meta:{takenAt:"2025-11-09T23:50:00",device:"This phone",location:"north meadow (final sync batch)"},svg:s('<rect width="400" height="300" fill="#0c1010"/><rect y="180" width="400" height="120" fill="#101609"/><ellipse cx="20
