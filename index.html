<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <!-- iOS: when added to the Home Screen, keep the app below the status bar
         (opaque bar) so the top of the screen is never clipped by the notch. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="COLD CASE" />
    <meta
      name="description"
      content="COLD CASE — explore recovered phones and piece together what happened. A free, offline-capable detective game."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Social link previews (Open Graph + Twitter) so shared links unfurl. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="COLD CASE" />
    <meta property="og:title" content="COLD CASE — a noir detective game" />
    <meta
      property="og:description"
      content="Read a missing person's recovered phone, question the suspects, and file your verdict. 18 cases. Free. Can you crack it?"
    />
    <meta property="og:image" content="og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="COLD CASE — a noir detective game" />
    <meta
      name="twitter:description"
      content="Read a missing person's recovered phone, question the suspects, and file your verdict. Can you crack it?"
    />
    <meta name="twitter:image" content="og.png" />
    <title>COLD CASE</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
